<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Golflev · The Dial — 3D質感サンプル</title>
<style>
*{margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#EFE9DC;font-family:'Inter',-apple-system,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%}
.overlay{position:fixed;top:0;left:0;right:0;text-align:center;padding:26px 16px 0;pointer-events:none;z-index:2}
.eyebrow{font-size:11px;letter-spacing:.24em;color:#B8804C;text-transform:uppercase}
.title{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-style:italic;font-size:34px;color:#1F2A21;margin-top:4px}
.note{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.1em;color:#8A8A82;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="eyebrow">Material Study</div>
  <div class="title">The Dial</div>
</div>
<div class="note">3D質感サンプル — この方向で本体に組み込むかの判断用</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xEFE9DC);
scene.fog=new THREE.Fog(0xEFE9DC,9,18);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,50);
camera.position.set(0,4.4,5.6);
camera.lookAt(0,0,0.2);

/* ── 環境（金属の映り込み用ソフトボックス） ── */
const pmrem=new THREE.PMREMGenerator(renderer);
const envScene=new THREE.Scene();
const room=new THREE.Mesh(new THREE.SphereGeometry(30,16,16),new THREE.MeshBasicMaterial({color:0xf2e9d6,side:THREE.BackSide}));
envScene.add(room);
const soft=(w,h,c,x,y,z,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);m.lookAt(0,0,0);envScene.add(m);};
soft(10,6,0xffffff,0,9,2);
soft(6,8,0xffe9c8,-8,3,-2);
soft(6,8,0xfff6ea,8,4,3);
scene.environment=pmrem.fromScene(envScene).texture;

/* ── ライト ── */
const key=new THREE.DirectionalLight(0xfff2e0,1.15);
key.position.set(3.5,7,3);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=5;key.shadow.camera.bottom=-5;
key.shadow.radius=6;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xfff8ec,0xcdbfa4,0.5));
const rim=new THREE.PointLight(0xC8956C,0.7,20);
rim.position.set(-4,2.2,-3.5);
scene.add(rim);

/* ── 地面（影だけ受ける） ── */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.16}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.10; ground.receiveShadow=true;
scene.add(ground);

/* ── マテリアル ── */
const GOLD=new THREE.MeshStandardMaterial({color:0xC9A06A,metalness:1.0,roughness:0.26});
const GOLD_SOFT=new THREE.MeshStandardMaterial({color:0xB8804C,metalness:0.9,roughness:0.38});
const PAPER=new THREE.MeshStandardMaterial({color:0xF7F1E3,metalness:0.0,roughness:0.62});
const INK=new THREE.MeshStandardMaterial({color:0x1F2A21,metalness:0.35,roughness:0.45});

/* ── 時計本体 ── */
const watch=new THREE.Group();
scene.add(watch);

const face=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.16,96),PAPER);
face.castShadow=true; face.receiveShadow=true;
watch.add(face);

const bezel=new THREE.Mesh(new THREE.TorusGeometry(3.0,0.14,32,128),GOLD);
bezel.rotation.x=Math.PI/2; bezel.position.y=0.06; bezel.castShadow=true;
watch.add(bezel);

const innerRing=new THREE.Mesh(new THREE.TorusGeometry(2.78,0.018,16,128),GOLD_SOFT);
innerRing.rotation.x=Math.PI/2; innerRing.position.y=0.085;
watch.add(innerRing);

// ティック（8/6/4は長く）。pos角θ: 0=手前(6時)、+θ=右
const tickPos=(th,R)=>[Math.sin(th*Math.PI/180)*R,0.10,Math.cos(th*Math.PI/180)*R];
for(let k=0;k<12;k++){
  const th=k*30-180+180; // 0..330
  const a=k*30; const fromFront=((a+180)%360)-180; // -180..180, 0=6時
  const major=(fromFront===0||fromFront===60||fromFront===-60);
  const t=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.03,major?0.34:0.18),major?INK:GOLD_SOFT);
  const [x,y,z]=tickPos(fromFront,major?2.42:2.5);
  t.position.set(x,y,z);
  t.rotation.y=-fromFront*Math.PI/180;
  watch.add(t);
}

// 目標ゾーン（両側 50–70°）
function zoneArc(centerDeg){
  const arc=new THREE.Mesh(new THREE.TorusGeometry(2.6,0.035,12,48,20*Math.PI/180),GOLD);
  arc.rotation.x=-Math.PI/2;
  // トーラスは+X起点で+Z方向へ掃引。中心θc(0=+Z,右=+)→ 方位=90-θc
  const startAz=(90-centerDeg-10)*Math.PI/180;
  arc.rotation.z=startAz; // rotX後のローカルzは世界Yまわり
  arc.position.y=0.10;
  watch.add(arc);
}
zoneArc(60);   // 右=8（ゴルファー視点）
zoneArc(-60);  // 左=4

// 数字 8 / 4（キャンバステクスチャ）
function numeral(txt,th){
  const cv=document.createElement('canvas'); cv.width=cv.height=160;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#1F2A21';
  ctx.font='italic 800 104px Georgia, serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,80,86);
  const tex=new THREE.CanvasTexture(cv);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.62),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  const [x,,z]=tickPos(th,1.95);
  m.position.set(x,0.095,z);
  m.rotation.x=-Math.PI/2;
  m.rotation.z=0;
  watch.add(m);
}
numeral('8',60);
numeral('4',-60);

// アドレス位置（6時）の金ドット
const dot=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,16),GOLD);
dot.position.set(0,0.10,2.6);
watch.add(dot);

/* ── クラブ針 ── */
const hand=new THREE.Group();
hand.position.y=0.13;
watch.add(hand);
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,2.45,24),GOLD);
shaft.rotation.x=Math.PI/2; shaft.position.z=1.225; shaft.castShadow=true;
hand.add(shaft);
// クラブヘッド（先端、わずかに開いた小さなブレード）
const head=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.07,0.16),GOLD);
head.position.set(0.10,0,2.52); head.rotation.y=-0.35; head.castShadow=true;
hand.add(head);
// カウンターウェイト
const tail=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.55,20),GOLD);
tail.rotation.x=Math.PI/2; tail.position.z=-0.32;
hand.add(tail);
const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.16,0.10,32),INK);
cap.position.y=0.02;
hand.add(cap);
const capTop=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,16),GOLD);
capTop.position.y=0.08;
hand.add(capTop);

/* ── お手本スイング（テンポ約2:1）＋上質なカメラの揺らぎ ── */
const easeInOut=u=>u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const easeIn=u=>u*u;
const segs=[ [0,60,950,300,easeInOut], [60,-60,500,750,easeIn], [-60,0,900,650,easeInOut] ];
let si=0,t0=null;
function animate(ts){
  if(t0===null)t0=ts;
  const [a0,a1,dur,hold,ease]=segs[si];
  const dt=ts-t0;
  let d=a1;
  if(dt<=dur) d=a0+(a1-a0)*ease(Math.min(1,dt/dur));
  else if(dt>dur+hold){ si=(si+1)%segs.length; t0=ts; }
  hand.rotation.y=d*Math.PI/180;
  // 微細なカメラの呼吸（高級プロダクト撮影の回転台）
  const t=ts*0.001;
  camera.position.x=Math.sin(t*0.22)*0.45;
  camera.position.y=4.4+Math.sin(t*0.13)*0.08;
  camera.lookAt(0,0,0.2);
  watch.rotation.z=Math.sin(t*0.10)*0.012;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
