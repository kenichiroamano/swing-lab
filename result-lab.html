<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Golflev — Result Lab</title>
<!--
  結果画面の比較ラボ（2026-07-06）。センサー不要のモック。計測ロジックとは無関係。
  案A「幕が上がる」: 準備=写真の世界 → 結果=全画面の暗緑舞台に暗転（チーム推奨）
  案B「写真に重ねる」: 結果も写真の上に暗緑オーバーレイ＋弧
  判定は「計測する」を押すたびに ちょうどいい→スライス→フック と循環。
-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+JP:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#E8E2D4; --paper:#F4EEE2; --ink:#1B2620; --ink-soft:#3A453C;
  --green-1:#243229; --green-2:#18211B; --stage:#0d130f;
  --brass:#A98F58; --brass-hi:#CBB079; --brass-lo:#876F40; --champagne:#E4D6BA;
  --sub:#8C8676; --hair-gold:rgba(169,143,88,.4);
  --slice:#C45B4A; --hook:#D4A040; --ok-d:#E4D6BA;
  --serif:'Cormorant Garamond',Georgia,serif; --jp:'Noto Serif JP',serif; --ui:'Inter',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{ background:var(--bone); color:var(--ink); font-family:var(--ui); min-height:100vh; overflow-x:hidden }
.hide{ display:none !important }

/* ---- 入口 ---- */
#home{ max-width:430px; margin:0 auto; padding:56px 22px 40px }
.brand{ text-align:center; font-family:var(--serif); font-weight:600; font-size:14px; letter-spacing:.46em; text-indent:.46em }
.brand b{ color:var(--brass) }
h1{ font-family:var(--jp); font-weight:500; font-size:22px; text-align:center; margin-top:14px }
.note{ font-family:var(--jp); font-size:13px; color:var(--sub); text-align:center; line-height:1.8; margin-top:8px }
.card{ background:var(--paper); border:1px solid var(--hair-gold); border-radius:16px; padding:20px 18px; margin-top:16px; cursor:pointer }
.card .tag{ display:inline-block; font-family:var(--serif); font-weight:600; font-size:13px; letter-spacing:.08em;
  color:var(--paper); background:var(--brass); border-radius:8px; padding:3px 12px }
.card h3{ font-family:var(--jp); font-size:17px; font-weight:500; margin-top:8px }
.card p{ font-family:var(--jp); font-size:13px; color:var(--sub); line-height:1.8; margin-top:4px }

/* ---- 準備の世界（写真） ---- */
#photoWorld{ position:fixed; inset:0; z-index:1 }
#photoWorld img{ width:100%; height:58vh; object-fit:cover; object-position:center 18%; display:block;
  -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 62%,transparent 100%) }
#photoWorld .body{ position:absolute; top:52vh; left:0; right:0; text-align:center; padding:0 26px }
.ph{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:31px; color:var(--ink) }
.lead{ font-family:var(--jp); font-size:16.5px; color:var(--ink-soft); margin-top:10px; line-height:1.85 }
.btn{ display:block; width:100%; max-width:380px; margin:18px auto 0; padding:15px; cursor:pointer; border-radius:10px;
  font-family:var(--ui); font-size:15px; font-weight:500; letter-spacing:.2em; border:1px solid var(--brass);
  background:linear-gradient(155deg,var(--green-1),var(--green-2)); color:var(--champagne); border-color:transparent;
  box-shadow:0 18px 36px -18px rgba(18,26,21,.5) }
.btn[disabled]{ opacity:.5 }
.backLink{ position:fixed; top:14px; left:14px; z-index:40; font-size:13px; color:var(--ink);
  background:rgba(244,238,226,.85); border:1px solid rgba(27,38,32,.12); border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--ui) }
/* 計測中：呼吸する金のライン */
.breath{ width:120px; height:2px; margin:26px auto 0; background:var(--brass); opacity:0; border-radius:2px }
.measuring .breath{ opacity:1; animation:br 1.6s ease-in-out infinite }
@keyframes br{ 0%,100%{ transform:scaleX(.35); opacity:.35 } 50%{ transform:scaleX(1); opacity:.9 } }

/* ---- 結果の世界 ---- */
#stageWrap{ position:fixed; inset:0; z-index:20; opacity:0; pointer-events:none; transition:opacity .6s ease }
#stageWrap.on{ opacity:1; pointer-events:auto }
#stageWrap.modeA{ background:var(--stage) }
#stageWrap.modeB{ background:transparent }
#stageWrap .ovl{ position:absolute; inset:0; background:rgba(13,19,15,.74); display:none }
#stageWrap.modeB .ovl{ display:block }
#cv{ position:absolute; inset:0; width:100%; height:100% }
#resTx{ position:absolute; left:0; right:0; bottom:calc(96px + env(safe-area-inset-bottom)); text-align:center; padding:0 26px }
.verdict{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:33px; line-height:1.3; color:var(--champagne) }
.verdict.slice{ color:var(--slice) } .verdict.hook{ color:var(--hook) }
.vtip{ font-family:var(--jp); font-size:16px; color:rgba(228,214,186,.85); margin-top:10px; line-height:1.8 }
.btnAgain{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(30px + env(safe-area-inset-bottom));
  width:min(380px, calc(100% - 52px)); padding:14px; border-radius:10px; cursor:pointer;
  font-family:var(--ui); font-size:14px; letter-spacing:.2em; color:var(--champagne);
  background:transparent; border:1px solid rgba(169,143,88,.55) }
</style>
</head>
<body>
<script>window.__err=[];window.addEventListener('error',function(e){window.__err.push(String(e.message||e))});</script>

<section id="home">
  <div class="brand">GOLF<b>LEV</b> LAB</div>
  <h1>結果画面の比較</h1>
  <p class="note">「基準ができました→計測する→結果」の流れのモックです。<br>計測はしません。判定は押すたびに3種類が入れ替わります。</p>
  <div class="card" onclick="enter('A')">
    <span class="tag">案 A</span>
    <h3>幕が上がる</h3>
    <p>準備は写真の世界。結果の瞬間だけ、画面全体が暗い緑の舞台に変わり、金の弧が描かれる。</p>
  </div>
  <div class="card" onclick="enter('B')">
    <span class="tag">案 B</span>
    <h3>写真に重ねる</h3>
    <p>写真は居続けて、その上に暗い緑を透かして弧を重ねる。世界がつながったまま。</p>
  </div>
</section>

<button class="backLink hide" id="backBtn" onclick="leave()">← ラボ</button>

<!-- 準備の世界 -->
<div id="photoWorld" class="hide">
  <img id="phImg" src="golflev-la-swing.jpg" alt="" onerror="this.style.display='none'">
  <div class="body" id="phBody">
    <div class="ph" id="phTitle">基準ができました</div>
    <div class="lead" id="phLead">「計測する」を押して、1球振ってください。</div>
    <div class="breath"></div>
    <button class="btn" id="btnGo" onclick="measure()">計測する</button>
  </div>
</div>

<!-- 結果の世界 -->
<div id="stageWrap">
  <div class="ovl"></div>
  <canvas id="cv"></canvas>
  <div id="resTx">
    <div class="verdict" id="verdict"></div>
    <div class="vtip" id="vtip"></div>
  </div>
  <button class="btnAgain" id="btnAgain" onclick="again()">もう一度</button>
</div>

<script>
var MODE=null, resIdx=0, busy=false;
var RES=[
  {cls:'',      col:'#E4D6BA', v:'まっすぐ、芯で戻りました', tip:'今の感覚を、そのまま覚えておきましょう。', dev:0},
  {cls:'slice', col:'#C45B4A', v:'フェースが開いて戻りました', tip:'インパクトで、ほんの少し手を返すように。', dev:1},
  {cls:'hook',  col:'#D4A040', v:'フェースが閉じて戻りました', tip:'力を抜いて、ゆったりと振り抜きましょう。', dev:-1}
];
function $(id){return document.getElementById(id);}

function enter(mode){
  MODE=mode; resIdx=0;
  $('home').classList.add('hide');
  $('photoWorld').classList.remove('hide');
  $('backBtn').classList.remove('hide');
  $('stageWrap').className = 'mode'+mode;
  readyState();
}
function leave(){
  $('photoWorld').classList.add('hide');
  $('backBtn').classList.add('hide');
  $('stageWrap').className='';
  $('home').classList.remove('hide');
}
function readyState(){
  document.body.classList.remove('measuring');
  $('phTitle').textContent='基準ができました';
  $('phLead').textContent='「計測する」を押して、1球振ってください。';
  $('btnGo').classList.remove('hide');
}
function measure(){
  if(busy) return; busy=true;
  document.body.classList.add('measuring');
  $('phTitle').textContent='計測中';
  $('phLead').textContent='ゆっくり、振り抜いてください。';
  $('btnGo').classList.add('hide');
  setTimeout(showResult, 1700);
}
function showResult(){
  var r=RES[resIdx%3]; resIdx++;
  $('verdict').textContent=r.v; $('verdict').className='verdict '+r.cls;
  $('vtip').textContent=r.tip;
  var w=$('stageWrap'); w.className='mode'+MODE+' on';
  $('btnAgain').disabled=true;
  drawArc(r, function(){ $('btnAgain').disabled=false; busy=false; });
}
function again(){
  var w=$('stageWrap'); w.className='mode'+MODE; // 暗転解除（transitionで戻る）
  document.body.classList.remove('measuring');
  readyState();
}

/* ── モックの金の弧（振り子・描画のみ） ── */
function drawArc(r, done){
  var cv=$('cv'), dpr=Math.min(2, window.devicePixelRatio||1);
  var W=cv.clientWidth||360, H=cv.clientHeight||640;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  // 振り子の弧：上部中央を支点に、左上→最下点→右上
  var cx=W/2, cy=H*0.14, R=H*0.52;
  var A0=-62*Math.PI/180, A1=62*Math.PI/180, N=120;
  var dev=(r.dev||0)*0.10; // 開き/閉じで終端をわずかにずらす（見た目の差だけ）
  var pts=[];
  for(var i=0;i<=N;i++){
    var t=i/N, th=A0+(A1-A0+dev)*t;
    pts.push({x:cx+R*Math.sin(th), y:cy+R*Math.cos(th), t:t});
  }
  var start=null, DUR=1300, ended=false;
  function frame(ts){
    if(ended) return;
    if(!start) start=ts;
    var p=Math.min(1,(ts-start)/DUR);
    var head=Math.max(2, Math.floor(p*N));
    ctx.clearRect(0,0,W,H);
    // 弧の軌跡（尾は薄く・頭に向けて濃く）
    for(var i=1;i<=head;i++){
      var a=pts[i-1], b=pts[i], k=i/head;
      ctx.strokeStyle='rgba(203,176,121,'+(0.12+0.55*k)+')';
      ctx.lineWidth=1.2+3.2*k;
      ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    // 最下点（インパクト）の光
    var bi=Math.round(N*( -A0/(A1-A0+dev) ));
    if(head>=bi && pts[bi]){
      var q=pts[bi], g=Math.min(1,(head-bi)/14);
      ctx.shadowColor=r.col; ctx.shadowBlur=22*g;
      ctx.fillStyle=r.col; ctx.beginPath(); ctx.arc(q.x,q.y,5.5*g+2,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(q.x,q.y,1.8,0,7); ctx.fill();
    }
    if(p<1) requestAnimationFrame(frame); else { ended=true; done&&done(); }
  }
  requestAnimationFrame(frame);
  // 保険: rAFが止まる環境（非アクティブタブ等）でも最後は必ず全描画
  setTimeout(function(){ if(!ended){ start=-1e9; frame(performance.now()); } }, DUR+450);
}
</script>
</body>
</html>
