<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Golflev · The Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=18">
<style>
/* grip.html — グリップ無料フック（Lesson 00 / The Setup）
   測らない＝"見せる"教材。実写は準備中につき、空プレースホルダ枠＋ゴールド指示線のみ。
   既存idiom厳守: 金は線・縁のみ／Playfair斜体／ヘアライン／クリーム。計測UIは置かない。 */
.screen{display:block}
.grip-top{display:flex;align-items:center;min-height:36px}
.grip-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);
  font-family:'Noto Serif JP',serif;font-size:12px;letter-spacing:.06em;cursor:pointer;padding:6px 4px}
.grip-back i{font-style:normal}
.intro-jp{font-family:'Noto Serif JP',serif;font-weight:300;font-size:13px;line-height:1.95;text-align:center;color:var(--ink);margin-top:14px}
.not-measure{font-size:11px;color:var(--sub);text-align:center;line-height:1.8;letter-spacing:.02em;margin-top:14px;
  border-top:1px solid rgba(184,128,76,.3);border-bottom:1px solid rgba(184,128,76,.3);padding:11px 6px}

/* お手本: 実写プレースホルダ枠（額装はRehaut＝金縁）＋ゴールド指示線SVG */
.show-frame{position:relative;width:100%;border-radius:16px;overflow:hidden;background:var(--paper);
  border:1px solid rgba(31,42,33,.12);margin-top:18px}
.show-frame .ph{position:relative;width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.show-frame .ph .ph-mk{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:var(--gold);letter-spacing:.04em}
.show-frame .ph .ph-tx{font-family:'Noto Serif JP',serif;font-weight:300;font-size:11px;color:var(--sub);margin-top:8px;letter-spacing:.06em}
.show-frame svg.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rehaut{position:absolute;inset:7px;border:1.4px solid var(--gold);border-radius:11px;pointer-events:none}
.show-cap{font-family:'Noto Serif JP',serif;font-weight:300;font-size:11px;line-height:1.7;text-align:center;color:var(--ink);margin-top:12px}
.handed{font-size:10px;color:var(--sub);text-align:center;line-height:1.7;margin-top:8px;letter-spacing:.02em}

/* 見るポイント（非採点・採点UIなし） */
/* 章立て（I 握り / II 立ち方）。英語名は増やさず日本語見出しで仕切る */
.part-label{display:flex;align-items:baseline;gap:11px;justify-content:center;margin-top:38px;
  font-family:'Noto Serif JP',serif;font-size:14px;color:var(--ink);letter-spacing:.22em}
.part-label .pno{font-family:'Playfair Display',serif;font-style:italic;font-size:21px;color:var(--gold);letter-spacing:0}
.part-rule{width:40px;height:1px;background:var(--gold);opacity:.5;margin:10px auto 0}
.pts-title{font-family:'Playfair Display',serif;font-weight:600;font-size:22px;text-align:center;margin-top:30px;letter-spacing:.01em}
.pt{display:flex;gap:14px;padding:15px 0;border-top:1px solid rgba(31,42,33,.10)}
.pt:last-of-type{border-bottom:1px solid rgba(31,42,33,.10)}
.pt .no{font-family:'Playfair Display',serif;font-style:italic;font-size:25px;color:var(--gold);line-height:1;min-width:22px;text-align:center}
.pt .ttl{font-family:'Noto Serif JP',serif;font-weight:600;font-size:14px;color:var(--ink)}
.pt .bd{font-family:'Noto Serif JP',serif;font-weight:300;font-size:11.5px;color:var(--ink);opacity:.82;line-height:1.7;margin-top:5px}
.pts-note{font-family:'Noto Serif JP',serif;font-weight:300;font-size:11px;color:var(--sub);text-align:center;margin-top:14px;letter-spacing:.02em}

/* 立ち方の図解（前面人物図＋足元図）＋スペック表 */
.stance-sub{text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:17px;margin-top:6px;color:var(--ink)}
.stance-photo-frame{padding:0;background:var(--paper)}
.stance-photo{display:block;width:100%;height:auto;border-radius:16px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin-top:16px}
.spec .l{font-family:'Noto Serif JP',serif;font-size:12px;color:var(--gold);white-space:nowrap}
.spec .v{font-family:'Noto Serif JP',serif;font-weight:300;font-size:11.5px;color:var(--ink);line-height:1.65}

/* 締め: コア（ピッチ）への橋渡し */
.cta-wrap{margin-top:30px;text-align:center}
.cta-bridge{font-family:'Noto Serif JP',serif;font-weight:300;font-size:12px;color:var(--ink);opacity:.8}
.cta-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:20px;margin-top:6px}
.cta-gold{display:block;width:100%;margin-top:18px;padding:15px;cursor:pointer;background:transparent;
  border:1px solid var(--gold);border-radius:11px;color:var(--gold);
  font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.26em;transition:background .2s ease}
.cta-gold:active{background:rgba(184,128,76,.12)}
</style>
</head>
<body>
<div class="screen active">

  <div class="grip-top">
    <button class="grip-back" id="backTop"><i>‹</i><span id="backTxt"></span></button>
  </div>

  <div class="eyebrow" id="eyebrow" style="margin-top:8px"></div>
  <h1 class="title-en" id="titleEn"></h1>
  <div class="intro-jp" id="intro"></div>
  <div class="not-measure" id="notMeasure"></div>

  <!-- ── Part I 握り ── -->
  <div class="part-label"><span class="pno" id="p1no"></span><span id="p1label"></span></div>
  <div class="part-rule"></div>

  <!-- お手本＝クラブの握りの線画クローズアップ（Firefly生成・onboard同タッチ）。立ち方と同じ金縁の作法 -->
  <div class="show-frame stance-photo-frame">
    <img class="stance-photo" src="assets/onboard-grip-close.png" alt="クラブの握りのお手本">
    <div class="rehaut"></div>
  </div>
  <div class="show-cap" id="gripCap"></div>
  <div class="handed" id="handed"></div>

  <!-- 見るポイント -->
  <div class="pts-title" id="ptsTitle"></div>
  <div class="hairline"></div>
  <div id="pts"></div>
  <div class="pts-note" id="ptsNote"></div>

  <!-- ── Part II 立ち方 ── -->
  <div class="part-label"><span class="pno" id="p2no"></span><span id="p2label"></span></div>
  <div class="part-rule"></div>

  <div class="stance-sub" id="stanceSub"></div>

  <!-- お手本＝2Dラインアート（無顔アドレス）。ホームの紙・線・余白の世界と一致 -->
  <div class="show-frame stance-photo-frame">
    <img class="stance-photo" src="assets/onboard-grip-pose.png" alt="アドレス（構え）のお手本">
    <div class="rehaut"></div>
  </div>
  <div class="show-cap" id="stanceCap"></div>

  <div class="spec" id="stanceSpec"></div>
  <div class="pts-note" id="stanceNote"></div>

  <!-- 締め -->
  <div class="cta-wrap">
    <div class="cta-bridge" id="ctaBridge"></div>
    <div class="cta-title" id="ctaTitle"></div>
    <button class="cta-gold" id="ctaPitch"></button>
    <button class="link-btn" id="ctaHome"></button>
  </div>

</div>

<script src="strings.js?v=18"></script>
<script>
const $=id=>document.getElementById(id);
const T=k=>STR.t(k);
$('backTxt').textContent=T('grip.back');
$('eyebrow').textContent=T('grip.eyebrow');
$('titleEn').innerHTML='<em>'+T('grip.title.en')+'</em>';
$('intro').innerHTML=T('grip.intro');
$('notMeasure').textContent=T('grip.notMeasure');
$('gripCap').textContent=T('grip.show.modelCap');
$('handed').textContent=T('grip.handedness');
$('p1no').textContent=T('grip.part1.no');
$('p1label').textContent=T('grip.part1.label');
$('ptsTitle').textContent=T('grip.check.title');
$('ptsNote').textContent=T('grip.check.note');
$('p2no').textContent=T('grip.part2.no');
$('p2label').textContent=T('grip.part2.label');
$('stanceSub').textContent=T('grip.stance.sub');
$('stanceCap').textContent=T('grip.stance.caption');
$('stanceNote').textContent=T('grip.stance.note');
// 立ち方スペック（足幅/体重/距離/前傾/ボール）
$('stanceSpec').innerHTML=['s1','s2','s3','s4','s5'].map(k=>
  '<div class="l">'+T('grip.stance.'+k+'.l')+'</div><div class="v">'+T('grip.stance.'+k+'.v')+'</div>').join('');
$('ctaBridge').textContent=T('grip.cta.bridge');
$('ctaTitle').textContent=T('grip.cta.title');
$('ctaPitch').textContent=T('grip.cta.btn');
$('ctaHome').textContent=T('grip.cta.home');

// 見るポイント（非採点・チェックボックスなし＝"測った風"を避ける）
function renderPts(targetId, keyBase){
  let html='';
  for(let i=1;i<=3;i++){
    html+='<div class="pt"><div class="no">'+i+'</div><div>'+
          '<div class="ttl">'+T(keyBase+'.'+i+'.title')+'</div>'+
          '<div class="bd">'+T(keyBase+'.'+i+'.body')+'</div></div></div>';
  }
  $(targetId).innerHTML=html;
}
renderPts('pts','grip.check');         // Part I 握り（見るポイント3点）

$('backTop').onclick=()=>location.href='home-v3.html';
$('ctaHome').onclick=()=>location.href='home-v3.html';
$('ctaPitch').onclick=()=>location.href='drill-pitch.html';
</script>
</body>
</html>
