<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Golflev</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Playfair+Display:ital,wght@0,500;0,600&family=Noto+Serif+JP:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE9DC; --paper:#F7F1E3; --ink:#1F2A21; --ink-soft:#3A453C;
  --brass:#B8804C; --brass-2:#C8956C; --champagne:#E4D6BA;
  --ok:#4A6B4A; --sub:#8A8A82;
  --serif:'Cormorant Garamond','Playfair Display','Noto Serif JP',Georgia,serif;
  --jp:'Noto Serif JP',serif; --ui:'Inter',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{background:var(--bg);font-family:var(--ui);color:var(--ink);overflow:hidden}
.stage{position:relative;width:100%;max-width:480px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:#0d130f}
.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;
  animation:kb 26s ease-in-out infinite alternate;transform-origin:52% 62%}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.11)}}
/* 上＝陽光ウォッシュ（見出しの可読性）／下＝クリームへ溶ける */
.wash-top{position:absolute;left:0;right:0;top:0;height:52%;pointer-events:none;
  background:linear-gradient(to bottom, rgba(247,241,227,.72), rgba(247,241,227,.30) 45%, rgba(247,241,227,0))}
.wash-bot{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(to top, var(--bg) 4%, rgba(239,233,220,.85) 22%, rgba(239,233,220,0))}
.content{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(24px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom))}
.topbar{font-family:var(--ui);font-size:10px;letter-spacing:.42em;color:var(--brass);text-align:center;font-weight:500}
.hero-copy{margin-top:26px;text-align:center}
.overline{font-family:var(--ui);font-size:11px;letter-spacing:.34em;color:var(--ink-soft);font-weight:500}
.headline{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.08;color:var(--ink);margin-top:12px;letter-spacing:.01em}
.headline em{font-style:italic;color:var(--brass)}
.sub{font-family:var(--jp);font-size:13px;color:var(--ink-soft);margin-top:14px;letter-spacing:.06em}
.spacer{flex:1}
.lastcard{background:rgba(247,241,227,.62);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
  border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:14px 18px;
  box-shadow:0 18px 40px -22px rgba(31,42,33,.5)}
.lc-label{font-family:var(--ui);font-size:10px;letter-spacing:.22em;color:var(--sub);text-transform:uppercase}
.lc-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.lc-verdict{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--ink)}
.lc-tag{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ok)}
.lc-tag b{color:var(--ok);font-weight:600}
.cta{display:flex;align-items:center;justify-content:center;margin-top:14px;height:54px;border-radius:15px;
  background:linear-gradient(150deg,var(--brass-2),var(--brass));color:#FBF6EC;text-decoration:none;
  font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.22em;
  box-shadow:0 20px 40px -18px rgba(184,128,76,.7), inset 0 1px 0 rgba(255,255,255,.25)}
.cta:active{transform:scale(.985)}
.foot{font-family:var(--jp);font-size:10.5px;color:var(--sub);text-align:center;margin-top:12px;letter-spacing:.05em}
/* 夜（暖色）のときは上ウォッシュを少しだけ暖色寄り＆濃く（金の空でも見出しが読める） */
body.night .wash-top{background:linear-gradient(to bottom, rgba(244,238,226,.66), rgba(244,238,226,.26) 46%, rgba(244,238,226,0))}
</style>
</head>
<body>
<div class="stage">
  <img id="hero" class="hero" src="home-day.jpg" alt="">
  <div class="wash-top"></div>
  <div class="wash-bot"></div>
  <div class="content">
    <div class="topbar">SWING&nbsp;&nbsp;STUDIO</div>
    <div class="hero-copy">
      <div class="overline" id="greet">GOOD MORNING</div>
      <h1 class="headline">静かに、<em>芯</em>で。</h1>
      <p class="sub">今日の一振りを、はじめましょう。</p>
    </div>
    <div class="spacer"></div>
    <div class="lastcard">
      <div class="lc-label">前回のスイング</div>
      <div class="lc-row">
        <span class="lc-verdict">ちょうどいい返り</span>
        <span class="lc-tag"><b>● On&nbsp;Line</b></span>
      </div>
    </div>
    <a class="cta" href="living-arc.html">素振りを始める</a>
    <div class="foot">球もカメラもいらない。スマホを、グリップのように。</div>
  </div>
</div>
<script>
(function(){
  var h=new Date().getHours();
  var day=(h>=7 && h<16);
  var hero=document.getElementById('hero');
  if(hero) hero.src = day ? 'home-day.jpg' : 'home-night.jpg';
  if(!day) document.body.classList.add('night');
  var g=document.getElementById('greet');
  if(g){ g.textContent = (h<5)?'GOOD NIGHT':(h<11)?'GOOD MORNING':(h<16)?'GOOD AFTERNOON':(h<21)?'GOOD EVENING':'GOOD NIGHT'; }
})();
</script>
</body>
</html>
