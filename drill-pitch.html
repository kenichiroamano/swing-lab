<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Golflev · The Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,800&family=Noto+Serif+JP:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
/* The Pitch v6 — 3Dステージ統合（白磁のゴルファー × 時計の文字盤 × 計測スクラブ） */
.stage3d{width:100%;height:46vh;min-height:300px;position:relative;margin:4px 0}
.stage3d canvas{width:100%!important;height:100%!important;display:block}
.stage-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#B8804C;font-size:11px;letter-spacing:.22em}
.live-chip-area{min-height:34px;text-align:center;margin-top:4px}
/* ── The Rehaut：時計の縁の金弧で状態を語る（帯/ピル/点滅/直線バーは使わない） ── */
/* 文字盤の縁取り弧。計測中＝静かに灯る／リプレイ＝満ちていく。3Dには触れずSVGオーバーレイ1枚 */
#rehaut,#rehautReview{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#rehaut rect,#rehautReview rect{fill:none}
.rh-base{stroke:rgba(31,42,33,.10);stroke-width:1.4}
.rh-act{stroke:var(--gold);stroke-width:1.6;opacity:0;transition:opacity .3s ease}
#stageLive.rh-lit .rh-act{opacity:1}
#stageLive.rh-glow{box-shadow:inset 0 0 0 1px rgba(184,128,76,.26),0 0 26px -8px rgba(184,128,76,.48)} /* 計測中の静かな発光 */
/* モード見出し（文字盤上の英字キャプス。計測中=Inter / リプレイ=Playfair斜体） */
#liveEb{position:absolute;top:14px;left:0;right:0;z-index:7;text-align:center;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);min-height:15px;transition:opacity .2s ease}
#liveEb.it{font-family:'Playfair Display',serif;font-style:italic;text-transform:none;letter-spacing:.1em;font-size:14px}
/* 指示は紙の上にインクの明朝で大きく。帯で殴らず、ヘアラインで彫像と分ける */
#liveCue{text-align:center;margin:12px 0 2px}
#liveHairline{width:42px;height:1px;background:var(--gold);margin:0 auto 11px;position:relative;opacity:.85}
#liveHairline::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:1px;background:rgba(184,128,76,.42)}
.live-state{font-family:'Noto Serif JP',serif;font-weight:600;font-size:clamp(27px,7.6vw,34px);line-height:1.2;letter-spacing:.01em;color:var(--ink);transition:color .2s ease;min-height:1.2em}
.live-state.waiting{color:var(--sub)}
.live-state.armed{color:var(--ink)}
.live-state.measuring{color:var(--ok)}
#liveSub{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);margin-top:7px;min-height:14px}
.live-chip-area .chip{font-size:14px;padding:9px 18px}
/* ── 結果画面の Review：3球を刻印番号の札で選び、その球だけ3Dで見返す ── */
.review-h{text-align:center;font-family:'Noto Serif JP',serif;font-weight:600;font-size:19px;color:var(--ink);margin:7px 0 18px;letter-spacing:.02em}
.review-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
.review-card{position:relative;padding:15px 6px 13px;text-align:center;border-radius:11px;background:transparent;cursor:pointer}
.review-card .top{position:absolute;left:14px;right:14px;top:0;height:1.5px}
.review-card.sel{background:var(--paper);box-shadow:inset 0 0 0 1px rgba(184,128,76,.30),0 1px 2px rgba(31,42,33,.05)}
.review-card .num{font-family:'Playfair Display',serif;font-style:italic;font-size:27px;color:var(--sub);line-height:1}
.review-card.sel .num{color:var(--ink)}
.review-card .deg{font-size:13px;color:var(--sub);margin-top:5px;font-variant-numeric:tabular-nums}
.review-card .tag{font-size:9.5px;color:var(--err);margin-top:3px;letter-spacing:.08em;min-height:12px}
.review-stage{height:34vh;min-height:260px;display:none}
.review-stage.open{display:block}
#stageReview .rh-act{opacity:1}
#reviewRep{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:14px;letter-spacing:.1em;color:var(--gold);z-index:7}
.review-anchor{text-align:center;font-family:'Noto Serif JP',serif;font-size:14px;color:var(--ink);margin-top:12px;display:none}
.review-anchor.open{display:block}
.review-links{text-align:center;margin-top:2px;display:none}
.review-links.open{display:block}
.review-links .link-btn{display:inline-block;margin:8px 11px 0}
.review-card.disabled{opacity:.45;cursor:default}
#liveDim{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(20,26,21,.92);opacity:0;pointer-events:none;transition:opacity .16s ease;border-radius:14px}
#liveDim.on{opacity:1}
#liveDim span{color:var(--gold);font-family:'Noto Serif JP',serif;font-size:21px;font-weight:600;letter-spacing:.08em}
.swing-count{font-size:12px;color:var(--sub);letter-spacing:.14em;text-align:center}
.rank-word{font-family:'Playfair Display',serif;font-weight:800;font-style:italic;font-size:46px;text-align:center;line-height:1.1}
.rank-word.warn{color:var(--err)}
.issue.selected{background:rgba(184,128,76,.07);border-radius:10px;padding-left:8px;padding-right:8px}
#focusNote{display:none}
#focusNote.show{display:block}
.stat-anim{opacity:0;transform:translateY(6px);transition:all .5s cubic-bezier(.22,.61,.36,1)}
.stat-anim.in{opacity:1;transform:none}
</style>
<script>window.__err=[];window.onerror=m=>window.__err.push(String(m));</script>

<!-- ② センサー許可 -->

      <div class="stat-anim"><b id="statMean">—</b><span id="statMeanLabel"></span></div>

    </div>

  <!-- Review：3球を個別に見返す -->
  <div id="reviewBlock" style="display:none;margin-top:22px">

<!-- ════════════ 3Dステージ（時計の文字盤 × 白磁のゴルファー × 計測スクラブ） ════════════ -->
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const Stage={ready:false, mode:'demo', queue:[]};
window.Stage3D=Stage;

const isMobile=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.2:1.75));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.84;
const canvas=renderer.domElement;

const scene=new THREE.Scene(); // 背景透過＝ページのクリームが生きる
const camera=new THREE.PerspectiveCamera(38,1,0.1,60);
camera.position.set(0,2.1,5.0);
camera.lookAt(0,0.85,0);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const key=new THREE.DirectionalLight(0xfff0dd,2.0);
key.position.set(2.5,6,3);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=5;key.shadow.camera.bottom=-1;
key.shadow.radius=6; key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.PointLight(0xC8956C,12,18);
rim.position.set(-3.5,2,-3);
scene.add(rim);

// 影だけ受ける床（透明）
const shadowGround=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.15}));
shadowGround.rotation.x=-Math.PI/2; shadowGround.receiveShadow=true;
scene.add(shadowGround);

/* ── 時計の文字盤ステージ（観客視点: 8=左, 4=右） ── */
const R=2.55;
const GOLD=new THREE.MeshStandardMaterial({color:0xc09455,metalness:1.0,roughness:0.18,envMapIntensity:1.2});
const GOLD_SOFT=new THREE.MeshStandardMaterial({color:0xa9803f,metalness:1.0,roughness:0.3,envMapIntensity:1.05});
const INK=new THREE.MeshStandardMaterial({color:0x1F2A21,metalness:0.4,roughness:0.4});

function dialTexture(){
  const S=1024, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const x=cv.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,40,S/2,S/2,S/2);
  g.addColorStop(0,'#FBF6E9'); g.addColorStop(.75,'#F5EEDD'); g.addColorStop(1,'#EFE6D0');
  x.fillStyle=g; x.fillRect(0,0,S,S);
  x.save(); x.translate(S/2,S/2); x.globalAlpha=.05; x.strokeStyle='#8a7a56'; x.lineWidth=1;
  for(let i=0;i<240;i++){ x.rotate(Math.PI*2/240); x.beginPath(); x.moveTo(60,0); x.lineTo(S/2-30,0); x.stroke(); }
  x.restore();
  x.save(); x.translate(S/2,S/2); x.strokeStyle='rgba(31,42,33,.5)';
  for(let i=0;i<60;i++){
    const major=i%5===0;
    x.lineWidth=major?3:1.5; x.beginPath();
    x.moveTo(0,major?-418:-424); x.lineTo(0,-436); x.stroke();
    x.rotate(Math.PI*2/60);
  }
  x.restore();
  // 観客視点: ゴルファーが正面を向くため、バックは画面左 → 8=左, 4=右
  x.fillStyle='#1F2A21'; x.textAlign='center'; x.textBaseline='middle';
  x.font='italic 800 120px Georgia, serif';
  const NR=320;
  x.fillText('8', S/2-Math.sin(Math.PI/3)*NR, S/2+Math.cos(Math.PI/3)*NR);
  x.fillText('4', S/2+Math.sin(Math.PI/3)*NR, S/2+Math.cos(Math.PI/3)*NR);
  x.font='600 30px Inter, sans-serif'; x.fillStyle='rgba(31,42,33,.8)';
  x.save(); x.translate(S/2,S/2-210); x.letterSpacing='12px'; x.fillText('G O L F L E V',6,0); x.restore();
  x.font='500 19px Inter, sans-serif'; x.fillStyle='rgba(184,128,76,.9)';
  x.fillText('T H E   P I T C H', S/2+3, S/2-168);
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  return tex;
}

const stageG=new THREE.Group();
scene.add(stageG);
const facePlate=new THREE.Mesh(new THREE.CylinderGeometry(R,R+0.03,0.12,128),
  new THREE.MeshStandardMaterial({color:0xE3D8C0,roughness:.55,envMapIntensity:.5}));
facePlate.position.y=0.06; facePlate.receiveShadow=true; facePlate.castShadow=true;
stageG.add(facePlate);
const print=new THREE.Mesh(new THREE.CircleGeometry(R-0.13,128),
  new THREE.MeshPhysicalMaterial({map:dialTexture(),roughness:.55,clearcoat:.4,clearcoatRoughness:.4,envMapIntensity:.35}));
print.rotation.x=-Math.PI/2; print.position.y=0.125;
print.receiveShadow=true;
stageG.add(print);
const bezel=new THREE.Mesh(new THREE.TorusGeometry(R+0.01,0.10,40,160),GOLD);
bezel.rotation.x=Math.PI/2; bezel.position.y=0.10; bezel.castShadow=true;
stageG.add(bezel);

// 座標系: θ=0が手前(6時)、+θ=画面右
const dialPos=(th,rad)=>[Math.sin(th*Math.PI/180)*rad,0,Math.cos(th*Math.PI/180)*rad];

// 目標ゾーン（観客視点: バック=左=θ負, フォロー=右=θ正）
function zoneArc(centerDeg){
  const pts=[];
  for(let a=centerDeg-10;a<=centerDeg+10;a+=2.5){
    const [x,,z]=dialPos(a,R-0.30);
    pts.push(new THREE.Vector3(x,0.135,z));
  }
  const arc=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,0.03,10,false),GOLD);
  stageG.add(arc);
}
zoneArc(-60); zoneArc(60);
{ const [dx,,dz]=dialPos(0,R-0.30);
  const dot=new THREE.Mesh(new THREE.SphereGeometry(0.045,20,20),GOLD);
  dot.position.set(dx,0.135,dz); stageG.add(dot); }

/* ── 縦アーク振り幅ゲージ（demo-lab v3でken承認 2026-06-12） ──
   支点=手元(1.12m)、半径=クラブ相当(0.81m)。クラブヘッドの実軌道に重なる。
   光球=計測シャフト角。±55°到達で金ゾーン（8時/4時、10°幅）が点灯。言葉なしで伝わる */
const ARC_R=0.81, ARC_CY=1.12, ARC_Z=-0.55, d2rA=Math.PI/180;
const arcGroup=new THREE.Group();
arcGroup.position.set(0,ARC_CY,ARC_Z);
scene.add(arcGroup);
const arcMat=new THREE.MeshStandardMaterial({color:0xB8804C,metalness:.9,roughness:.35,transparent:true,opacity:.38});
const arcMesh=new THREE.Mesh(new THREE.TorusGeometry(ARC_R,0.011,10,96,144*d2rA),arcMat);
arcMesh.rotation.z=198*d2rA;
arcGroup.add(arcMesh);
const zoneMatL=new THREE.MeshStandardMaterial({color:0xC8956C,metalness:1,roughness:.22,emissive:0xC8956C,emissiveIntensity:.25});
const zoneMatR=zoneMatL.clone();
const zoneVL=new THREE.Mesh(new THREE.TorusGeometry(ARC_R,0.025,12,24,10*d2rA),zoneMatL);
zoneVL.rotation.z=205*d2rA;  // θ=-65°..-55°（8時）
const zoneVR=new THREE.Mesh(new THREE.TorusGeometry(ARC_R,0.025,12,24,10*d2rA),zoneMatR);
zoneVR.rotation.z=325*d2rA;  // θ=+55°..+65°（4時）
arcGroup.add(zoneVL,zoneVR);
const gaugeBall=new THREE.Mesh(new THREE.SphereGeometry(0.04,24,24),
  new THREE.MeshStandardMaterial({color:0xF7F1E3,metalness:.2,roughness:.15,emissive:0xC8956C,emissiveIntensity:1.0}));
arcGroup.add(gaugeBall);
const gaugeGlow=new THREE.PointLight(0xC8956C,4,2.0);
gaugeBall.add(gaugeGlow);
let gaugeAng=0, flashUntil=0, flashMat=null;
function setBall(angDeg){
  gaugeAng+=(angDeg-gaugeAng)*0.35;
  const a=gaugeAng*d2rA;
  gaugeBall.position.set(ARC_R*Math.sin(a),-ARC_R*Math.cos(a),0);
  zoneMatL.emissiveIntensity=gaugeAng<=-55?1.4:.25;
  zoneMatR.emissiveIntensity=gaugeAng>=55?1.4:.25;
}
/* 振りかぶり過ぎ: 該当側ゾーンをテラコッタで0.7秒点滅 */
Stage.flashOver=(side)=>{
  if(flashMat){ flashMat.color.setHex(0xC8956C); flashMat.emissive.setHex(0xC8956C); }
  flashMat=side<0?zoneMatL:zoneMatR;
  flashMat.color.setHex(0xC45B4A); flashMat.emissive.setHex(0xC45B4A); flashMat.emissiveIntensity=1.7;
  flashUntil=performance.now()+700;
};
/* 三角形インジケータ: 肩2点＋グリップ中点を結ぶ線。形=彫像のフォーム、色=ユーザーの評価
   （金=三角形を保てている / テラコッタ=崩れ=チキンウィング傾向）。null=非表示 */
const triMat=new THREE.MeshBasicMaterial({color:0xC8956C,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false});
const triEdges=[0,1,2].map(()=>{
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.009,0.009,1,6,1,true),triMat);
  m.visible=false; m.frustumCulled=false; scene.add(m); return m;
});
let triStatus=null, triBones=null;
Stage.setTriangle=s=>{ triStatus=s; };
const _tv1=new THREE.Vector3(),_tv2=new THREE.Vector3(),_tv3=new THREE.Vector3(),_tv4=new THREE.Vector3(),_tmid=new THREE.Vector3(),_tdir=new THREE.Vector3(),_tup=new THREE.Vector3(0,1,0);
function triEdge(m,a,b){
  _tdir.subVectors(b,a);
  const len=_tdir.length(); if(len<0.01){ m.visible=false; return; }
  m.position.copy(a).addScaledVector(_tdir,0.5);
  m.scale.set(1,len,1);
  m.quaternion.setFromUnitVectors(_tup,_tdir.normalize());
  m.visible=true;
}
function updateTriangle(){
  if(!triBones || triStatus===null){ triEdges.forEach(m=>m.visible=false); return; }
  triBones.ls.getWorldPosition(_tv1); triBones.rs.getWorldPosition(_tv2);
  triBones.lh.getWorldPosition(_tv3); triBones.rh.getWorldPosition(_tv4);
  _tmid.addVectors(_tv3,_tv4).multiplyScalar(0.5);
  triEdge(triEdges[0],_tv1,_tv2);

/* ── 金の軌跡リボン（あなたのスイングが光になる） ── */
const TRAIL_MS=430, TRAIL_N=26;
const trailGeo=new THREE.BufferGeometry();
const tPos=new Float32Array(TRAIL_N*2*3);
trailGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));
{ const idx=[]; for(let i=0;i<TRAIL_N-1;i++){const a=i*2,b=a+1,c=a+2,d=a+3; idx.push(a,b,c,b,d,c);} trailGeo.setIndex(idx); }
const trailMesh=new THREE.Mesh(trailGeo,new THREE.MeshBasicMaterial({color:0xffd9a0,transparent:true,opacity:.8,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
trailMesh.frustumCulled=false;

let trailSamples=[];
function updateTrail(now,deg){
  trailSamples.push({t:now,d:deg});
  while(trailSamples.length && now-trailSamples[0].t>TRAIL_MS) trailSamples.shift();
  const m=trailSamples.length;
  const visible=m>=3 && Math.abs(trailSamples[m-1].d-trailSamples[0].d)>2.5;
  trailMesh.visible=visible;
  if(!visible) return;
  for(let i=0;i<TRAIL_N;i++){
    const s=trailSamples[Math.max(0,m-TRAIL_N+i)]||trailSamples[0];
    const age=Math.min(1,(now-s.t)/TRAIL_MS);
    const w=0.5*(1-age)+0.03;
    const [xi,,zi]=dialPos(s.d,R-0.30-w*0.08);
    const [xo,,zo]=dialPos(s.d,R-0.30+w*0.08);
    tPos[i*6]=xi;   tPos[i*6+1]=0.14; tPos[i*6+2]=zi;
    tPos[i*6+3]=xo; tPos[i*6+4]=0.14; tPos[i*6+5]=zo;
  }
  trailGeo.attributes.position.needsUpdate=true;
}

/* ── 白磁のゴルファー（確定マテリアル: 白磁×金の関節） ── */
let mixer=null, action=null, golfer=null, clipDur=1.93;
// スクラブのアンカー（anim-lab実測値 2026-06-12。旧0.78/0.90/0.95はフェーズ誤読で、追従しなかった真因）
const ANCH=window.__anchors={addr:0.10, top:0.50, impact:0.78, finish:1.27};
const GOLD_JOINT_RE=/Neck|Head|Shoulder|(Left|Right)Arm$|(Left|Right)ForeArm$|Hand|(Left|Right)Leg$|Foot|Toe/;

new FBXLoader().load('assets/golfer-chip.fbx',(fbx)=>{ // チップ素材（ドリルと同じコンパクトな動き。ken判定で復帰）
  golfer=fbx;
  golfer.scale.setScalar(0.0095);
  golfer.position.y=0.125;
  golfer.rotation.y=Math.PI/2; // 正面（観客視点）へ。逆向きなら window.__faceRot で調整
  window.__faceRot=r=>{ golfer.rotation.y=r; return r; };
  const bodyMat=new THREE.MeshPhysicalMaterial({color:0xF2E8D6,metalness:0,roughness:.3,clearcoat:.55,clearcoatRoughness:.35,envMapIntensity:.7});
  const jointWhite=new THREE.MeshPhysicalMaterial({color:0xF2E8D6,metalness:0,roughness:.22,clearcoat:.7,clearcoatRoughness:.25,envMapIntensity:.8});
  const jointGold=new THREE.MeshStandardMaterial({color:0xC8956C,metalness:.95,roughness:.3,envMapIntensity:1.0});
  golfer.traverse(c=>{
    if(!c.isMesh) return;
    c.castShadow=true;
    const n=((c.material&&c.material.name)||c.name||'').toLowerCase();
    if(!n.includes('joint')){ c.material=bodyMat; return; }
    // 関節を金/白磁に面単位で分割（インデックスなし形状対応・胴体中心は白磁）
    const geo=c.geometry;
    if(!geo.attributes.skinIndex || !c.skeleton){ c.material=jointGold; return; }
    const boneNames=c.skeleton.bones.map(b=>b.name||'');
    const si=geo.attributes.skinIndex, sw=geo.attributes.skinWeight, pos=geo.attributes.position;
    const comp=(a,v,j)=>a.array[v*a.itemSize+j];
    geo.computeBoundingBox();
    const bb=geo.boundingBox;
    const mins=[bb.min.x,bb.min.y,bb.min.z], maxs=[bb.max.x,bb.max.y,bb.max.z];
    const sizes=[maxs[0]-mins[0],maxs[1]-mins[1],maxs[2]-mins[2]];
    const up=sizes.indexOf(Math.max(...sizes));
    const lat=[0,1,2].filter(a=>a!==up);
    const H=sizes[up];
    const c0=(maxs[lat[0]]+mins[lat[0]])/2, c1=(maxs[lat[1]]+mins[lat[1]])/2;
    const inTorso=v=>{
      const p=[comp(pos,v,0),comp(pos,v,1),comp(pos,v,2)];
      const h=(p[up]-mins[up])/H;
      const r=Math.hypot(p[lat[0]]-c0,p[lat[1]]-c1);
      return h>0.44 && h<0.80 && r<0.095*H;
    };
    const hasIdx=!!geo.index;
    const faceCount=hasIdx?geo.index.count/3:pos.count/3;
    const vAt=hasIdx?(f,k)=>geo.index.array[f*3+k]:(f,k)=>f*3+k;
    const goldIdx=[], whiteIdx=[];
    for(let f=0;f<faceCount;f++){
      let votes=0;
      const tri=[vAt(f,0),vAt(f,1),vAt(f,2)];
      for(const v of tri){
        let best=0,bw=-1;
        for(let j=0;j<4;j++){ const w=comp(sw,v,j); if(w>bw){bw=w;best=comp(si,v,j);} }
        if(!inTorso(v) && GOLD_JOINT_RE.test(boneNames[best])) votes++;
      }
      (votes>=2?goldIdx:whiteIdx).push(tri[0],tri[1],tri[2]);
    }
    geo.setIndex(goldIdx.concat(whiteIdx));
    geo.clearGroups();
    geo.addGroup(0,goldIdx.length,0);
    geo.addGroup(goldIdx.length,whiteIdx.length,1);
    c.material=[jointGold,jointWhite];
  });
  scene.add(golfer);
  { const bn={};
    golfer.traverse(c=>{ if(c.isBone){
      if(/LeftArm$/.test(c.name))bn.ls=c; if(/RightArm$/.test(c.name))bn.rs=c;
      if(/LeftHand$/.test(c.name))bn.lh=c; if(/RightHand$/.test(c.name))bn.rh=c; } });
    if(bn.ls&&bn.rs&&bn.lh&&bn.rh) triBones=bn; }
  if(fbx.animations&&fbx.animations.length){
    mixer=new THREE.AnimationMixer(golfer);
    action=mixer.clipAction(fbx.animations[0]);
    clipDur=fbx.animations[0].duration;
    action.play();
  }
  window.__clipInfo={dur:clipDur, anims:fbx.animations.length, src:'chip', v:10};
  Stage.ready=true;
  const ld=document.getElementById('stageLoading');
  if(ld) ld.style.display='none';
  // ken再出力のアニメ（Golf Chip (1)、Without Skin）があればそちらの動きを優先適用
  new FBXLoader().load('assets/golfer-chip2.fbx',(animFbx)=>{
    if(animFbx.animations && animFbx.animations.length && mixer){
      mixer.stopAllAction();
      action=mixer.clipAction(animFbx.animations[0]);
      clipDur=animFbx.animations[0].duration;
      renderT=Math.min(renderT,clipDur-0.01);
      action.play();
      window.__clipInfo={dur:clipDur, anims:animFbx.animations.length, src:'chip2', v:10};
    }
  },undefined,()=>{ /* 無ければ既存アニメのまま */ });
},undefined,e=>{ window.__err.push('FBX: '+(e.message||e)); });

/* ── モード制御 ──
   demo: お手本ループ再生（イントロ）
   live: 計測角度でスクラブ（あなたの分身） */
let liveAng=0, liveState='idle', topAng=-60;
let renderT=ANCH.addr, lastTs=null;
let camY=2.1, camZ=5.0, camLY=0.85; // モード別カメラのスムーズ遷移用
Stage.mount=(id)=>{
  const el=document.getElementById(id);
  if(el && canvas.parentElement!==el){ el.appendChild(canvas); Stage.resize(); }
};
Stage.resize=()=>{
  const el=canvas.parentElement; if(!el) return;

  renderer.setSize(w,h,false);

};
Stage.setMode=m=>{ Stage.mode=m; trailSamples=[]; demoSi=0; demoT0=null; renderT=ANCH.addr; };

/* お手本の模擬スイング: 0→-60(1.3s)→+60(1.15s)→0(1.1s) テンポ約2:1（demo-lab B方式、ken承認） */
const DSEG=[[0,-60,1300,400],[-60,60,1150,900],[60,0,1100,800]];
let demoSi=0, demoT0=null;
Stage.setLive=(ang,state)=>{
  liveAng=ang;
  if(liveState==='back'&&state==='down') topAng=Math.min(-10,liveAng); // 切り返し時のトップ角を記録
  liveState=state;
};
addEventListener('resize',()=>Stage.resize());

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
function angleToTime(ang,state){
  // バック側(負)=addr→top / ダウン=top→impact / フォロー側(正)=impact→finish
  // /60 = ドリル目標の60°でちょうどトップ/フィニッシュに届く
  if(state==='back'||(state==='idle'&&ang<-3)) return lerp(ANCH.addr,ANCH.top,clamp(-ang/60,0,1));
  if(state==='down'){
    if(ang<-2) return lerp(ANCH.top,ANCH.impact,clamp(1-(ang/topAng),0,1));
    return lerp(ANCH.impact,ANCH.finish,clamp(ang/60,0,1));
  }
  if(ang>3) return lerp(ANCH.impact,ANCH.finish,clamp(ang/60,0,1));
  return ANCH.addr;
}

function animate(ts){
  const dts=lastTs?Math.min(0.05,(ts-lastTs)/1000):0.016; lastTs=ts;
  if(mixer&&action){
    if(Stage.mode==='demo'){
      // お手本＝合格スイングのスクラブ再生＋光球（demo-lab v3 B方式、ken承認 2026-06-12）
      if(demoT0===null)demoT0=ts;
      const seg=DSEG[demoSi];
      const sdt=ts-demoT0;
      const ease=demoSi===1?(u=>u*u):(u=>u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2);
      let d=seg[1];
      if(sdt<=seg[2]) d=seg[0]+(seg[1]-seg[0])*ease(Math.min(1,sdt/seg[2]));
      else if(sdt>seg[2]+seg[3]){ demoSi=(demoSi+1)%DSEG.length; demoT0=ts; }
      const st=demoSi===0?'back':(demoSi===1?'down':'idle');
      const target=st==='down'&&d<-2
        ? lerp(ANCH.top,ANCH.impact,clamp(1-(d/-60),0,1))  // demoのトップは-60固定
        : angleToTime(d,st);
      renderT+=(target-renderT)*Math.min(1,dts*12);
      action.paused=true;
      action.time=clamp(renderT,0,clipDur-0.001);
      mixer.update(0);
      setBall(d);
    } else {
      // live: 素直なバネ追従（実測アンカー）＋光球
      const target=angleToTime(liveAng,liveState);
      renderT+=(target-renderT)*Math.min(1,dts*12);
      action.paused=true;
      action.time=clamp(renderT,0,clipDur-0.001);
      mixer.update(0);
      setBall(liveAng);
      updateTrail(ts,clamp(liveAng,-110,110)); // バック=負=画面左（符号統一により二重反転を撤去）
    }
  }
  updateTriangle();
  if(flashMat && performance.now()>flashUntil){
    flashMat.color.setHex(0xC8956C); flashMat.emissive.setHex(0xC8956C); flashMat=null;
  }
  const t=ts*0.001;
  // ライブ計測中はカメラが寄る（彫像と三角形を主役に。イントロは時計全体の引き構図）
  const ct=Stage.mode==='live' ? {y:1.55, z:3.45, ly:0.95, sway:0.20} : {y:2.1, z:5.0, ly:0.85, sway:0.35};
  camY+=(ct.y-camY)*Math.min(1,dts*2.5);
  camZ+=(ct.z-camZ)*Math.min(1,dts*2.5);
  camLY+=(ct.ly-camLY)*Math.min(1,dts*2.5);
  camera.position.set(Math.sin(t*0.15)*ct.sway, camY+Math.sin(t*0.1)*0.05, camZ);
  camera.lookAt(0,camLY,0);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
Stage.mount('stageIntro');
</script>

  rehautPeri = 2*(bw+bh) - 8*rx + 2*Math.PI*rx; // 周長（角丸補正）
}

    setSub('');
    if(stage) stage.classList.add('rh-lit');
    rehautArc(0);                     // 弧は空から始まり、startReplayで満ちていく＝計測中との決定的な違い
  } else if(mode==='measuring'){
    el.textContent=STR.t('live.measuring'); el.classList.add('measuring');
    // 暗転はスイング集中モードがオンの時だけ（初期オフ＝画面を見て動作確認できる）
    if(dim){ if(focusDim){ dim.classList.add('on'); $('liveDimMsg').textContent=STR.t('live.ball'); } else dim.classList.remove('on'); }
    setEb('Measuring', false);
    setSub('');
    if(stage){ stage.classList.add('rh-lit','rh-glow'); } // 弧が静かに灯る＋微発光
    rehautFull();
  } else if(mode==='ready'){
    el.textContent=STR.t('live.ready'); el.classList.add('armed');
    if(dim) dim.classList.remove('on');
    setEb('', false);
    setSub(STR.t('live.sub.ready'));
    if(stage) stage.classList.add('rh-lit'); // 「どうぞ」＝弧が灯る
    rehautFull();
  } else {
    el.textContent=STR.t('live.return'); el.classList.add('waiting');
    if(dim) dim.classList.remove('on');
    setEb('', false);
    setSub(STR.t('live.sub.waiting'));
    rehautFull(); // 弧は消灯（rh-lit無し）。基準だけ整える
  }
}

function tick(){
  if(replaying) return; // リプレイ再生中はライブ計測・アーミングを完全に保留
  const t=performance.now();
  const qC=QuatUtils.fromEuler(SENSOR.alpha,SENSOR.beta,SENSOR.gamma);
  const A=signedAngles(qC,STATE.frame);
  // 実機確認(2026-06-12): azimuth正=バック側だったため反転し「バック=負」に統一。
  // 旧コードはトレイル側の-liveAngが偶然補正していたが、彫像と光球には逆向きに伝わっていた
  if(Math.abs(A.azimuth)>3) lastSide=-Math.sign(A.azimuth);
  let ang=lastSide*A.mag;
  if(FLIP) ang=-ang;

  if(lastT!==null){
    const dt=(t-lastT)/1000;
    if(dt>0.001 && dt<0.5){
      const w=Math.abs(ang-lastA)/dt;
      omegaS=omegaS*0.5+w*0.5;
    }
  }
  lastT=t; lastA=ang;

  // やり直しボタンは「2球目以降・計測していない時」だけ表示
  $('btnRedo').style.display=(STATE.swings.length>=1 && tracker.state==='idle')?'inline-block':'none';

  // ── 未アーミング中はトラッカーに流さない（戻し動作・構え直しを計測しない） ──
  // 再アーミング = ①一度動く（フィニッシュ静止と区別。6秒で省略可）→ ②静止0.5s →
  // ③静止した今の構えを新しい基準に再ゼロ化 → セット。
  // 🔴角度<12°を条件にしない: ジャイロのヨードリフトや握り直しで構えに戻っても角度が
  // ゼロに戻らず、永久にアーミングされないバグ（判定不能スイング後のフリーズ）の修正
  if(!armed){
    if(rearmPhase==='wait-move'){
      if(omegaS>40 || Math.abs(ang-angAtEnd)>15 || t-disarmT>6000){
        rearmPhase='wait-still'; armSince=null;
      }
    } else {
      if(omegaS<15){
        if(armSince===null){ armSince=t; rearmSamples.length=0; }
        rearmSamples.push(qC);
        if(t-armSince>=500){
          const f=makePlaneFrame(QuatUtils.average(rearmSamples));
          if(f) STATE.frame=f; // 再ゼロ化（シャフトが鉛直すぎる等で作れなければ旧基準のまま）
          armed=true; overshootWarned=false; triEMA=1; acSum=0; acCnt=0;
          lastA=0; omegaS=0;
          $('swingNum').textContent=String(STATE.swings.length+1); // 計測可になった瞬間に球番号を進める（不意打ち防止）
          GLAudio.armReady();   // 専用の上昇音（汎用クリックと区別）。大きな「どうぞ」帯＋上昇音で合図し、重複チップは廃止
        }
      } else armSince=null;
    }
    if(window.Stage3D){ Stage3D.setLive(armed?0:ang,'idle'); if(Stage3D.setTriangle) Stage3D.setTriangle(null); }
    setLiveState(armed?'ready':'waiting');
    return;
  }

  if(tracker.state!=='idle' && MOTION.seen){
    const wRad=magRotPerpRad(MOTION.rot);
    if(wRad>=1.5){
      const expected=wRad*wRad*STATE.rCal;
      if(expected>=0.5){
        const actual=Math.sqrt(MOTION.acc.x**2+MOTION.acc.y**2+MOTION.acc.z**2);
        const ratio=Math.min(2,actual/expected);
        acSum+=ratio; acCnt++;
        triEMA=triEMA*0.8+ratio*0.2; // リアルタイム三角形インジケータ用
      }
    }
  }

  const prev=tracker.state;
  const r=tracker.feed(t,ang,omegaS);
  if(prev==='idle' && tracker.state!=='idle'){
    GLAudio.start(); acSum=0; acCnt=0; triEMA=1;
    swingTrace=[]; traceActive=true; // リプレイ用にこの球の軌跡を常に記録（集中モードと切り離し、毎回3D再生する）
  }
  if(traceActive && tracker.state!=='idle' && swingTrace.length<600) swingTrace.push({t, ang, state:tracker.state});
  if(r) onSwing(r);

  // 振りかぶり過ぎ警告（ゾーン上限+5°超で一度だけ。iOS Safariはバイブ非対応のため音+表示で代替）
  if(tracker.state==='back' && !overshootWarned && Math.abs(ang)>ZONE_MAX+5){
    overshootWarned=true;
    GLAudio.warn();
    if(navigator.vibrate) try{ navigator.vibrate(150); }catch(e){}
    showChip('ng',STR.t('live.chip.over'));
    if(window.Stage3D && Stage3D.flashOver) Stage3D.flashOver(ang<0?-1:1);
  }

  if(window.Stage3D){
    Stage3D.setLive(ang,tracker.state);
    // チキンウィング(三角形崩れ)はグリップのセンサーから安定検出不可と独立検証で判明(2026-06-13)。
    // 検出できないものを判定表示しない（D7誠実さ）。三角形インジケータは常に非表示。
    if(Stage3D.setTriangle) Stage3D.setTriangle(null);
  }
  setLiveState(tracker.state==='idle'?'ready':'measuring');
}

function onSwing(r){
  // 次のスイングは「（動いて）構えに戻して静止」で再アーミング＋再ゼロ化
  armed=false; armSince=null; disarmT=performance.now(); angAtEnd=lastA;
  rearmPhase='wait-move'; // 振り終わり直後は必ず一度動かして構え直す＝惰性の静止での誤アーム/不意打ちを防ぐ
  // この球の軌跡を退避（毎回の自動再生は廃止。結果画面のReviewで1球ずつ見返す）
  const trace = (traceActive && swingTrace.length>=4) ? swingTrace.slice() : [];
  traceActive=false;
  setLiveState('waiting'); // 振り終わったら必ず明るく戻す（暗転の残留を防ぐ）
  if(Math.abs(r.backAngle)<MIN_BACK){ showChip('muted',STR.t('live.tooSmall')); return; }
  const acRatio=acCnt>=3? acSum/acCnt : null;
  const sw={
    back:r.backAngle, follow:r.followAngle, complete:r.complete,
    broken: acRatio===null? null : acRatio<0.75,
    decel: (r.complete && !r.slowSwing)? r.decel : null,
    slow: r.slowSwing, tempo:r.tempoRatio,
    trace: trace
  };
  STATE.swings.push(sw);
  GLAudio.end();

  const b=Math.abs(sw.back), f=Math.abs(sw.follow);
  // broken(三角形崩れ=チキンウィング)は検出不可のため判定に使わない（D7誠実さ）
  if(sw.decel===true){ showChip('ng',STR.t('live.chip.decel')); GLAudio.warn(); }
  else if(b<ZONE_MIN){ showChip('ng',STR.t('live.chip.shallow')); }
  else if(b>ZONE_MAX){ showChip('ng',STR.t('live.chip.deep')); }
  else if(f<20){ showChip('ng',STR.t('live.chip.noFollow')); }
  else { showChip('ok',STR.t('live.chip.ok')); GLAudio.good(); }

  renderDots();
  if(STATE.swings.length>=SET_SIZE){
    resultTimer=setTimeout(showResult, 1000); // 3球そろったら結果へ（毎回の自動再生は廃止）
  }
  // 球番号は「次の計測が可になった瞬間」(tickのアーミング完了)で進める。ここでは進めない（不意打ち防止）
}

// ── 結果画面の Review：選んだ球の軌跡を、結果画面の小ステージ(#stageReview)で3D再生 ──
// 既存 Stage3D.setLive を流すだけ（3D本体は無変更）。計測画面のリプレイは廃止し、ここに集約。
let reviewPeri=0, reviewIdx=-1;
function layoutReview(){
  const s=$('stageReview'), svg=$('rehautReview'); if(!s||!svg) return;
  const w=s.clientWidth, h=s.clientHeight; if(!w||!h) return;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const ins=7, rx=13, bw=w-2*ins, bh=h-2*ins;
  svg.querySelectorAll('rect').forEach(r=>{ r.setAttribute('x',ins); r.setAttribute('y',ins); r.setAttribute('width',bw); r.setAttribute('height',bh); r.setAttribute('rx',rx); r.setAttribute('ry',rx); });
  reviewPeri = 2*(bw+bh) - 8*rx + 2*Math.PI*rx;
}
function reviewArc(p){ const a=$('rehautReview'); if(a){ const r=a.querySelector('.rh-act'); if(r){ if(!reviewPeri) layoutReview(); r.style.strokeDasharray=reviewPeri+' '+reviewPeri; r.style.strokeDashoffset=String(reviewPeri*(1-Math.min(1,Math.max(0,p)))); } } }

function playReview(idx){
  const sw=STATE.swings[idx]; if(!sw || !sw.trace || sw.trace.length<2) return;
  reviewIdx=idx;
  document.querySelectorAll('.review-card').forEach((c,i)=>c.classList.toggle('sel', i===idx)); // 選択中の札を灯す
  $('stageReview').classList.add('open');
  $('reviewAnchor').classList.add('open'); $('reviewLinks').classList.add('open');
  $('reviewAnchor').textContent=STR.t('live.swing')+' '+(idx+1)+' ・ '+Math.round(Math.abs(sw.back))+'°';
  if(window.Stage3D){ Stage3D.setMode('live'); Stage3D.mount('stageReview'); if(Stage3D.resize) Stage3D.resize(); } // canvasをレビューへ移し寄りの構図に
  layoutReview();
  startReview(sw.trace);
}
function startReview(trace){
  if(replayRAF){ cancelAnimationFrame(replayRAF); replayRAF=null; }
  replaying=true;
  const t0=trace[0].t, startWall=performance.now();
  const dur=(trace[trace.length-1].t - t0)/REPLAY_SPEED;
  let i=0;
  if(window.Stage3D) Stage3D.setLive(trace[0].ang, trace[0].state);
  reviewArc(0);
  function step(){
    if(!replaying) return;
    const wall=performance.now()-startWall;
    const elapsed=wall*REPLAY_SPEED;
    const target=t0+elapsed;
    while(i<trace.length-1 && trace[i+1].t<=target) i++;
    const fr=trace[Math.min(i,trace.length-1)];
    if(window.Stage3D) Stage3D.setLive(fr.ang, fr.state);
    reviewArc(Math.min(1, wall/Math.max(1,dur))); // 縁の金弧が再生に合わせて満ちる
    if(wall < dur + REPLAY_HOLD) replayRAF=requestAnimationFrame(step);
    else finishReview();
  }
  replayRAF=requestAnimationFrame(step);
}
function finishReview(){
  if(replayRAF){ cancelAnimationFrame(replayRAF); replayRAF=null; }
  replaying=false;
  if(window.Stage3D) Stage3D.setLive(0,'idle'); // アドレスで静止
}
function closeReview(){
  if(replayRAF){ cancelAnimationFrame(replayRAF); replayRAF=null; }
  replaying=false; reviewIdx=-1;
  $('stageReview').classList.remove('open');
  $('reviewAnchor').classList.remove('open'); $('reviewLinks').classList.remove('open');
  document.querySelectorAll('.review-card').forEach(c=>c.classList.remove('sel'));
}

// 直前の1球だけ取り消して、その球を再計測（キャリブは保持）。2・3球目のやり直し用
function redoLastSwing(){
  if(STATE.phase!=='live') return;
  if(replaying) return;                     // リプレイ中は無効
  if(tracker.state!=='idle') return;        // スイング進行中は無効
  if(STATE.swings.length===0) return;       // 取り消す球が無い
  if(resultTimer){ clearTimeout(resultTimer); resultTimer=null; } // 3球目確定後の結果遷移を中止
  GLAudio.click();
  STATE.swings.pop();                        // 直前の確定球を取消（STATE.frame=較正は保持）
  tracker.reset();
  armed=false; armSince=null; disarmT=performance.now(); angAtEnd=lastA;
  rearmPhase='wait-move'; overshootWarned=false; triEMA=1; acSum=0; acCnt=0;
  renderDots();
  $('swingNum').textContent=String(STATE.swings.length+1);
  showChip('muted', STR.t('live.redo'));
  setLiveState('waiting');
}

function swingOk(sw){
  const b=Math.abs(sw.back);
  // broken(三角形崩れ)は検出不可のため合否に使わない（D7誠実さ）
  return sw.decel!==true && b>=ZONE_MIN && b<=ZONE_MAX && Math.abs(sw.follow)>=20;
}
function renderDots(){
  $('dots').innerHTML=STATE.swings.map(sw=>'<div class="dot '+(swingOk(sw)?'ok':'ng')+'"></div>').join('')
    + Array(SET_SIZE-STATE.swings.length).fill('<div class="dot"></div>').join('');
}
function showChip(cls,txt){
  $('chipArea').innerHTML='<span class="chip '+cls+'">'+txt+'</span>';
  if(chipTimer) clearTimeout(chipTimer);
  chipTimer=setTimeout(()=>{ $('chipArea').innerHTML=''; }, 1700);
}

/* 結果 */
// スイング集中モードの誘いカード（価値を体験した後にだけ・最大2回・一度ONにしたら二度と出さない）
function renderFocusInvite(){

    '<div style="font-family:\'Noto Serif JP\',serif;font-size:13px;line-height:1.85;color:#3A453C;margin-top:8px">'+STR.t('live.focusHint.body')+'</div>'+
    '<button class="btn gold" id="btnFocusTry" style="margin-top:14px">'+STR.t('live.focusHint.cta')+'</button>'+

  });

// Review：3球を刻印番号の札で並べ、タップでその球を3D再生（初期は畳む）
function renderReview(){
  const block=$('reviewBlock'), cards=$('reviewCards');
  if(!block||!cards) return;
  const swings=STATE.swings;
  if(!swings.some(s=>s.trace && s.trace.length>=2)){ block.style.display='none'; return; }
  block.style.display='block';
  $('reviewH').textContent=STR.t('review.title');
  $('btnReviewAgain').textContent=STR.t('review.again');
  $('btnReviewClose').textContent=STR.t('review.close');
  cards.innerHTML=swings.map((s,i)=>{
    const ok=swingOk(s), b=Math.abs(s.back);
    const tag = ok? '' : (b<ZONE_MIN?'浅い':(b>ZONE_MAX?'深い':(s.decel===true?'減速':'')));
    const top = ok? 'var(--gold)':'var(--err)';
    const playable = !!(s.trace && s.trace.length>=2);
    return '<div class="review-card'+(playable?'':' disabled')+'" data-i="'+i+'" role="button" tabindex="0" aria-label="'+STR.t('live.swing')+(i+1)+'">'+
      '<div class="top" style="background:'+top+'"></div>'+
      '<div class="num">'+(i+1)+'</div>'+
      '<div class="deg">'+Math.round(b)+'°</div>'+
      '<div class="tag">'+tag+'</div></div>';
  }).join('');
  cards.querySelectorAll('.review-card').forEach(c=>{
    c.addEventListener('click',()=>{ const i=+c.dataset.i, s=STATE.swings[i]; if(s && s.trace && s.trace.length>=2){ GLAudio.click(); playReview(i); } });
  });
  closeReview(); // 初期は畳んだ状態
}
function showResult(){
  const sw=STATE.swings;
  const backs=sw.map(s=>Math.abs(s.back));
  const mean=GLMath.avg(backs);
  // 標本標準偏差(Bessel補正 n-1)。母σは過小評価するため誠実な推定に補正
  const sd=backs.length>1? Math.sqrt(backs.reduce((s,v)=>s+(v-mean)*(v-mean),0)/(backs.length-1)) : 0;
  const decelCt=sw.filter(s=>s.decel===true).length;
  const slowCt=sw.filter(s=>s.slow).length;
  const noFollowCt=sw.filter(s=>Math.abs(s.follow)<20).length;
  const zoneCt=backs.filter(b=>b>=ZONE_MIN&&b<=ZONE_MAX).length;

  // 合否は検証済み指標(振り幅ゾーン・再現性・緩み)のみで判定。broken(三角形)は使わない（D7誠実さ）
  let rank;
  if(decelCt===0 && sd<=5 && zoneCt>=3) rank='perfect';
  else if(decelCt<=1 && sd<=8 && zoneCt>=2) rank='good';
  else if(sd<=12) rank='almost';
  else rank='tryagain';

  const words={perfect:'Perfect.',good:'Good.',almost:'Almost.',tryagain:'Try again.'};
  $('rankWord').textContent=words[rank];
  $('rankWord').classList.toggle('warn',rank==='tryagain');
  $('rankJp').textContent=STR.t('result.rank.'+rank);

  $('statMean').textContent=Math.round(mean)+'°';
  $('statSd').textContent='±'+Math.round(sd)+'°';   // 3球の推定値、過剰精度を避け整数表示
  $('statZone').textContent=zoneCt+'/'+SET_SIZE;

  // ── セッションスコア（測れる4指標だけ・within-subject。肘/三角形は入れない=D7誠実さ）──
  const n=SET_SIZE;
  const zoneRate=zoneCt/n;
  const consistency=Math.max(0,Math.min(1,1-sd/12));   // ばらつき小=高（再現性が主役）
  const noDecel=1-decelCt/n;
  const followRate=1-noFollowCt/n;
  const score=Math.round((0.40*consistency + 0.30*zoneRate + 0.15*noDecel + 0.15*followRate)*100);
  // 前回スコア（自分の過去比）
  const hist=(typeof GLProfile!=='undefined')? GLProfile.get('history.sessions',[]).filter(s=>s.drill==='pitch') : [];
  const prev=hist.length? hist[hist.length-1].score : null;
  const diff=(prev!=null)? score-prev : null;
  $('repScore').innerHTML=
    '<div style="font-family:Inter,sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--sub)">セッションスコア</div>'+
    '<div style="font-family:\'Playfair Display\',serif;font-weight:800;font-size:62px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums">'+score+'</div>'+
    (diff!=null
      ? '<div style="font-size:13px;letter-spacing:.08em;color:'+(diff>=0?'var(--ok)':'var(--err)')+'">前回より '+(diff>=0?'+':'')+diff+'</div>'
      : '<div style="font-size:11px;letter-spacing:.1em;color:var(--sub)">はじめてのスコア</div>');

  drawChart(sw);

  const issues=[];
  // 三角形崩れ(チキンウィング)は検出不可のため課題に出さない（D7誠実さ）
  if(decelCt>0) issues.push({k:'decel', label:STR.t('result.issue.decel'), desc:`${decelCt}回、最下点の手前で減速しています。振り抜く意識を。`});
  if(sd>5) issues.push({k:'spread', label:STR.t('result.issue.spread'), desc:`ばらつき ±${Math.round(sd)}°（目標 ±5°以内）。距離感はそろえることから。`});
  if(zoneCt<SET_SIZE && mean<ZONE_MIN) issues.push({k:'shallow', label:STR.t('result.issue.shallow'), desc:`平均 ${Math.round(mean)}°。8時（60°）までしっかり上げましょう。`});
  if(zoneCt<SET_SIZE && mean>ZONE_MAX) issues.push({k:'deep', label:STR.t('result.issue.deep'), desc:`平均 ${Math.round(mean)}°。振りすぎです。8時で止めましょう。`});
  if(noFollowCt>0) issues.push({k:'follow', label:STR.t('result.issue.follow'), desc:`${noFollowCt}回、フォロー側（4時）まで振り切れていません。`});

  // ── 「次の一振りへ、ひとつ。」最優先課題の処方を判定語の直下に昇格（P0。文言キー化はP1）──
  const RX={
    decel:'下りでゆるめず、ボールの先まで振り抜いて。',
    spread:'まずは振り幅の大きさをそろえて。強さは後で大丈夫です。',
    shallow:'あと少し、8時まで上げて。',
    deep:'8時で止めて。振りすぎなくて大丈夫です。',
    follow:'振り終わりは4時まで。途中で力を抜かないで。'
  };
  const _rxName=issues.length>0? issues[0].label : 'この感覚を、覚えておく';
  const _rxLine=issues.length>0? (RX[issues[0].k]||'') : 'いまの形のまま、もう一度振ってみて。';
  $('topRx').innerHTML=
    '<div style="border-left:2px solid var(--gold);padding:2px 0 2px 14px;text-align:left">'+
    '<div style="font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.14em;color:var(--gold)">次の一振りへ、ひとつ。</div>'+
    '<div style="font-family:\'Noto Serif JP\',serif;font-weight:600;font-size:19px;color:var(--ink);margin-top:7px">'+_rxName+'</div>'+
    '<div style="font-family:\'Noto Serif JP\',serif;font-size:14px;line-height:1.7;color:#3A453C;margin-top:6px">'+_rxLine+'</div>'+
    '</div>';

  const list=$('issuesList');
  if(issues.length===0){
    list.innerHTML='<p class="body-text">'+STR.t('result.noIssues')+'</p>';
  } else {
    list.innerHTML=issues.map((it,i)=>
      '<div class="issue" data-k="'+it.k+'"><div class="mark"></div><div><b>'+it.label+'</b>'
      +(i===0?'<span class="badge">'+STR.t('result.recommend')+'</span>':'')
      +'<div class="desc">'+it.desc+'</div></div></div>'
    ).join('');
    list.querySelectorAll('.issue').forEach(el=>{
      el.addEventListener('click',()=>{
        list.querySelectorAll('.issue').forEach(e2=>e2.classList.remove('selected'));
        el.classList.add('selected');
        $('focusNote').textContent=STR.t('result.focusNote');
        $('focusNote').classList.add('show');
        GLAudio.click();
      });
    });
  }

  const partial=[];
  // 肘/三角形は測れないため「未計測」と正直に明示（誇張しない）
  partial.push('このセットでは振り幅・テンポ・再現性を計測（肘や三角形は未計測）');
  if(slowCt>0) partial.push(`緩み判定の保留が${slowCt}回（ゆっくりすぎる素振り）`);
  $('partialNote').textContent=partial.join(' / ');
  $('focusNote').classList.remove('show');

  // ── ループ閉鎖: 統一スキーマGLProfileに保存＋ストリーク＋現在地 ──
  const iso=new Date().toISOString();
  if(typeof GLProfile!=='undefined'){
    GLProfile.addSession({date:iso, drill:'pitch', level:2, score, sd:Math.round(sd), zone:zoneCt, rank});
    const today=new Date().toDateString(), last=GLProfile.get('streak.lastPlayed',null);
    if(last!==today){
      const y=new Date(Date.now()-86400000).toDateString();
      const cur=GLProfile.get('streak.days',0);
      GLProfile.set('streak.days', last===y? cur+1 : 1);
      GLProfile.set('streak.lastPlayed', today);
    }
    GLProfile.set('progress.currentLevel',2);
  }
  GLStore.push('pitch:sets',{v:1,date:iso,rank,score,mean:Math.round(mean),sd:+sd.toFixed(1),zone:zoneCt,decel:decelCt},200);

  renderReview();      // 3球を1つずつ見返すReviewセクションを生成（毎回の自動再生の代替）
  renderFocusInvite(); // スイング集中モードへの誘い（条件を満たす時だけ・最大2回）

  if(rank==='perfect') GLAudio.success();
  else if(rank==='good') GLAudio.good();
  else GLAudio.warn();
  goto('result');

  document.querySelectorAll('.stat-anim').forEach((el,i)=>{
    el.classList.remove('in');
    setTimeout(()=>el.classList.add('in'), 250+i*160);
  });
}

function drawChart(sw){
  const svg=$('chart');
  svg.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  const el=(n,attrs)=>{ const e=document.createElementNS(NS,n); for(const k in attrs) e.setAttribute(k,attrs[k]); svg.appendChild(e); return e; };
  const cx=150, sc=1.05, rowH=26, top=14;
  el('rect',{x:cx-ZONE_MAX*sc,y:4,width:(ZONE_MAX-ZONE_MIN)*sc,height:142,fill:'rgba(184,128,76,.13)',rx:4});
  el('rect',{x:cx+ZONE_MIN*sc,y:4,width:(ZONE_MAX-ZONE_MIN)*sc,height:142,fill:'rgba(184,128,76,.13)',rx:4});
  el('line',{x1:cx,y1:4,x2:cx,y2:146,stroke:'rgba(31,42,33,.3)','stroke-width':1,'stroke-dasharray':'2,3'});
  const bars=[];
  sw.forEach((s,i)=>{
    const y=top+i*rowH;
    const bw=Math.min(110,Math.abs(s.back))*sc;
    const fw=Math.min(110,Math.abs(s.follow))*sc;
    const ok=swingOk(s);
    const r1=el('rect',{x:cx-bw,y:y,width:bw,height:9,rx:4.5,fill:ok?'#B8804C':'#C45B4A',opacity:.95});
    r1.style.transformOrigin=cx+'px '+(y+4.5)+'px'; r1.style.transform='scaleX(0)';
    r1.style.transition='transform .55s cubic-bezier(.22,.61,.36,1) '+(i*90)+'ms';
    bars.push(r1);
    if(fw>1){
      const r2=el('rect',{x:cx,y:y,width:fw,height:9,rx:4.5,fill:ok?'rgba(184,128,76,.45)':'rgba(196,91,74,.45)'});
      r2.style.transformOrigin=cx+'px '+(y+4.5)+'px'; r2.style.transform='scaleX(0)';
      r2.style.transition='transform .55s cubic-bezier(.22,.61,.36,1) '+(120+i*90)+'ms';
      bars.push(r2);
    }
    const t=el('text',{x:8,y:y+8,'font-size':9,fill:'#8A8A82','font-family':'Inter'});
    t.textContent='#'+(i+1);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach(b=>b.style.transform='scaleX(1)')));
}
