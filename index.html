<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Golflev v10.0 - Golf Swing Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-main: #F8F5EF;
            --color-bg-card: #FFFFFF;
            --color-bg-secondary: #F0EDE7;
            --color-primary: #2D3B2D;
            --color-accent: #2D3B2D;
            --color-accent-light: #4A6B4A;
            --color-gold: #C8956C;
            --color-gold-light: #D4A97A;
            --color-text: #2D3B2D;
            --color-text-secondary: #8A8A82;
            --color-accent-text: #C8956C;
            --color-success: #4A6B4A;
            --color-warning: #D4A040;
            --color-error: #C45B4A;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', 'Noto Serif JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFFDF9 0%, #F8F5EF 100%);
            color: var(--color-text);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-top: env(safe-area-inset-top, 0);
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        /* TYPOGRAPHY */
        h1 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--color-text);
        }

        h2 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--color-text);
            margin: 1rem 0;
        }

        h3 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--color-text);
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: var(--color-gold);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .text-sm {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .text-tiny {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Noto Serif JP', 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--color-primary);
            color: #F8F5EF;
            box-shadow: 0 6px 24px rgba(45, 59, 45, 0.25);
            letter-spacing: 0.08em;
        }

        .btn-primary:active {
            box-shadow: 0 8px 32px rgba(45, 59, 45, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-primary);
        }

        .btn-secondary:active {
            background: rgba(45, 59, 45, 0.06);
        }

        .btn-success {
            background: var(--color-success);
            color: #F8F5EF;
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-secondary);
            border: none;
        }

        .btn-sm {
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: 1.25rem 2rem;
            font-size: 1.125rem;
            height: 56px;
        }

        .btn-block {
            display: flex;
            width: 100%;
        }

        /* CARDS */
        .card {
            background: var(--color-bg-card);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-gold), var(--color-primary));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-clickable {
            cursor: pointer;
            user-select: none;
        }

        /* LAYOUT */
        .header {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: transparent;
        }

        .hero-header {
            padding: 2.5rem 1.5rem 1.8rem;
            text-align: center;
            background: transparent;
            position: relative;
        }
        .hero-header .logo {
            color: var(--color-primary);
            margin-bottom: 0.4rem;
        }
        .hero-header .logo span {
            color: #C8956C !important;
        }
        .hero-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }
        .hero-ornament-line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,149,108,0.5));
        }
        .hero-ornament-line:last-child {
            background: linear-gradient(90deg, rgba(200,149,108,0.5), transparent);
        }
        .hero-ornament-diamond {
            width: 6px;
            height: 6px;
            background: #C8956C;
            transform: rotate(45deg);
            opacity: 0.6;
        }

        .content {
            flex: 1;
            padding: 0 1.5rem 1.5rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .footer {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1rem;
            background: white;
            border-top: 1px solid var(--color-bg-secondary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall .card {
            min-height: 200px;
        }

        .stack-v {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stack-h {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            align-items: center;
        }

        /* LOGO */
        .logo {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(200, 149, 108, 0.15);
            color: var(--color-gold);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        /* TODAY'S STATS */
        .stats-card {
            background: linear-gradient(135deg, var(--color-primary) 0%, #3A4D3A 100%);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
            color: white;
            margin-top: 0.75rem;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .stats-header-title {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }

        .stats-header-link {
            font-size: 0.75rem;
            color: var(--color-gold-light);
            cursor: pointer;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            text-align: center;
        }

        .stat-item-value {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .stat-item-unit {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            vertical-align: super;
            margin-left: 2px;
        }

        .stat-item-label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.25rem;
        }

        /* WEEKLY PROGRESS */
        .weekly-card {
            background: var(--color-bg-card);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-top: 0.75rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .weekly-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .weekly-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text);
        }

        .weekly-percent {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--color-bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-gold));
            transition: width 1s ease;
        }

        /* SENSOR STATE PHASE INDICATOR */
        .phase-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin: 0.5rem 0;
        }

        .phase-steps {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .phase-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(200,149,108,0.2);
            transition: all 0.3s;
        }

        .phase-dot.active {
            background: var(--color-gold);
            box-shadow: 0 0 8px rgba(200,149,108,0.4);
        }

        .phase-dot.done {
            background: var(--color-success);
        }

        .phase-line {
            width: 24px;
            height: 2px;
            background: rgba(200,149,108,0.2);
        }

        .phase-line.done {
            background: var(--color-success);
        }

        .phase-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text);
        }

        .phase-sublabel {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            text-align: center;
            line-height: 1.4;
        }

        /* 3D SWING COMPASS */
        .golfer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0.5rem 0;
        }
        .golfer-container {
            position: relative;
            width: 280px;
            height: 280px;
        }
        .golfer-svg {
            width: 100%;
            height: 100%;
        }
        .golfer-values {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 0.5rem;
        }
        .golfer-axis {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
        }
        .golfer-axis-num {
            font-family: 'Inter', 'Noto Serif JP', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
        }
        .golfer-axis-num.gold {
            color: var(--color-gold);
        }
        .golfer-axis-num.green {
            color: #4A7A4A;
        }
        .golfer-axis-unit {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .golfer-total {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 0.5rem;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, #3A4D3A 100%);
            border-radius: 12px;
            color: white;
        }
        .golfer-total-num {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }
        .golfer-total-label {
            font-size: 0.6rem;
            font-weight: 600;
            opacity: 0.8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        /* Club head glow pulse */
        @keyframes club-glow {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(200,149,108,0.3)); }
            50% { filter: drop-shadow(0 0 10px rgba(200,149,108,0.7)); }
        }
        @keyframes club-glow-idle {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(90,122,90,0.2)); }
            50% { filter: drop-shadow(0 0 6px rgba(90,122,90,0.4)); }
        }
        /* Trail shimmer */
        @keyframes trail-dash {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -14; }
        }
        /* REC blink */
        @keyframes rec-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        /* Pivot ring pulse */
        @keyframes pivot-ring {
            0%, 100% { r: 5; opacity: 0.6; }
            50% { r: 7; opacity: 0.3; }
        }
        @keyframes golfer-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .golfer-recording .golfer-total {
            animation: golfer-pulse 1s ease-in-out infinite;
        }
        .golfer-svg {
            overflow: visible;
        }

        /* CARD TITLE AREA */
        .card-title-area {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--color-primary) 0%, #4A6B4A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .card-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(200, 149, 108, 0.12);
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.5;
                box-shadow: 0 0 20px rgba(200, 149, 108, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 40px rgba(200, 149, 108, 0.5);
            }
        }

        @keyframes confetti {
            0% {
                transform: translate(var(--tx), var(--ty)) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(calc(var(--tx) + 100px), calc(var(--ty) + 100px)) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Staggered entrance for home screen */
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .home-stagger-1 { animation: riseIn 0.5s 0.1s cubic-bezier(0.25,0.46,0.45,0.94) both; }
        .home-stagger-2 { animation: riseIn 0.5s 0.25s cubic-bezier(0.25,0.46,0.45,0.94) both; }
        .home-stagger-3 { animation: riseIn 0.5s 0.4s cubic-bezier(0.25,0.46,0.45,0.94) both; }

        .drill-card {
            animation: slideInLeft 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* GAUGE/CIRCLE */
        .metric-circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFFFFF, var(--color-bg-secondary));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2rem auto;
            border: 2px solid var(--color-gold);
            position: relative;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(200, 149, 108, 0.15);
        }

        .metric-circle.success {
            border-color: var(--color-success);
            animation: successPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1), pulseGlow 2s infinite;
        }

        .metric-circle.fail {
            border-color: var(--color-error);
        }

        .metric-circle.waiting {
            animation: pulseGlow 1.5s infinite;
        }

        .metric-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 4rem;
            color: var(--color-primary);
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .metric-circle.success .metric-value {
            color: var(--color-success);
        }

        .metric-circle.fail .metric-value {
            color: var(--color-error);
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .metric-unit {
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        /* STATE INDICATORS */
        .state-badge {
            padding: 0.75rem 1.25rem;
            border-radius: 20px;
            font-weight: 600;
            text-align: center;
            margin: 1rem 0;
            letter-spacing: 0.02em;
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
        }

        .state-ready {
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
        }

        .state-recording {
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
            animation: pulse 1s infinite;
        }

        .state-waiting {
            background: rgba(138, 138, 130, 0.08);
            color: var(--color-text-secondary);
        }

        /* BACK BUTTON */
        .back-btn {
            padding: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: white;
            color: var(--color-primary);
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* DIFFICULTY CARD */
        .difficulty-card {
            padding: 1.25rem;
            border: 1.5px solid var(--color-bg-secondary);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .difficulty-card:active {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
        }

        .difficulty-card.selected {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
            box-shadow: 0 4px 16px rgba(200, 149, 108, 0.2);
        }

        .difficulty-name {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .difficulty-spec {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* SUCCESS/FAIL MESSAGE */
        .result-message {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin: 1.5rem 0;

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // iOS SENSOR PERMISSION
        const requestSensorPermission = async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') {
                        alert("センサーの許可が必要です。設定からモーションセンサーを許可してください。");
                        return false;
                    }
                } catch(e) {
                    alert("センサー許可エラー: " + e.message);
                    return false;
                }
            }
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
            }
            return true;
        };

        // AUDIO UTILS
        let _audioCtx = null;
        const getAudioCtx = () => {
            if (!_audioCtx) {
                _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        };
        const AudioUtils = {
            beep: (freq = 800, duration = 150) => {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration / 1000);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration / 1000);
                } catch (e) {}
            },
            success: () => {
                AudioUtils.beep(1000, 200);
                setTimeout(() => AudioUtils.beep(1200, 200), 150);
            },
            fail: () => { AudioUtils.beep(400, 300); },
            click: () => { AudioUtils.beep(600, 100); },
            ready: () => {
                AudioUtils.beep(660, 120);
                setTimeout(() => AudioUtils.beep(880, 150), 150);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },
            perfect: () => {
                try {
                    const ctx = getAudioCtx();
                    const t = ctx.currentTime;
                    [880, 1108, 1318].forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = f; o.type = "sine";
                        g.gain.setValueAtTime(0, t + i * 0.1);
                        g.gain.linearRampToValueAtTime(0.4, t + i * 0.1 + 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.5);
                        o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.5);
                    });
                } catch(e) {}
            }
        };

        // ============================================================
        // QUATERNION MATH UTILITIES
        // For physically correct rotation computation.
        // Euler angle subtraction is only accurate for small rotations (<15°).
        // For half swings (60-90°), quaternions eliminate:
        //   - Gimbal lock (gamma clamped to ±90°)
        //   - Non-linear coupling between alpha/beta/gamma
        //   - ~25% error in angle computation at large rotations
        // ============================================================
        const QuatUtils = {
            // Convert W3C DeviceOrientation Euler angles (degrees) → unit quaternion
            // W3C convention: intrinsic ZXY rotation (alpha=Z, beta=X, gamma=Y)
            // R = Rz(alpha) · Rx(beta) · Ry(gamma)
            fromEuler: (alphaDeg, betaDeg, gammaDeg) => {
                const d2r = Math.PI / 360; // half-angle: deg → rad/2
                const a = (alphaDeg || 0) * d2r;
                const b = (betaDeg  || 0) * d2r;
                const g = (gammaDeg || 0) * d2r;
                const ca = Math.cos(a), sa = Math.sin(a);
                const cb = Math.cos(b), sb = Math.sin(b);
                const cg = Math.cos(g), sg = Math.sin(g);
                return {
                    w: ca*cb*cg - sa*sb*sg,
                    x: ca*sb*cg - sa*cb*sg,
                    y: ca*cb*sg + sa*sb*cg,
                    z: ca*sb*sg + sa*cb*cg
                };
            },

            // Quaternion conjugate (= inverse for unit quaternions)
            conj: q => ({ w: q.w, x: -q.x, y: -q.y, z: -q.z }),

            // Hamilton product: a ⊗ b
            mul: (a, b) => ({
                w: a.w*b.w - a.x*b.x - a.y*b.y - a.z*b.z,
                x: a.w*b.x + a.x*b.w + a.y*b.z - a.z*b.y,
                y: a.w*b.y - a.x*b.z + a.y*b.w + a.z*b.x,
                z: a.w*b.z + a.x*b.y - a.y*b.x + a.z*b.w
            }),

            // Rotate vector v by quaternion q: v' = q ⊗ v ⊗ q*
            // Optimized direct computation (no intermediate quaternion objects)
            rotVec: (q, v) => {
                const qw = q.w, qx = q.x, qy = q.y, qz = q.z;
                const vx = v.x, vy = v.y, vz = v.z;
                // t = 2 × (q_vec × v)
                const tx = 2 * (qy * vz - qz * vy);
                const ty = 2 * (qz * vx - qx * vz);
                const tz = 2 * (qx * vy - qy * vx);
                return {
                    x: vx + qw * tx + (qy * tz - qz * ty),
                    y: vy + qw * ty + (qz * tx - qx * tz),
                    z: vz + qw * tz + (qx * ty - qy * tx)
                };
            },

            // Total rotation angle of quaternion (degrees, 0 to 180)
            angle: q => {
                const w = Math.min(1, Math.max(-1, q.w));
                return 2 * Math.acos(Math.abs(w)) * 180 / Math.PI;
            },

            // Swing-Twist decomposition around Y-axis (shaft axis at address)
            // Separates:
            //   twist = rotation AROUND the shaft (wrist roll/cock)
            //   swing = rotation that MOVES the shaft to new direction
            // Physically: q_rel = swing ⊗ twist  (twist first, then swing)
            decomposeSwingTwist: q => {
                // Project q onto Y-axis (keep w and y components only)
                const len = Math.sqrt(q.w * q.w + q.y * q.y);
                if (len < 1e-6) {
                    // Degenerate: 180° swing perpendicular to shaft
                    return {
                        twist: { w: 1, x: 0, y: 0, z: 0 },
                        swing: { w: q.w, x: q.x, y: q.y, z: q.z },
                        twistAngle: 0
                    };
                }
                const twist = { w: q.w / len, x: 0, y: q.y / len, z: 0 };
                const swing = QuatUtils.mul(q, QuatUtils.conj(twist));
                const twistAngle = 2 * Math.atan2(twist.y, twist.w) * 180 / Math.PI;
                return { swing, twist, twistAngle };
            }
        };

        // SENSOR UTILS v12 - Quaternion-based measurement
        const _prevAcc = { x: 0, y: 0, z: 0 };
        const calcJerk = (ax, ay, az) => {
            const j = Math.sqrt(
                (ax - _prevAcc.x) ** 2 + (ay - _prevAcc.y) ** 2 + (az - _prevAcc.z) ** 2
            );
            _prevAcc.x = ax; _prevAcc.y = ay; _prevAcc.z = az;
            return j;
        };

        // Normalize angle delta to -180..180
        const normAngle = (d) => {
            while (d > 180) d -= 360;
            while (d < -180) d += 360;
            return d;
        };

        // Clamp value between min and max
        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

        const SensorUtils = {
            detectStillness: (history, threshold = 2.0, duration = 600) => {
                const now = Date.now();
                const recent = history.filter(d => now - d.time < duration);
                if (recent.length < 5) return false;
                const avgJerk = recent.reduce((s, d) => s + (d.jerk || 0), 0) / recent.length;
                const avgRot = recent.reduce((s, d) => s + (d.rotMag || 0), 0) / recent.length;
                return avgJerk < threshold && avgRot < 25;
            },

            // Detect swing start: uses rotationRate magnitude (gyroscope)
            // More reliable than jerk for detecting actual rotational movement
            detectSwingStart: (history) => {
                if (history.length < 3) return false;
                const last3 = history.slice(-3);
                // Swing start: rotMag consistently > 40 deg/s for 3 samples
                // OR single strong rotMag > 80 deg/s
                const avgRot = last3.reduce((s, d) => s + d.rotMag, 0) / 3;
                const maxRot = Math.max(...last3.map(d => d.rotMag));
                return avgRot > 40 || maxRot > 80;
            },

            detectStop: (history, duration = 400) => {
                const now = Date.now();
                const recent = history.filter(d => now - d.time < duration);
                if (recent.length < 3) return false;
                return recent.every(d => d.rotMag < 15 && d.jerk < 3);
            },

            // ============================================================
            // QUATERNION-BASED ANGLE CALCULATION
            // No manual axis mapping needed — quaternion math automatically
            // separates shaft movement from wrist roll via swing-twist decomposition.
            // This eliminates the gamma/beta/alpha mapping problem entirely.
            // ============================================================
            calcAngles: (orient, baseline) => {
                if (!baseline) return { vertical: 0, horizontal: 0, wristCock: 0, combined: 0, signedHorizontal: 0, deviation: 0 };

                // Step 1: Convert both orientations to quaternions
                const qC = QuatUtils.fromEuler(orient.alpha, orient.beta, orient.gamma);
                const qB = QuatUtils.fromEuler(baseline.alpha, baseline.beta, baseline.gamma);

                // Step 2: Relative quaternion (for deviation)
                const qRel = QuatUtils.mul(QuatUtils.conj(qB), qC);
                const deviation = QuatUtils.angle(qRel);

                // Step 3: Wrist roll from swing-twist decomposition
                const { twistAngle } = QuatUtils.decomposeSwingTwist(qRel);
                const wristCock = clamp(twistAngle, -180, 180);

                // Step 4: EARTH-FRAME shaft tracking
                // Track where the shaft (phone Y-axis) is pointing in WORLD coordinates
                // This correctly uses ALL sensor data (alpha + beta + gamma)
                const shaftCur = QuatUtils.rotVec(qC, { x: 0, y: 1, z: 0 });
                const shaftBl = QuatUtils.rotVec(qB, { x: 0, y: 1, z: 0 });

                // Step 5: VERTICAL = angle between current shaft and address shaft
                const shaftDot = Math.min(1, Math.max(-1,
                    shaftCur.x * shaftBl.x + shaftCur.y * shaftBl.y + shaftCur.z * shaftBl.z
                ));
                const vertical = Math.acos(shaftDot) * 180 / Math.PI;

                // Step 6: HORIZONTAL = inside/outside direction
                // Uses SWING PLANE approach:
                //   Swing plane = vertical plane containing shaft_bl and gravity (0,1,0)
                //   Plane normal = cross(shaft_bl, gravity_down)
                //   Positive horizontal = shaft deviated to one side (outside)
                //   Negative horizontal = shaft deviated to other side (inside)
                // This gives 0° for straight takeaway and ±degrees for lateral deviation.
                const gravDown = { x: 0, y: -1, z: 0 };
                // Normal to swing plane
                const pnx = shaftBl.y * gravDown.z - shaftBl.z * gravDown.y;
                const pny = shaftBl.z * gravDown.x - shaftBl.x * gravDown.z;
                const pnz = shaftBl.x * gravDown.y - shaftBl.y * gravDown.x;
                const pnLen = Math.sqrt(pnx*pnx + pny*pny + pnz*pnz);

                let horizontal = 0;
                if (pnLen > 0.01 && vertical > 2) {
                    const nx = pnx/pnLen, ny = pny/pnLen, nz = pnz/pnLen;
                    // Shaft displacement: remove component along baseline shaft
                    const dsx = shaftCur.x - shaftDot * shaftBl.x;
                    const dsy = shaftCur.y - shaftDot * shaftBl.y;
                    const dsz = shaftCur.z - shaftDot * shaftBl.z;
                    // Lateral = projection onto plane normal
                    const lateral = dsx*nx + dsy*ny + dsz*nz;
                    // Displacement magnitude
                    const dLen = Math.sqrt(dsx*dsx + dsy*dsy + dsz*dsz);
                    if (dLen > 0.001) {
                        const sinLat = Math.min(1, Math.max(-1, lateral / dLen));
                        horizontal = Math.asin(sinLat) * 180 / Math.PI;
                    }
                }

                return {
                    vertical,              // shaft tilt from address (≥ 0, degrees)
                    horizontal,            // inside/outside direction (signed, degrees)
                    wristCock,             // twist around shaft axis (signed, degrees)
                    combined: vertical,    // swing arc
                    signedHorizontal: horizontal,
                    deviation              // total rotation from baseline (degrees)
                };
            },

            calculateMetrics: (allData, baseline) => {
                if (!allData || allData.length < 8) return null;
                const bl = baseline || {
                    beta: allData[0].beta,
                    gamma: allData[0].gamma,
                    alpha: allData[0].alpha
                };

                // For each data point, calc 3-axis angles from baseline
                const angles = allData.map(d => SensorUtils.calcAngles(d, bl));

                // ============================================================
                // PHASE 1: Find top of backswing (max combined angle)
                // ============================================================
                let maxCombined = 0, topIdx = 0;
                for (let i = 2; i < allData.length - 2; i++) {
                    if (angles[i].combined > maxCombined) {
                        maxCombined = angles[i].combined;
                        topIdx = i;
                    }
                }

                const verticalMax = Math.abs(angles[topIdx].vertical);
                const horizontalMax = Math.abs(angles[topIdx].horizontal);

                // ============================================================
                // PHASE 2: Impact detection (improved)
                // Find the point in downswing where vertical (gamma) comes
                // closest to zero = hand returns to address height
                // ============================================================
                let impactIdx = topIdx;
                let minVerticalAtImpact = Math.abs(angles[topIdx].vertical);
                for (let i = topIdx + 1; i < allData.length - 1; i++) {
                    const absV = Math.abs(angles[i].vertical);
                    if (absV < minVerticalAtImpact) {
                        minVerticalAtImpact = absV;
                        impactIdx = i;
                    }
                    // Once vertical starts increasing again (follow-through), stop
                    if (i > impactIdx + 2 && absV > minVerticalAtImpact + 5) break;
                }

                // ============================================================
                // PHASE 3: Follow-through detection (max combined after impact)
                // ============================================================
                let followThroughIdx = impactIdx;
                let followThroughAngle = 0;
                for (let j = impactIdx; j < allData.length - 1; j++) {
                    if (angles[j].combined > followThroughAngle) {
                        followThroughAngle = angles[j].combined;
                        followThroughIdx = j;
                    }
                }

                // ============================================================
                // ② TAKEAWAY DIRECTION (テイクバック方向)
                // How the hands move during takeaway in the horizontal-vertical plane
                // takeawayDirection = atan2(horizontal, vertical) at top
                //   ~0° = straight up (ideal for small swings)
                //   positive = hands went outward (前に出すぎ)
                //   negative = hands went inward (背中側に引きすぎ)
                // ============================================================
                const takeawayH = angles[topIdx].horizontal;
                const takeawayV = angles[topIdx].vertical;
                const takeawayDirection = Math.atan2(takeawayH, Math.abs(takeawayV)) * 180 / Math.PI;
                // Also track the ratio: how much horizontal relative to vertical
                // Ideal ratio depends on swing size, but extreme values indicate problems
                const takeawayHVRatio = Math.abs(takeawayV) > 3
                    ? Math.abs(takeawayH) / Math.abs(takeawayV)
                    : 0;

                // ============================================================
                // ③ RETURN ACCURACY (アドレス位置への戻し / 再現度)
                // Uses quaternion deviation: the EXACT total angular distance
                // from current orientation to baseline orientation.
                // This is mathematically superior to sqrt(v² + h²) which
                // ignores wrist roll and has nonlinear errors at large angles.
                // ============================================================
                const impactV = angles[impactIdx].vertical;
                const impactH = angles[impactIdx].horizontal;
                // Use quaternion-based deviation (exact, includes all rotation components)
                const impactDeviation = angles[impactIdx].deviation;
                // Scale: 0° deviation = 100%, 30°+ deviation = 0%
                const returnAccuracy = Math.max(0, Math.min(100,
                    Math.round(100 - (impactDeviation / 30) * 100)
                ));

                // ============================================================
                // ④ SWING PATH TYPE (スイング軌道タイプ判定)
                // Compare takeaway vs downswing horizontal (swing-plane deviation).
                // Horizontal measures lateral deviation from the swing plane in degrees.
                //   - Same horizontal path = inside-in
                //   - Downswing more positive = outside-in
                //   - Downswing more negative = inside-out
                // ============================================================
                let pathDifference = 0;
                let pathType = 'inside-in';
                if (topIdx > 3 && impactIdx > topIdx + 2) {
                    // Build curves using horizontal at each vertical level
                    const takeawayCurve = [];
                    for (let i = 0; i <= topIdx; i++) {
                        takeawayCurve.push({
                            v: angles[i].vertical,
                            lat: angles[i].horizontal  // earth-frame direction
                        });
                    }
                    const downswingCurve = [];
                    for (let i = topIdx; i <= impactIdx; i++) {
                        downswingCurve.push({
                            v: angles[i].vertical,
                            lat: angles[i].horizontal
                        });
                    }

                    // Compare at vertical checkpoints (25%, 50%, 75% of max)
                    const maxV = takeawayV;  // already positive from quaternion
                    const checkpoints = [0.25, 0.50, 0.75];
                    let totalDiff = 0;
                    let validCheckpoints = 0;

                    for (const frac of checkpoints) {
                        const targetV = maxV * frac;
                        if (targetV < 5) continue;  // skip tiny angles (noisy)

                        let bestT = null, bestTDist = Infinity;
                        for (const pt of takeawayCurve) {
                            const d = Math.abs(pt.v - targetV);
                            if (d < bestTDist) { bestTDist = d; bestT = pt; }
                        }

                        let bestD = null, bestDDist = Infinity;
                        for (const pt of downswingCurve) {
                            const d = Math.abs(pt.v - targetV);
                            if (d < bestDDist) { bestDDist = d; bestD = pt; }
                        }

                        if (bestT && bestD &&
                            bestTDist < maxV * 0.2 && bestDDist < maxV * 0.2) {
                            // Compare horizontal direction
                            // Positive diff = downswing more outward than takeaway
                            totalDiff += (bestD.lat - bestT.lat);
                            validCheckpoints++;
                        }
                    }

                    if (validCheckpoints > 0) {
                        // pathDifference is in degrees (earth-frame horizontal)
                        pathDifference = totalDiff / validCheckpoints;
                        const PATH_THRESHOLD = 4;  // degrees
                        if (pathDifference > PATH_THRESHOLD) {
                            pathType = 'outside-in';
                        } else if (pathDifference < -PATH_THRESHOLD) {
                            pathType = 'inside-out';
                        } else {
                            pathType = 'inside-in';
                        }
                    }
                }

                // ============================================================
                // EXISTING METRICS (retained for compatibility)
                // ============================================================

                // Max wrist cock during backswing (0 to topIdx)
                let maxWristCock = 0;
                for (let i = 0; i <= topIdx; i++) {
                    if (Math.abs(angles[i].wristCock) > maxWristCock) {
                        maxWristCock = Math.abs(angles[i].wristCock);
                    }
                }

                // Tempo: backswing time / downswing time
                const backswingTime = allData[topIdx].time - allData[0].time;
                const downswingTime = allData[allData.length - 1].time - allData[topIdx].time;
                const tempo = downswingTime > 20 ? backswingTime / downswingTime : 0;

                // Smoothness: based on jerk variance (lower variance = smoother)
                const jerks = allData.map(d => d.jerk || 0);
                const avgJerk = jerks.reduce((s, j) => s + j, 0) / jerks.length;
                const jerkVariance = jerks.reduce((s, j) => s + (j - avgJerk) ** 2, 0) / jerks.length;
                const smoothness = Math.max(0, Math.min(100,
                    Math.round(100 - Math.sqrt(jerkVariance) * 2.5)
                ));

                // VFA (Vertical Face Angle) at top of backswing
                // With quaternion swing-twist decomposition, the twist component
                // IS the face angle — it's the rotation around the shaft axis,
                // which is exactly what "face angle relative to swing plane" means.
                // No projection approximation needed.
                const vfa = angles[topIdx].wristCock;

                // Peak rotational velocity (deg/s) - indicator of swing speed
                const peakRotVel = Math.max(...allData.map(d => d.rotMag));

                return {
                    // Legacy metrics
                    verticalAngle: Math.round(verticalMax * 10) / 10,
                    horizontalAngle: Math.round(horizontalMax * 10) / 10,
                    combinedAngle: Math.round(maxCombined * 10) / 10,
                    betaDelta: Math.round(maxCombined * 10) / 10,
                    tempo: Math.round(tempo * 10) / 10,
                    smoothness,
                    vfa: Math.round(vfa * 10) / 10,
                    peakRotVel: Math.round(peakRotVel),
                    backswingTime,
                    downswingTime,
                    topIdx,
                    dataPoints: allData.length,
                    durationMs: allData[allData.length - 1].time - allData[0].time,
                    followThroughAngle: Math.round(followThroughAngle * 10) / 10,
                    followThroughIdx,
                    maxWristCock: Math.round(maxWristCock * 10) / 10,

                    // ② Takeaway direction metrics
                    takeawayDirection: Math.round(takeawayDirection * 10) / 10,
                    takeawayHVRatio: Math.round(takeawayHVRatio * 100) / 100,
                    takeawayVertical: Math.round(takeawayV * 10) / 10,
                    takeawayHorizontal: Math.round(takeawayH * 10) / 10,

                    // ③ Return accuracy metrics
                    impactIdx,
                    impactDeviation: Math.round(impactDeviation * 10) / 10,
                    impactVertical: Math.round(impactV * 10) / 10,
                    impactHorizontal: Math.round(impactH * 10) / 10,
                    returnAccuracy,

                    // ④ Swing path metrics

        // SVG Arc path helper
        const describeArc = (cx, cy, r, startAngle, endAngle) => {

            const diff = Math.abs(endAngle - startAngle);
            const largeArc = diff > 180 ? 1 : 0;
            return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y}`;
        };

        const SwingCompass = ({ beta, gamma, alpha, baseline, state }) => {

                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    setValue(Math.floor(end * progress));
                    if (progress < 1) {
                        requestAnimationFrame(tick);
                    } else {
                        setValue(end);
                    }
                };
                tick();
            }, [end, duration]);
            return value;

                } catch {}

                    next[idx] = editVal.trim();

        // DRILL EXECUTION
        const DrillExecutionScreen = ({ zone, drillId, difficulty, onComplete, onBack }) => {
            const [state, setState] = useState('grip');
            const [metrics, setMetrics] = useState(null);
            const [orient, setOrient] = useState({ beta: 0, gamma: 0, alpha: 0 });
            const sensorHistoryRef = useRef([]);
            const orientRef = useRef({ beta: 0, gamma: 0, alpha: 0 });
            const baselineRef = useRef(null);
            const stateRef = useRef('grip');
            const recordingDataRef = useRef([]);
            const readyTimeRef = useRef(0);
            const readyStableCountRef = useRef(0);

            const drillConfig = {
                width: {
                    business: { easy: [15, 45], normal: [18, 38], hard: [20, 35] },
                    half: { easy: [35, 75], normal: [40, 65], hard: [45, 60] }
                },
                tempo: {
                    business: { easy: { range: [1.5, 5.0], smooth: 40 }, normal: { range: [2.0, 4.0], smooth: 55 }, hard: { range: [2.5, 3.5], smooth: 70 } },
                    half: { easy: { range: [1.5, 5.0], smooth: 40 }, normal: { range: [2.0, 4.0], smooth: 55 }, hard: { range: [2.5, 3.5], smooth: 70 } }
                },
                face: {
                    business: { easy: 20, normal: 12, hard: 6 },
                    half: { easy: 18, normal: 10, hard: 5 }
                }
            };

            const config = drillConfig[drillId][zone][difficulty];

            // Single unified sensor effect
            useEffect(() => {
                if (stateRef.current === 'grip' || stateRef.current === 'stopped') return;

                const handleDeviceOrientation = (event) => {
                    const o = {
                        beta: event.beta || 0,
                        gamma: event.gamma || 0,
                        alpha: event.alpha || 0,
                    };
                    orientRef.current = o;
                    // Throttle React state updates to ~15fps for compass animation
                    if (!handleDeviceOrientation._last || Date.now() - handleDeviceOrientation._last > 66) {
                        handleDeviceOrientation._last = Date.now();
                        setOrient({ ...o });
                    }
                };

                const handleDeviceMotion = (event) => {
                    const rr = event.rotationRate || {};
                    const rotX = rr.beta || 0;
                    const rotY = rr.gamma || 0;
                    const rotZ = rr.alpha || 0;
                    const rotMag = Math.sqrt(rotX * rotX + rotY * rotY + rotZ * rotZ);
                    const a = event.accelerationIncludingGravity || event.acceleration || {};
                    const jerk = calcJerk(a.x || 0, a.y || 0, a.z || 0);
                    const now = Date.now();
                    const o = orientRef.current;

                    sensorHistoryRef.current.push({
                        time: now,
                        beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                        rotX, rotY, rotZ, rotMag, jerk
                    });
                    if (sensorHistoryRef.current.length > 500) sensorHistoryRef.current.shift();

                    // State machine
                    // Phase 1: 'waiting' — sensor is active, waiting for user to tap to confirm address
                    // Phase 2: 'ready' — baseline captured, waiting for swing start
                    // Phase 3: 'recording' — recording swing data
                    if (stateRef.current === 'waiting') {
                        // Just accumulate sensor data; baseline is set by tap (handleAddressConfirm)
                        // No auto-detection — user explicitly confirms address position
                    } else if (stateRef.current === 'ready') {
                        if (jerk < 2.0 && rotMag < 25) {
                            readyStableCountRef.current++;
                        } else {
                            readyStableCountRef.current = 0;
                        }
                        const readyElapsed = now - readyTimeRef.current;
                        // Use gyroscope-based swing detection (more reliable)
                        if (readyElapsed > 300 && readyStableCountRef.current > 3 &&
                            SensorUtils.detectSwingStart(sensorHistoryRef.current)) {
                            stateRef.current = 'recording';
                            setState('recording');
                            recordingDataRef.current = [];
                            AudioUtils.beep(1000, 100);
                        }
                    } else if (stateRef.current === 'recording') {
                        recordingDataRef.current.push({
                            time: now,
                            beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                            rotX, rotY, rotZ, rotMag, jerk
                        });

                        if (SensorUtils.detectStop(sensorHistoryRef.current)) {
                            stateRef.current = 'stopped';
                            setState('stopped');
                            const calcMetrics = SensorUtils.calculateMetrics(
                                recordingDataRef.current, baselineRef.current
                            );
                            setMetrics(calcMetrics);
                            if (calcMetrics) AudioUtils.success();
                            else AudioUtils.fail();
                        }

                        // Timeout after 5 seconds
                        if (recordingDataRef.current.length > 0 &&
                            now - recordingDataRef.current[0].time > 5000) {
                            stateRef.current = 'stopped';
                            setState('stopped');
                            const calcMetrics = SensorUtils.calculateMetrics(
                                recordingDataRef.current, baselineRef.current
                            );
                            setMetrics(calcMetrics);
                        }
                    }
                };

                window.addEventListener('deviceorientation', handleDeviceOrientation);
                window.addEventListener('devicemotion', handleDeviceMotion);

                return () => {
                    window.removeEventListener('deviceorientation', handleDeviceOrientation);
                    window.removeEventListener('devicemotion', handleDeviceMotion);
                };
            }, [state]);

            const handleGripConfirm = async () => {
                AudioUtils.click();
                const ok = await requestSensorPermission();
                if (!ok) return;
                sensorHistoryRef.current = [];
                recordingDataRef.current = [];
                baselineRef.current = null;
                stateRef.current = 'waiting';
                setState('waiting');
            };

            // ADDRESS CONFIRM: User taps to register address position as baseline
            const handleAddressConfirm = () => {
                const o = orientRef.current;
                baselineRef.current = { beta: o.beta, gamma: o.gamma, alpha: o.alpha };
                stateRef.current = 'ready';
                setState('ready');
                readyTimeRef.current = Date.now();
                readyStableCountRef.current = 0;
                AudioUtils.ready();
            };

            if (state === 'grip') {
                return (
                    <div className="screen">
                        <div className="header">
                            <button className="btn btn-ghost back-btn" onClick={onBack}>←</button>
                            <h2>グリップの確認</h2>
                        </div>
                        <div className="content">
                            <GripGuideSteps />
                            <button className="btn btn-primary btn-lg btn-block" onClick={handleGripConfirm}>
                                準備完了
                            </button>
                        </div>
                    </div>
                );
            }

            if (state === 'ready' || state === 'waiting' || state === 'recording') {
                const phaseIdx = state === 'waiting' ? 0 : state === 'ready' ? 1 : 2;

                return (
                    <div className="screen">
                        <div className="header">
                            <h2>トレーニング中</h2>
                        </div>
                        <div className="content">
                            <div className="phase-indicator">
                                <div className="phase-steps">
                                    <div className={`phase-dot ${phaseIdx === 0 ? 'active' : phaseIdx > 0 ? 'done' : ''}`}></div>
                                    <div className={`phase-line ${phaseIdx > 0 ? 'done' : ''}`}></div>
                                    <div className={`phase-dot ${phaseIdx === 1 ? 'active' : phaseIdx > 1 ? 'done' : ''}`}></div>
                                    <div className={`phase-line ${phaseIdx > 1 ? 'done' : ''}`}></div>
                                    <div className={`phase-dot ${phaseIdx === 2 ? 'active' : ''}`}></div>
                                </div>
                                <div className="phase-label">
                                    {state === 'waiting' && '① アドレスを取ってください'}
                                    {state === 'ready' && '② スイング！'}
                                    {state === 'recording' && '③ 計測中...'}
                                </div>
                                <div className="phase-sublabel">
                                    {state === 'waiting' && 'アドレスの姿勢ができたら、画面をタップして確定'}
                                    {state === 'ready' && 'アドレスを登録しました。スイングしてください'}
                                    {state === 'recording' && 'スイングを記録しています。フィニッシュで止まってください'}
                                </div>
                            </div>
                            {state === 'waiting' && (
                                <button
                                    className="btn btn-primary btn-lg btn-block"
                                    onClick={handleAddressConfirm}
                                    style={{ marginTop: '1.5rem', padding: '1.25rem', fontSize: '1.1rem' }}
                                >
                                    アドレス確定
                                </button>
                            )}
                            <SwingCompass
                                beta={orient.beta}
                                gamma={orient.gamma}
                                alpha={orient.alpha}
                                baseline={baselineRef.current}
                                state={state}
                            />
                        </div>
                    </div>
                );
            }

            if (state === 'stopped' && metrics) {
                let success = false;
                let value = 0;
                let target = '';
                let displayValue = 0;

                if (drillId === 'width') {
                    value = metrics.combinedAngle;
                    displayValue = Math.round(value);
                    if (Array.isArray(config)) {
                        success = value >= config[0] && value <= config[1];
                        target = `${config[0]}° 〜 ${config[1]}°`;
                    }
                } else if (drillId === 'tempo') {
                    value = metrics.tempo;
                    displayValue = Math.round(value * 100) / 100;
                    const smoothVal = metrics.smoothness || 0;
                    const tempoRange = config.range || config;
                    const smoothThreshold = config.smooth || 0;
                    if (Array.isArray(tempoRange)) {
                        const tempoOk = value >= tempoRange[0] && value <= tempoRange[1];
                        const smoothOk = smoothVal >= smoothThreshold;
                        success = tempoOk && smoothOk;
                        target = `${tempoRange[0].toFixed(1)}:1〜${tempoRange[1].toFixed(1)}:1 / 安定度≥${smoothThreshold}%`;
                    }
                } else if (drillId === 'face') {
                    value = Math.abs(metrics.vfa);
                    displayValue = Math.round(value * 10) / 10;
                    success = value <= config;
                    target = `±${config}°`;
                }

                const countUpValue = useCountUp(displayValue, 800);

                // Record swing to session stats (only once per result render)
                useEffect(() => { SessionStats.addSwing(success); }, []);

                return (
                    <div className="screen">

                                    {drillId === 'tempo' ? countUpValue.toFixed(2) : countUpValue}
                                </div>
                                <div className="metric-label">
                                    {drillId === 'width' && '°'}
                                    {drillId === 'tempo' && ':1'}

                            )}

                                <div className="range-box">
                                    <div className="range-label">目標値</div>
                                    <div className="range-value">{target}</div>
                                </div>
                                <div className="range-box">
                                    <div className="range-label">あなたの値</div>
                                    <div className={`range-value ${success ? 'success' : 'danger'}`}>

        // FREE MODE - GRIP GUIDE
        const FreeGripGuideScreen = ({ onComplete, onBack }) => {

                            <div className="grip-icon"><svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="20" y="8" width="24" height="44" rx="4" stroke="#C8956C" strokeWidth="1.8" /><rect x="24" y="12" width="16" height="28" rx="2" stroke="#C8956C" strokeWidth="1" opacity="0.3" /><circle cx="32" cy="46" r="2" stroke="#C8956C" strokeWidth="1.2" /><path d="M18 26c-3 0-5 1.5-5 4v8c0 2.5 2 4 5 4" stroke="#C8956C" strokeWidth="1.5" strokeLinecap="round" fill="none" /><path d="M15 30h-2c-1.5 0-2.5 1-2.5 2.5s1 2.5 2.5 2.5h2" stroke="#C8956C" strokeWidth="1.2" strokeLinecap="round" fill="none" /><path d="M46 26c3 0 5 1.5 5 4v8c0 2.5-2 4-5 4" stroke="#C8956C" strokeWidth="1.5" strokeLinecap="round" fill="none" /><line x1="32" y1="56" x2="28" y2="60" stroke="#C8956C" strokeWidth="1" opacity="0.4" strokeLinecap="round" /><line x1="32" y1="56" x2="36" y2="60" stroke="#C8956C" strokeWidth="1" opacity="0.4" strokeLinecap="round" /><text x="32" y="63" textAnchor="middle" fill="#C8956C" fontSize="4" fontWeight="600" opacity="0.5" fontFamily="Inter, sans-serif">CAMERA ←</text></svg></div>
                            <div className="grip-text">
                                スマートフォンを握ってください。<br/>

                        <button className="btn btn-primary btn-lg btn-block" onClick={handleGripConfirm}>
                            準備完了
                        </button>
                    </div>
                </div>
            );
        };

        // FREE MODE - CALIBRATION
        const FreeCalibrationScreen = ({ onComplete, onBack }) => {
            const [step, setStep] = useState(1);
            const [calibrationReady, setCalibrationReady] = useState(false);

            const handleStartCalibration = () => {

            return (
                <div className="screen">
                    <div className="header">

                                <div className="step-title">スイング {i}</div>

                        {step <= 3 && (

        // FREE MODE - EXECUTION
        const FreeExecutionScreen = ({ onComplete, onBack }) => {

            const sensorHistoryRef = useRef([]);
            const orientRef = useRef({ beta: 0, gamma: 0, alpha: 0 });
            const baselineRef = useRef(null);
            const stateRef = useRef('waiting');
            const stillCountRef = useRef(0);
            const recordStartRef = useRef(0);
            const readyTimeRef = useRef(0);
            const readyStableCountRef = useRef(0);

            useEffect(() => {
                stateRef.current = state;
            }, [state]);

            useEffect(() => {
                const handleDeviceOrientation = (event) => {
                    const o = {
                        beta: event.beta || 0,
                        gamma: event.gamma || 0,
                        alpha: event.alpha || 0,
                    };
                    orientRef.current = o;
                    if (!handleDeviceOrientation._last || Date.now() - handleDeviceOrientation._last > 66) {
                        handleDeviceOrientation._last = Date.now();
                        setOrient({ ...o });
                    }
                };

                const handleDeviceMotion = (event) => {
                    const rr = event.rotationRate || {};
                    const rotX = rr.beta || 0;
                    const rotY = rr.gamma || 0;
                    const rotZ = rr.alpha || 0;
                    const rotMag = Math.sqrt(rotX * rotX + rotY * rotY + rotZ * rotZ);
                    const a = event.accelerationIncludingGravity || event.acceleration || {};
                    const jerk = calcJerk(a.x || 0, a.y || 0, a.z || 0);

                    const now = Date.now();
                    const curState = stateRef.current;
                    const o = orientRef.current;

                    sensorHistoryRef.current.push({
                        time: now,
                        beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                        rotX, rotY, rotZ, rotMag, jerk
                    });
                    if (sensorHistoryRef.current.length > 500) {
                        sensorHistoryRef.current.shift();
                    }

                    if (curState === 'waiting') {
                        // Baseline is set by handleFreeAddressConfirm (tap), not auto
                    }

                    if (curState === 'ready') {
                        if (jerk < 2.0 && rotMag < 25) {
                            readyStableCountRef.current++;
                        } else {
                            readyStableCountRef.current = 0;
                        }
                        const readyElapsed = now - readyTimeRef.current;
                        if (readyElapsed > 300 && readyStableCountRef.current > 3 &&
                            SensorUtils.detectSwingStart(sensorHistoryRef.current)) {
                            sensorHistoryRef.current = [];
                            sensorHistoryRef.current.push({
                                time: now,
                                beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                                rotX, rotY, rotZ, rotMag, jerk
                            });
                            recordStartRef.current = now;
                            setState('recording');
                            AudioUtils.beep(1000, 100);
                        }
                    }

                    if (curState === 'recording') {
                        if (SensorUtils.detectStop(sensorHistoryRef.current) &&
                            (now - recordStartRef.current) > 300) {
                            const allData = sensorHistoryRef.current;
                            const calcMetrics = SensorUtils.calculateMetrics(allData, baselineRef.current);
                            setState('stopped');
                            AudioUtils.success();
                            if (calcMetrics) setMetrics(calcMetrics);
                        }
                        if ((now - recordStartRef.current) > 5000) {
                            const allData = sensorHistoryRef.current;
                            const calcMetrics = SensorUtils.calculateMetrics(allData, baselineRef.current);
                            setState('stopped');
                            AudioUtils.success();
                            if (calcMetrics) setMetrics(calcMetrics);
                        }
                    }
                };

                window.addEventListener('deviceorientation', handleDeviceOrientation);
                window.addEventListener('devicemotion', handleDeviceMotion);

                return () => {
                    window.removeEventListener('deviceorientation', handleDeviceOrientation);
                    window.removeEventListener('devicemotion', handleDeviceMotion);
                };
            }, []);

            if (state === 'waiting' || state === 'ready' || state === 'recording') {
                const phaseIdx = state === 'waiting' ? 0 : state === 'ready' ? 1 : 2;

                // ADDRESS CONFIRM for free mode
                const handleFreeAddressConfirm = () => {
                    const o = orientRef.current;
                    baselineRef.current = { beta: o.beta, gamma: o.gamma, alpha: o.alpha };
                    setState('ready');
                    readyTimeRef.current = Date.now();
                    readyStableCountRef.current = 0;
                    AudioUtils.ready();
                };

                return (
                    <div className="screen">
                        <div className="header">
                            <h2>計測中</h2>
                        </div>
                        <div className="content">
                            <div className="phase-indicator">
                                <div className="phase-steps">
                                    <div className={`phase-dot ${phaseIdx === 0 ? 'active' : phaseIdx > 0 ? 'done' : ''}`}></div>
                                    <div className={`phase-line ${phaseIdx > 0 ? 'done' : ''}`}></div>
                                    <div className={`phase-dot ${phaseIdx === 1 ? 'active' : phaseIdx > 1 ? 'done' : ''}`}></div>
                                    <div className={`phase-line ${phaseIdx > 1 ? 'done' : ''}`}></div>
                                    <div className={`phase-dot ${phaseIdx === 2 ? 'active' : ''}`}></div>
                                </div>
                                <div className="phase-label">
                                    {state === 'waiting' && '① アドレスを取ってください'}
                                    {state === 'ready' && '② スイング！'}
                                    {state === 'recording' && '③ 計測中...'}
                                </div>
                                <div className="phase-sublabel">
                                    {state === 'waiting' && 'アドレスの姿勢ができたら、画面をタップして確定'}
                                    {state === 'ready' && 'アドレスを登録しました。スイングしてください'}
                                    {state === 'recording' && 'スイングを記録しています。フィニッシュで止まってください'}
                                </div>
                            </div>
                            {state === 'waiting' && (
                                <button
                                    className="btn btn-primary btn-lg btn-block"
                                    onClick={handleFreeAddressConfirm}
                                    style={{ marginTop: '1.5rem', padding: '1.25rem', fontSize: '1.1rem' }}
                                >
                                    アドレス確定
                                </button>
                            )}
                            <SwingCompass
                                beta={orient.beta}
                                gamma={orient.gamma}
                                alpha={orient.alpha}
                                baseline={baselineRef.current}
                                state={state}
                            />
                        </div>
                    </div>
                );
            }

            if (state === 'stopped' && metrics) {
                // Record swing to session stats (free measurement always counted as success)
                useEffect(() => { SessionStats.addSwing(true); }, []);

                return (

                                    <span className={`expandable-icon ${openSection === 'basic' ? 'open' : ''}`}>▼</span>
                                </div>
                                {openSection === 'basic' && (

                                        <div className="range-info">
                                            <div className="range-box">
                                                <div className="range-label">垂直面角度</div>
                                                <div className="range-value" style={{color: '#C8956C'}}>{metrics.verticalAngle.toFixed(1)}°</div>

                                            <div className="range-box">

                                                <div className="range-value">{metrics.horizontalAngle.toFixed(1)}°</div>
                                            </div>
                                        </div>
                                        <div className="range-info" style={{marginTop: '0.5rem'}}>
                                            <div className="range-box">
                                                <div className="range-label">合成振り幅</div>
                                                <div className="range-value success">{metrics.combinedAngle.toFixed(1)}°</div>
                                            </div>
                                            <div className="range-box">
                                                <div className="range-label">スムーズさ</div>
                                                <div className="range-value">{metrics.smoothness.toFixed(0)}%</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="expandable-section">
                                <div className="expandable-header" onClick={() => setOpenSection(openSection === 'tempo' ? '' : 'tempo')}>
                                    <span>テンポ・タイミング</span>
                                    <span className={`expandable-icon ${openSection === 'tempo' ? 'open' : ''}`}>▼</span>
                                </div>
                                {openSection === 'tempo' && (

        // MAIN APP
        const App = () => {
