                                        { id: 'inside-out', name: 'インサイドアウト', en: 'Inside-Out', desc: 'ドロー・フック系。飛距離が出る', color: '#5A7A5A',
                                          svg: React.createElement('svg', { width: 60, height: 40, viewBox: '0 0 60 40', fill: 'none' },
                                            React.createElement('circle', { cx: 30, cy: 30, r: 2.5, fill: 'white', stroke: '#C8956C', strokeWidth: 1 }),
                                            React.createElement('path', { d: 'M50 35 Q38 12 30 30 Q18 12 10 15', stroke: '#5A7A5A', strokeWidth: 1.8, fill: 'none', strokeLinecap: 'round' }),
                                            React.createElement('path', { d: 'M12 17 l-3 -3', stroke: '#5A7A5A', strokeWidth: 1, strokeLinecap: 'round' }),
                                          )
                                        },
                                    ].map(path => (
                                        <div
                                            key={path.id}
                                            className="card card-clickable"
                                            onClick={() => { AudioUtils.click(); setSwingPathType(path.id); setScreen('drill-difficulty'); }}
                                            style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1rem 1.25rem' }}
                                        >
                                            <div style={{ flexShrink: 0 }}>{path.svg}</div>
                                            <div style={{ flex: 1 }}>
                                                <div style={{ fontFamily: "'Playfair Display', serif", fontSize: '1rem', fontWeight: 700, color: 'var(--color-text)' }}>{path.name}</div>
                                                <div style={{ fontSize: '0.7rem', color: 'var(--color-gold)', fontWeight: 600, letterSpacing: '0.03em' }}>{path.en}</div>
                                                <div style={{ fontSize: '0.75rem', color: 'var(--color-text-secondary)', marginTop: '0.2rem' }}>{path.desc}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'drill-difficulty' && (
                        <DifficultyScreen
                            zone={zone}
                            drillId={drill}
                            onSelectDifficulty={(diff) => {
                                setDifficulty(diff);
                                setScreen('drill-execution');
                            }}
                            onBack={() => setScreen('drill-category')}
                        />
                    )}

                    {screen === 'drill-execution' && (
                        <DrillExecutionScreen
                            zone={zone}
                            drillId={drill}
                            difficulty={difficulty}
                            onComplete={() => setScreen('drill-category')}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'free-grip' && (
                        <FreeGripGuideScreen
                            onComplete={() => setScreen('free-calibration')}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'free-calibration' && (
                        <FreeCalibrationScreen
                            onComplete={() => setScreen('free-execution')}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'free-execution' && (
                        <FreeExecutionScreen
                            onComplete={() => setScreen('home')}
                            onBack={goHome}
                        />
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
