<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Golflev v10.0 - Golf Swing Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-main: #F8F5EF;
            --color-bg-card: #FFFFFF;
            --color-bg-secondary: #F0EDE7;
            --color-primary: #2D3B2D;
            --color-accent: #2D3B2D;
            --color-accent-light: #4A6B4A;
            --color-gold: #C8956C;
            --color-gold-light: #D4A97A;
            --color-text: #2D3B2D;
            --color-text-secondary: #8A8A82;
            --color-accent-text: #C8956C;
            --color-success: #4A6B4A;
            --color-warning: #D4A040;
            --color-error: #C45B4A;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', 'Noto Serif JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFFDF9 0%, #F8F5EF 100%);
            color: var(--color-text);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-top: env(safe-area-inset-top, 0);
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        /* TYPOGRAPHY */
        h1 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--color-text);
        }

        h2 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--color-text);
            margin: 1rem 0;
        }

        h3 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--color-text);
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: var(--color-gold);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .text-sm {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .text-tiny {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Noto Serif JP', 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--color-primary);
            color: #F8F5EF;
            box-shadow: 0 6px 24px rgba(45, 59, 45, 0.25);
            letter-spacing: 0.08em;
        }

        .btn-primary:active {
            box-shadow: 0 8px 32px rgba(45, 59, 45, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-primary);
        }

        .btn-secondary:active {
            background: rgba(45, 59, 45, 0.06);
        }

        .btn-success {
            background: var(--color-success);
            color: #F8F5EF;
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-secondary);
            border: none;
        }

        .btn-sm {
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: 1.25rem 2rem;
            font-size: 1.125rem;
            height: 56px;
        }

        .btn-block {
            display: flex;
            width: 100%;
        }

        /* CARDS */
        .card {
            background: var(--color-bg-card);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-gold), var(--color-primary));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-clickable {
            cursor: pointer;
            user-select: none;
        }

        /* LAYOUT */
        .header {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: transparent;
        }

        .content {
            flex: 1;
            padding: 0 1.5rem 1.5rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .footer {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1rem;
            background: white;
            border-top: 1px solid var(--color-bg-secondary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall .card {
            min-height: 200px;
        }

        .stack-v {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stack-h {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            align-items: center;
        }

        /* LOGO */
        .logo {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(200, 149, 108, 0.15);
            color: var(--color-gold);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        /* TODAY'S STATS */
        .stats-card {
            background: linear-gradient(135deg, var(--color-primary) 0%, #3A4D3A 100%);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
            color: white;
            margin-top: 0.75rem;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .stats-header-title {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }

        .stats-header-link {
            font-size: 0.75rem;
            color: var(--color-gold-light);
            cursor: pointer;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            text-align: center;
        }

        .stat-item-value {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .stat-item-unit {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            vertical-align: super;
            margin-left: 2px;
        }

        .stat-item-label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.25rem;
        }

        /* WEEKLY PROGRESS */
        .weekly-card {
            background: var(--color-bg-card);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-top: 0.75rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .weekly-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .weekly-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text);
        }

        .weekly-percent {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--color-bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-gold));
            transition: width 1s ease;
        }

        /* SENSOR STATE PHASE INDICATOR */
        .phase-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin: 0.5rem 0;
        }

        .phase-steps {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .phase-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(200,149,108,0.2);
            transition: all 0.3s;
        }

        .phase-dot.active {
            background: var(--color-gold);
            box-shadow: 0 0 8px rgba(200,149,108,0.4);
        }

        .phase-dot.done {
            background: var(--color-success);
        }

        .phase-line {
            width: 24px;
            height: 2px;
            background: rgba(200,149,108,0.2);
        }

        .phase-line.done {
            background: var(--color-success);
        }

        .phase-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text);
        }

        .phase-sublabel {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            text-align: center;
            line-height: 1.4;
        }

        /* 3D SWING COMPASS */
        .golfer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0.5rem 0;
        }

        .golfer-container {
            position: relative;
            width: 260px;
            height: 240px;
        }

        .golfer-svg {
            width: 100%;
            height: 100%;
        }

        .golfer-values {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 0.5rem;
        }

        .golfer-axis {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
        }

        .golfer-axis-num {
            font-family: 'Inter', 'Noto Serif JP', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
        }

        .golfer-axis-num.gold {
            color: var(--color-gold);
        }

        .golfer-axis-unit {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .golfer-total {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 0.5rem;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, #3A4D3A 100%);
            border-radius: 12px;
            color: white;
        }

        .golfer-total-num {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .golfer-total-label {
            font-size: 0.6rem;
            font-weight: 600;
            opacity: 0.8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @keyframes golfer-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .golfer-recording .golfer-total {
            animation: golfer-pulse 1s ease-in-out infinite;
        }

        /* CARD TITLE AREA */
        .card-title-area {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-icon {
            font-size: 2.5rem;
        }

        .card-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(200, 149, 108, 0.12);
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.5;
                box-shadow: 0 0 20px rgba(200, 149, 108, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 40px rgba(200, 149, 108, 0.5);
            }
        }

        @keyframes confetti {
            0% {
                transform: translate(var(--tx), var(--ty)) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(calc(var(--tx) + 100px), calc(var(--ty) + 100px)) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drill-card {
            animation: slideInLeft 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* GAUGE/CIRCLE */
        .metric-circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFFFFF, var(--color-bg-secondary));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2rem auto;
            border: 2px solid var(--color-gold);
            position: relative;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(200, 149, 108, 0.15);
        }

        .metric-circle.success {
            border-color: var(--color-success);
            animation: successPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1), pulseGlow 2s infinite;
        }

        .metric-circle.fail {
            border-color: var(--color-error);
        }

        .metric-circle.waiting {
            animation: pulseGlow 1.5s infinite;
        }

        .metric-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 4rem;
            color: var(--color-primary);
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .metric-circle.success .metric-value {
            color: var(--color-success);
        }

        .metric-circle.fail .metric-value {
            color: var(--color-error);
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .metric-unit {
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        /* STATE INDICATORS */
        .state-badge {
            padding: 0.75rem 1.25rem;
            border-radius: 20px;
            font-weight: 600;
            text-align: center;
            margin: 1rem 0;
            letter-spacing: 0.02em;
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
        }

        .state-ready {
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
        }

        .state-recording {
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
            animation: pulse 1s infinite;
        }

        .state-waiting {
            background: rgba(138, 138, 130, 0.08);
            color: var(--color-text-secondary);
        }

        /* BACK BUTTON */
        .back-btn {
            padding: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: white;
            color: var(--color-primary);
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* DIFFICULTY CARD */
        .difficulty-card {
            padding: 1.25rem;
            border: 1.5px solid var(--color-bg-secondary);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .difficulty-card:active {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
        }

        .difficulty-card.selected {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
            box-shadow: 0 4px 16px rgba(200, 149, 108, 0.2);
        }

        .difficulty-name {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .difficulty-spec {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* SUCCESS/FAIL MESSAGE */
        .result-message {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin: 1.5rem 0;
            letter-spacing: 0.02em;
            animation: countUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-success {
            color: var(--color-success);
        }

        .result-fail {
            color: var(--color-error);
        }

        .result-tip {
            padding: 1rem;
            background: rgba(200, 149, 108, 0.08);
            border-radius: 12px;
            color: var(--color-text);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 1rem 0;
            border-left: 3px solid var(--color-gold);
        }

        /* METRIC EXPLANATION */
        .metric-explanation {
            padding: 1rem;
            background: white;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--color-text-secondary);
            margin: 1rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* COUNTER */
        .success-counter {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* RANGE INFO */
        .range-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .range-box {
            padding: 1rem;
            background: white;
            border-radius: 12px;
            text-align: center;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .range-label {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .range-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-gold);
        }

        .range-value.success {
            color: var(--color-success);
        }

        .range-value.danger {
            color: var(--color-error);
        }

        /* EXPANDABLE SECTION */
        .expandable-section {
            margin: 1rem 0;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .expandable-header {
            padding: 1rem;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            color: var(--color-text);
        }

        .expandable-header:active {
            background: rgba(200, 149, 108, 0.05);
        }

        .expandable-icon {
            display: inline-block;
            transition: transform 0.3s;
            font-size: 1.25rem;
            color: var(--color-gold);
        }

        .expandable-icon.open {
            transform: rotate(180deg);
        }

        .expandable-content {
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-bg-secondary);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .expandable-content a, .expandable-content .metric-note {
            color: var(--color-gold);
        }

        /* CALIBRATION STEP */
        .calibration-step {
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            text-align: center;
            margin: 1.5rem 0;
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .step-number {
            display: inline-flex;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent-light));
            color: #F8F5EF;
            font-weight: 700;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .step-title {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .step-desc {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        /* GRIP GUIDE */
        .grip-guide {
            padding: 1.5rem;
            background: rgba(200, 149, 108, 0.06);
            border-radius: 12px;
            border: 2px solid var(--color-gold);
            text-align: center;
            margin: 1.5rem 0;
        }

        .grip-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .grip-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 1rem;
            color: var(--color-text);
            line-height: 1.6;
        }

        /* HOME CARD SECTION */
        .mode-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .mode-card-icon {
            font-size: 2.5rem;
        }

        .mode-card-title {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .mode-card-desc {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* CONFETTI PARTICLE */
        .confetti-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        /* SAFE AREA */
        @supports (padding: max(0px)) {
            .container {
                padding-left: max(1.5rem, env(safe-area-inset-left));
                padding-right: max(1.5rem, env(safe-area-inset-right));
            }

            .header, .content, .footer {
                padding-left: max(1.5rem, env(safe-area-inset-left));
                padding-right: max(1.5rem, env(safe-area-inset-right));
            }
        }

        /* DRILL CATEGORY GRID */
        .drill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .drill-category-title {
            grid-column: 1 / -1;
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
            letter-spacing: 0.02em;
        }

        .drill-category-title:first-child {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // iOS SENSOR PERMISSION
        const requestSensorPermission = async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') {
                        alert("センサーの許可が必要です。設定からモーションセンサーを許可してください。");
                        return false;
                    }
                } catch(e) {
                    alert("センサー許可エラー: " + e.message);
                    return false;
                }
            }
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
            }
            return true;
        };

        // AUDIO UTILS
        let _audioCtx = null;
        const getAudioCtx = () => {
            if (!_audioCtx) {
                _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        };
        const AudioUtils = {
            beep: (freq = 800, duration = 150) => {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration / 1000);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration / 1000);
                } catch (e) {}
            },
            success: () => {
                AudioUtils.beep(1000, 200);
                setTimeout(() => AudioUtils.beep(1200, 200), 150);
            },
            fail: () => { AudioUtils.beep(400, 300); },
            click: () => { AudioUtils.beep(600, 100); },
            ready: () => {
                AudioUtils.beep(660, 120);
                setTimeout(() => AudioUtils.beep(880, 150), 150);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },
            perfect: () => {
                try {
                    const ctx = getAudioCtx();
                    const t = ctx.currentTime;
                    [880, 1108, 1318].forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = f; o.type = "sine";
                        g.gain.setValueAtTime(0, t + i * 0.1);
                        g.gain.linearRampToValueAtTime(0.4, t + i * 0.1 + 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.5);
                        o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.5);
                    });
                } catch(e) {}
            }
        };

        // SENSOR UTILS v11 - 2-axis measurement, improved accuracy
        const _prevAcc = { x: 0, y: 0, z: 0 };
        const calcJerk = (ax, ay, az) => {
            const j = Math.sqrt(
                (ax - _prevAcc.x) ** 2 + (ay - _prevAcc.y) ** 2 + (az - _prevAcc.z) ** 2
            );
            _prevAcc.x = ax; _prevAcc.y = ay; _prevAcc.z = az;
            return j;
        };

        // Normalize angle delta to -180..180
        const normAngle = (d) => {
            while (d > 180) d -= 360;
            while (d < -180) d += 360;
            return d;
        };

        const SensorUtils = {
            detectStillness: (history, threshold = 2.0, duration = 600) => {
                const now = Date.now();
                const recent = history.filter(d => now - d.time < duration);
                if (recent.length < 5) return false;
                const avgJerk = recent.reduce((s, d) => s + (d.jerk || 0), 0) / recent.length;
                const avgRot = recent.reduce((s, d) => s + (d.rotMag || 0), 0) / recent.length;
                return avgJerk < threshold && avgRot < 25;
            },

            // Detect swing start: uses rotationRate magnitude (gyroscope)
            // More reliable than jerk for detecting actual rotational movement
            detectSwingStart: (history) => {
                if (history.length < 3) return false;
                const last3 = history.slice(-3);
                // Swing start: rotMag consistently > 40 deg/s for 3 samples
                // OR single strong rotMag > 80 deg/s
                const avgRot = last3.reduce((s, d) => s + d.rotMag, 0) / 3;
                const maxRot = Math.max(...last3.map(d => d.rotMag));
                return avgRot > 40 || maxRot > 80;
            },

            detectStop: (history, duration = 400) => {
                const now = Date.now();
                const recent = history.filter(d => now - d.time < duration);
                if (recent.length < 3) return false;
                return recent.every(d => d.rotMag < 15 && d.jerk < 3);
            },

            // 2-axis angle calculation from baseline
            calcAngles: (orient, baseline) => {
                if (!baseline) return { vertical: 0, horizontal: 0, combined: 0 };
                // Vertical plane: beta measures front-back tilt of the club
                const dBeta = normAngle(orient.beta - baseline.beta);
                // Horizontal plane: alpha measures rotation around vertical axis (body rotation)
                const dAlpha = normAngle(orient.alpha - baseline.alpha);
                // Combined swing arc = geometric sum of both planes
                const combined = Math.sqrt(dBeta * dBeta + dAlpha * dAlpha);
                return {
                    vertical: dBeta,
                    horizontal: dAlpha,
                    combined
                };
            },

            calculateMetrics: (allData, baseline) => {
                if (!allData || allData.length < 8) return null;
                const bl = baseline || {
                    beta: allData[0].beta,
                    gamma: allData[0].gamma,
                    alpha: allData[0].alpha
                };

                // For each data point, calc 2-axis angles
                const angles = allData.map(d => SensorUtils.calcAngles(d, bl));

                // Find top of backswing: max combined angle
                let maxCombined = 0, topIdx = 0;
                for (let i = 2; i < allData.length - 2; i++) {
                    if (angles[i].combined > maxCombined) {
                        maxCombined = angles[i].combined;
                        topIdx = i;
                    }
                }

                const verticalMax = Math.abs(angles[topIdx].vertical);
                const horizontalMax = Math.abs(angles[topIdx].horizontal);

                // Tempo: backswing time / downswing time
                const backswingTime = allData[topIdx].time - allData[0].time;
                const downswingTime = allData[allData.length - 1].time - allData[topIdx].time;
                const tempo = downswingTime > 20 ? backswingTime / downswingTime : 0;

                // Smoothness: based on jerk variance (lower variance = smoother)
                const jerks = allData.map(d => d.jerk || 0);
                const avgJerk = jerks.reduce((s, j) => s + j, 0) / jerks.length;
                const jerkVariance = jerks.reduce((s, j) => s + (j - avgJerk) ** 2, 0) / jerks.length;
                const smoothness = Math.max(0, Math.min(100,
                    Math.round(100 - Math.sqrt(jerkVariance) * 2.5)
                ));

                // VFA (Vertical Face Angle) at top of backswing
                // gamma = side-to-side tilt = face angle relative to swing plane
                // Corrected for beta tilt: project gamma onto the horizontal plane
                const dGammaTop = normAngle(allData[topIdx].gamma - bl.gamma);
                const betaRadTop = angles[topIdx].vertical * Math.PI / 180;
                // Face angle = gamma component projected onto plane perpendicular to swing direction
                const vfa = dGammaTop * Math.cos(betaRadTop);

                // Peak rotational velocity (deg/s) - indicator of swing speed
                const peakRotVel = Math.max(...allData.map(d => d.rotMag));

                return {
                    verticalAngle: Math.round(verticalMax * 10) / 10,
                    horizontalAngle: Math.round(horizontalMax * 10) / 10,
                    combinedAngle: Math.round(maxCombined * 10) / 10,
                    // Legacy compatibility
                    betaDelta: Math.round(maxCombined * 10) / 10,
                    tempo: Math.round(tempo * 10) / 10,
                    smoothness,
                    vfa: Math.round(vfa * 10) / 10,
                    peakRotVel: Math.round(peakRotVel),
                    backswingTime,
                    downswingTime,
                    topIdx,
                    dataPoints: allData.length,
                    durationMs: allData[allData.length - 1].time - allData[0].time
                };
            }
        };

        // SVG Arc path helper
        const describeArc = (cx, cy, r, startAngle, endAngle) => {
            const rad = (a) => (a - 90) * Math.PI / 180;
            const start = { x: cx + r * Math.cos(rad(endAngle)), y: cy + r * Math.sin(rad(endAngle)) };
            const end = { x: cx + r * Math.cos(rad(startAngle)), y: cy + r * Math.sin(rad(startAngle)) };
            const diff = Math.abs(endAngle - startAngle);
            const largeArc = diff > 180 ? 1 : 0;
            return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y}`;
        };

        // GOLFER STICK FIGURE ANIMATION (rear view)
        const SwingCompass = ({ beta, gamma, alpha, baseline, state }) => {
            const angles = SensorUtils.calcAngles(
                { beta: beta || 0, gamma: gamma || 0, alpha: alpha || 0 },
                baseline
            );
            const v = angles.vertical;   // backswing height (beta)
            const h = angles.horizontal; // rotation around body (alpha)
            const c = angles.combined;

            const isRecording = state === 'recording';

            // Golfer body constants (rear view, centered)
            const cx = 130; // center x of golfer body
            const headY = 50;
            const shoulderY = 75;
            const hipY = 130;
            const kneeY = 170;
            const footY = 205;
            const shoulderW = 28;

            // Arms pivot from shoulder center
            // Map sensor angles to arm+club swing angle
            // At address (0°): arms hang down → angle ~0 from vertical downward
            // Backswing: v increases → club goes up and behind → rotate clockwise (rear view)
            // h gives lateral shift
            const swingAngle = Math.max(-200, Math.min(200, -v * 1.2 + h * 0.4));
            const swingRad = swingAngle * Math.PI / 180;

            // Arm length + club length
            const armLen = 45;
            const clubLen = 55;

            // Hands position (end of arms)
            const handX = cx + armLen * Math.sin(swingRad);
            const handY = shoulderY + armLen * Math.cos(swingRad);

            // Club head position (end of club from hands)
            const clubX = handX + clubLen * Math.sin(swingRad);
            const clubY = handY + clubLen * Math.cos(swingRad);

            // Swing trail: show arc path of club head
            const trailPoints = [];
            const trailStart = 0;
            const trailEnd = swingAngle;
            const steps = Math.max(2, Math.abs(Math.round(trailEnd / 5)));
            for (let i = 0; i <= steps; i++) {
                const a = (trailStart + (trailEnd - trailStart) * i / steps) * Math.PI / 180;
                const hx = cx + armLen * Math.sin(a);
                const hy = shoulderY + armLen * Math.cos(a);
                const chx = hx + clubLen * Math.sin(a);
                const chy = hy + clubLen * Math.cos(a);
                trailPoints.push(`${i === 0 ? 'M' : 'L'} ${chx.toFixed(1)} ${chy.toFixed(1)}`);
            }
            const trailPath = trailPoints.join(' ');

            // Body slight rotation based on horizontal angle
            const bodyTilt = Math.max(-12, Math.min(12, h * 0.15));
            const headTilt = Math.max(-8, Math.min(8, h * 0.1));

            // Ground line
            const groundY = 210;

            // Color scheme
            const bodyColor = '#2D3B2D';
            const clubColor = isRecording ? '#C8956C' : '#5A7A5A';
            const trailColor = '#C8956C';
            const ghostColor = 'rgba(200,149,108,0.15)';

            return React.createElement('div', {
                className: `golfer-wrapper ${isRecording ? 'golfer-recording' : ''}`
            },
                React.createElement('div', { className: 'golfer-container' },
                    React.createElement('svg', {
                        className: 'golfer-svg',
                        viewBox: '0 0 260 230'
                    },
                        // Ground shadow
                        React.createElement('ellipse', {
                            cx: cx, cy: groundY, rx: 40, ry: 5,
                            fill: 'rgba(45,59,45,0.08)'
                        }),
                        // Ground line
                        React.createElement('line', {
                            x1: 30, y1: groundY, x2: 230, y2: groundY,
                            stroke: bodyColor, strokeWidth: 1, opacity: 0.15
                        }),
                        // Ghost address position (faint)
                        Math.abs(swingAngle) > 5 ? React.createElement('g', { opacity: 0.2 },
                            // Ghost arms
                            React.createElement('line', {
                                x1: cx, y1: shoulderY,
                                x2: cx, y2: shoulderY + armLen,
                                stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                            }),
                            // Ghost club
                            React.createElement('line', {
                                x1: cx, y1: shoulderY + armLen,
                                x2: cx, y2: shoulderY + armLen + clubLen,
                                stroke: '#8A8A82', strokeWidth: 2, strokeLinecap: 'round'
                            }),
                            // Ghost clubhead
                            React.createElement('rect', {
                                x: cx - 4, y: shoulderY + armLen + clubLen - 2,
                                width: 8, height: 6, rx: 1.5,
                                fill: '#8A8A82', opacity: 0.6
                            })
                        ) : null,
                        // Swing arc trail (gold)
                        Math.abs(swingAngle) > 3 ? React.createElement('path', {
                            d: trailPath,
                            fill: 'none',
                            stroke: trailColor,
                            strokeWidth: 2,
                            strokeDasharray: '4 3',
                            opacity: 0.5,
                            strokeLinecap: 'round'
                        }) : null,
                        // Angle arc at shoulder
                        Math.abs(swingAngle) > 5 ? React.createElement('path', {
                            d: describeArc(cx, shoulderY, 25, 180, 180 + Math.min(170, Math.max(-170, swingAngle))),
                            fill: 'none',
                            stroke: trailColor,
                            strokeWidth: 2,
                            opacity: 0.6,
                            strokeLinecap: 'round'
                        }) : null,
                        // Angle label at arc
                        Math.abs(c) > 3 ? React.createElement('text', {
                            x: cx + 32 * Math.sin(swingRad * 0.5),
                            y: shoulderY + 32 * Math.cos(swingRad * 0.5),
                            textAnchor: 'middle',
                            fill: trailColor,
                            fontSize: '11',
                            fontWeight: 700,
                            fontFamily: 'Inter, sans-serif'
                        }, `${Math.round(c)}\u00B0`) : null,
                        // === BODY (rear view) ===
                        // Head
                        React.createElement('circle', {
                            cx: cx + headTilt, cy: headY, r: 14,
                            fill: 'none', stroke: bodyColor, strokeWidth: 3
                        }),
                        // Neck
                        React.createElement('line', {
                            x1: cx + headTilt, y1: headY + 14,
                            x2: cx + bodyTilt * 0.3, y2: shoulderY,
                            stroke: bodyColor, strokeWidth: 3, strokeLinecap: 'round'
                        }),
                        // Spine (slight lean)
                        React.createElement('line', {
                            x1: cx + bodyTilt * 0.3, y1: shoulderY,
                            x2: cx + bodyTilt, y2: hipY,
                            stroke: bodyColor, strokeWidth: 3.5, strokeLinecap: 'round'
                        }),
                        // Shoulders
                        React.createElement('line', {
                            x1: cx - shoulderW + bodyTilt * 0.3, y1: shoulderY,
                            x2: cx + shoulderW + bodyTilt * 0.3, y2: shoulderY,
                            stroke: bodyColor, strokeWidth: 3, strokeLinecap: 'round'
                        }),
                        // Hips
                        React.createElement('line', {
                            x1: cx - 16 + bodyTilt, y1: hipY,
                            x2: cx + 16 + bodyTilt, y2: hipY,
                            stroke: bodyColor, strokeWidth: 3, strokeLinecap: 'round'
                        }),
                        // Left leg
                        React.createElement('line', {
                            x1: cx - 16 + bodyTilt, y1: hipY,
                            x2: cx - 14, y2: kneeY,
                            stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        React.createElement('line', {
                            x1: cx - 14, y1: kneeY,
                            x2: cx - 16, y2: footY,
                            stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        // Right leg
                        React.createElement('line', {
                            x1: cx + 16 + bodyTilt, y1: hipY,
                            x2: cx + 14, y2: kneeY,
                            stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        React.createElement('line', {
                            x1: cx + 14, y1: kneeY,
                            x2: cx + 16, y2: footY,
                            stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        // Feet
                        React.createElement('line', {
                            x1: cx - 22, y1: footY, x2: cx - 10, y2: footY,
                            stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        React.createElement('line', {
                            x1: cx + 10, y1: footY, x2: cx + 22, y2: footY,
                            stroke: bodyColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        // === ARMS + CLUB (animated) ===
                        // Arms (shoulder to hands)
                        React.createElement('line', {
                            x1: cx, y1: shoulderY,
                            x2: handX, y2: handY,
                            stroke: bodyColor, strokeWidth: 3, strokeLinecap: 'round'
                        }),
                        // Club shaft (hands to near club head)
                        React.createElement('line', {
                            x1: handX, y1: handY,
                            x2: clubX, y2: clubY,
                            stroke: clubColor, strokeWidth: 2.5, strokeLinecap: 'round'
                        }),
                        // Club head (small rectangle at end)
                        React.createElement('rect', {
                            x: clubX - 5, y: clubY - 2,
                            width: 10, height: 7, rx: 2,
                            fill: clubColor,
                            transform: `rotate(${swingAngle}, ${clubX}, ${clubY})`
                        }),
                        // Hand grip dot
                        React.createElement('circle', {
                            cx: handX, cy: handY, r: 3.5,
                            fill: bodyColor
                        }),
                        // Target line arrow (right side)
                        React.createElement('line', {
                            x1: 195, y1: groundY, x2: 240, y2: groundY,
                            stroke: '#C8956C', strokeWidth: 1.5, opacity: 0.4,
                            strokeDasharray: '4 3'
                        }),
                        React.createElement('polygon', {
                            points: `240,${groundY - 4} 248,${groundY} 240,${groundY + 4}`,
                            fill: '#C8956C', opacity: 0.4
                        }),
                        React.createElement('text', {
                            x: 244, y: groundY - 8, textAnchor: 'middle',
                            fill: '#C8956C', fontSize: '8', fontWeight: 500, opacity: 0.5,
                            fontFamily: 'Inter, sans-serif'
                        }, '\u98DB\u7403\u7DDA'),
                        // Recording indicator
                        isRecording ? React.createElement('circle', {
                            cx: 20, cy: 20, r: 5,
                            fill: '#C45B4A'
                        }) : null,
                        isRecording ? React.createElement('text', {
                            x: 30, y: 24,
                            fill: '#C45B4A', fontSize: '10', fontWeight: 600,
                            fontFamily: 'Inter, sans-serif'
                        }, 'REC') : null
                    )
                ),
                // Numeric values
                React.createElement('div', { className: 'golfer-values' },
                    React.createElement('div', { className: 'golfer-axis' },
                        React.createElement('span', { className: 'golfer-axis-num gold' },
                            `${Math.abs(Math.round(v))}\u00B0`),
                        React.createElement('span', { className: 'golfer-axis-unit' }, '\u30D0\u30C3\u30AF\u30B9\u30A4\u30F3\u30B0')
                    ),
                    React.createElement('div', { className: 'golfer-axis' },
                        React.createElement('span', { className: 'golfer-axis-num' },
                            `${Math.abs(Math.round(h))}\u00B0`),
                        React.createElement('span', { className: 'golfer-axis-unit' }, '\u56DE\u8EE2\u89D2\u5EA6')
                    )
                ),
                // Combined total
                c > 2 ? React.createElement('div', { className: 'golfer-total' },
                    React.createElement('span', { className: 'golfer-total-num' },
                        `${Math.round(c)}\u00B0`),
                    React.createElement('span', { className: 'golfer-total-label' }, '\u5408\u6210\u632F\u308A\u5E45')
                ) : null
            );
        };

        // CONFETTI EFFECT
        const Confetti = ({ count = 50 }) => {
            useEffect(() => {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'confetti-particle';
                    particle.innerHTML = ['🎉', '⭐', '✨', '🌟'][Math.floor(Math.random() * 4)];
                    particle.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                    particle.style.left = Math.random() * window.innerWidth + 'px';
                    particle.style.top = '-20px';
                    particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');

                    particle.style.animation = `confetti ${1.5 + Math.random() * 0.5}s ease-out forwards`;
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 2000);
                }
            }, [count]);
            return null;

        // COUNT UP NUMBER HOOK
        const useCountUp = (end, duration = 800) => {
            const [value, setValue] = useState(0);
            useEffect(() => {
                let startTime = Date.now();
                const tick = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    setValue(Math.floor(end * progress));
                    if (progress < 1) {
                        requestAnimationFrame(tick);
                    } else {
                        setValue(end);
                    }
                };
                tick();
            }, [end, duration]);
            return value;
        };

        // SESSION STATS (in-memory, resets each page load)

                SessionStats._accuracy = SessionStats._swings > 0

        // DRILL CATEGORY SELECTION

        // DRILL EXECUTION
        const DrillExecutionScreen = ({ zone, drillId, difficulty, onComplete, onBack }) => {
            const [state, setState] = useState('grip');
            const [metrics, setMetrics] = useState(null);
            const [orient, setOrient] = useState({ beta: 0, gamma: 0, alpha: 0 });
            const sensorHistoryRef = useRef([]);
            const orientRef = useRef({ beta: 0, gamma: 0, alpha: 0 });
            const baselineRef = useRef(null);
            const stateRef = useRef('grip');
            const recordingDataRef = useRef([]);
            const readyTimeRef = useRef(0);
            const readyStableCountRef = useRef(0);

            const drillConfig = {
                width: {
                    business: { easy: [15, 45], normal: [18, 38], hard: [20, 35] },
                    half: { easy: [35, 75], normal: [40, 65], hard: [45, 60] }
                },
                smoothness: {
                    business: { easy: 50, normal: 65, hard: 80 },
                    half: { easy: 50, normal: 65, hard: 80 }
                },
                tempo: {
                    business: { easy: [1.5, 5.0], normal: [2.0, 4.0], hard: [2.5, 3.5] },
                    half: { easy: [1.5, 5.0], normal: [2.0, 4.0], hard: [2.5, 3.5] }
                },
                face: {
                    business: { easy: 20, normal: 12, hard: 6 },
                    half: { easy: 18, normal: 10, hard: 5 }
                }
            };

            const config = drillConfig[drillId][zone][difficulty];

            // Single unified sensor effect
            useEffect(() => {
                if (stateRef.current === 'grip' || stateRef.current === 'stopped') return;

                const handleDeviceOrientation = (event) => {
                    const o = {
                        beta: event.beta || 0,
                        gamma: event.gamma || 0,
                        alpha: event.alpha || 0,
                    };
                    orientRef.current = o;
                    // Throttle React state updates to ~15fps for compass animation
                    if (!handleDeviceOrientation._last || Date.now() - handleDeviceOrientation._last > 66) {
                        handleDeviceOrientation._last = Date.now();
                        setOrient({ ...o });
                    }
                };

                const handleDeviceMotion = (event) => {
                    const rr = event.rotationRate || {};
                    const rotX = rr.beta || 0;
                    const rotY = rr.gamma || 0;
                    const rotZ = rr.alpha || 0;
                    const rotMag = Math.sqrt(rotX * rotX + rotY * rotY + rotZ * rotZ);
                    const a = event.accelerationIncludingGravity || event.acceleration || {};
                    const jerk = calcJerk(a.x || 0, a.y || 0, a.z || 0);
                    const now = Date.now();
                    const o = orientRef.current;

                    sensorHistoryRef.current.push({
                        time: now,
                        beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                        rotX, rotY, rotZ, rotMag, jerk
                    });
                    if (sensorHistoryRef.current.length > 500) sensorHistoryRef.current.shift();

                    // State machine
                    if (stateRef.current === 'waiting') {
                        if (SensorUtils.detectStillness(sensorHistoryRef.current)) {
                            baselineRef.current = { beta: o.beta, gamma: o.gamma, alpha: o.alpha };
                            stateRef.current = 'ready';
                            setState('ready');
                            readyTimeRef.current = now;
                            readyStableCountRef.current = 0;
                            AudioUtils.ready();
                        }
                    } else if (stateRef.current === 'ready') {
                        if (jerk < 2.0 && rotMag < 25) {
                            readyStableCountRef.current++;
                        } else {
                            readyStableCountRef.current = 0;
                        }
                        const readyElapsed = now - readyTimeRef.current;
                        // Use gyroscope-based swing detection (more reliable)
                        if (readyElapsed > 600 && readyStableCountRef.current > 8 &&
                            SensorUtils.detectSwingStart(sensorHistoryRef.current)) {
                            stateRef.current = 'recording';
                            setState('recording');
                            recordingDataRef.current = [];
                            AudioUtils.beep(1000, 100);
                        }
                    } else if (stateRef.current === 'recording') {
                        recordingDataRef.current.push({
                            time: now,
                            beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                            rotX, rotY, rotZ, rotMag, jerk
                        });

                        if (SensorUtils.detectStop(sensorHistoryRef.current)) {
                            stateRef.current = 'stopped';
                            setState('stopped');
                            const calcMetrics = SensorUtils.calculateMetrics(
                                recordingDataRef.current, baselineRef.current
                            );
                            setMetrics(calcMetrics);
                            if (calcMetrics) AudioUtils.success();
                            else AudioUtils.fail();
                        }

                        // Timeout after 5 seconds
                        if (recordingDataRef.current.length > 0 &&
                            now - recordingDataRef.current[0].time > 5000) {
                            stateRef.current = 'stopped';
                            setState('stopped');
                            const calcMetrics = SensorUtils.calculateMetrics(
                                recordingDataRef.current, baselineRef.current
                            );
                            setMetrics(calcMetrics);
                        }
                    }
                };

                window.addEventListener('deviceorientation', handleDeviceOrientation);
                window.addEventListener('devicemotion', handleDeviceMotion);

                return () => {
                    window.removeEventListener('deviceorientation', handleDeviceOrientation);
                    window.removeEventListener('devicemotion', handleDeviceMotion);
                };
            }, [state]);

            const handleGripConfirm = async () => {
                AudioUtils.click();
                const ok = await requestSensorPermission();
                if (!ok) return;
                sensorHistoryRef.current = [];
                recordingDataRef.current = [];
                baselineRef.current = null;
                stateRef.current = 'waiting';
                setState('waiting');
            };

            if (state === 'grip') {
                return (
                    <div className="screen">
                        <div className="header">
                            <button className="btn btn-ghost back-btn" onClick={onBack}>←</button>
                            <h2>握り方の確認</h2>
                        </div>
                        <div className="content">

                                <div className="grip-text">

                                    カメラは左を向いてください。
                                </div>
                            </div>
                            <button className="btn btn-primary btn-lg btn-block" onClick={handleGripConfirm}>
                                準備完了
                            </button>
                        </div>
                    </div>
                );
            }

            if (state === 'ready' || state === 'waiting' || state === 'recording') {
                const phaseIdx = state === 'waiting' ? 0 : state === 'ready' ? 1 : 2;

                return (
                    <div className="screen">
                        <div className="header">
                            <h2>ドリル実行中</h2>
                        </div>
                        <div className="content">
                            <div className="phase-indicator">
                                <div className="phase-steps">
                                    <div className={`phase-dot ${phaseIdx === 0 ? 'active' : phaseIdx > 0 ? 'done' : ''}`}></div>
                                    <div className={`phase-line ${phaseIdx > 0 ? 'done' : ''}`}></div>
                                    <div className={`phase-dot ${phaseIdx === 1 ? 'active' : phaseIdx > 1 ? 'done' : ''}`}></div>
                                    <div className={`phase-line ${phaseIdx > 1 ? 'done' : ''}`}></div>
                                    <div className={`phase-dot ${phaseIdx === 2 ? 'active' : ''}`}></div>
                                </div>
                                <div className="phase-label">
                                    {state === 'waiting' && '① 静止してください'}
                                    {state === 'ready' && '② アドレスOK → スイング！'}
                                    {state === 'recording' && '③ 計測中...'}
                                </div>
                                <div className="phase-sublabel">
                                    {state === 'waiting' && 'スマホを持って構え、動きを止めてください'}
                                    {state === 'ready' && '安定を確認しました。準備ができたらスイングしてください'}
                                    {state === 'recording' && 'スイングを記録しています。フィニッシュで止まってください'}
                                </div>
                            </div>
                            <SwingCompass
                                beta={orient.beta}
                                gamma={orient.gamma}
                                alpha={orient.alpha}
                                baseline={baselineRef.current}
                                state={state}
                            />
                        </div>
                    </div>
                );
            }

            if (state === 'stopped' && metrics) {
                let success = false;
                let value = 0;
                let target = '';
                let displayValue = 0;

                if (drillId === 'width') {
                    value = metrics.combinedAngle;
                    displayValue = Math.round(value);
                    if (Array.isArray(config)) {
                        success = value >= config[0] && value <= config[1];
                        target = `${config[0]}° 〜 ${config[1]}°`;
                    }
                } else if (drillId === 'smoothness') {
                    value = metrics.smoothness;
                    displayValue = Math.round(value);
                    success = value >= config;
                    target = `${config}% 以上`;
                } else if (drillId === 'tempo') {
                    value = metrics.tempo;
                    displayValue = Math.round(value * 100) / 100;
                    if (Array.isArray(config)) {
                        success = value >= config[0] && value <= config[1];
                        target = `${config[0].toFixed(1)}:1 〜 ${config[1].toFixed(1)}:1`;
                    }
                } else if (drillId === 'face') {
                    value = Math.abs(metrics.vfa);
                    displayValue = Math.round(value * 10) / 10;
                    success = value <= config;
                    target = `±${config}°`;
                }

                const countUpValue = useCountUp(displayValue, 800);

                // Record swing to session stats (only once per result render)
                useEffect(() => { SessionStats.addSwing(success); }, []);

                return (
                    <div className="screen">
                        {success && <Confetti count={30} />}
                        <div className="header">
                            <h2>{success ? '完成！' : 'あと少し'}</h2>
                        </div>
                        <div className="content">
                            <div className={`metric-circle ${success ? 'success' : 'fail'}`}>
                                <div className="metric-value">
                                    {drillId === 'tempo' ? countUpValue.toFixed(2) : countUpValue}
                                </div>
                                <div className="metric-label">
                                    {drillId === 'width' && '°'}
                                    {drillId === 'smoothness' && '%'}
                                    {drillId === 'tempo' && ':1'}
                                    {drillId === 'face' && '°'}

                            </div>

                            <div className="range-info">
                                <div className="range-box">
                                    <div className="range-label">目標値</div>
                                    <div className="range-value">{target}</div>
                                </div>
                                <div className="range-box">
                                    <div className="range-label">あなたの値</div>
                                    <div className={`range-value ${success ? 'success' : 'danger'}`}>
                                        {drillId === 'tempo' ? value.toFixed(2) : value.toFixed(1)}
                                    </div>
                                </div>
                            </div>

                            <div className="result-tip">
                                {drillId === 'width' && '適切な振り幅を保つことで、安定したスイングが実現します。'}
                                {drillId === 'smoothness' && 'より滑らかな動きを意識して、緊張を取り除きましょう。'}
                                {drillId === 'tempo' && 'テンポが一定することで、リズム感のあるスイングになります。'}
                                {drillId === 'face' && 'フェース角を安定させることが、方向性の鍵になります。'}
                            </div>

                            {success && <div className="success-counter">✓ 成功回数: 1</div>}

                            <div style={{ marginTop: '2rem' }} className="stack-v">
                                <button className="btn btn-primary btn-lg btn-block" onClick={() => {
                                    AudioUtils.click();
                                    setState('grip');
                                    setMetrics(null);
                                    sensorHistoryRef.current = [];

                                <button className="btn btn-secondary btn-lg btn-block" onClick={onBack}>

            return null;
