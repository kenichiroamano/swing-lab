// ===================================================
// テイクバック理想軌道（PGAハンドパス: 外→内のループ）
// cal = { endGamma, endBeta }
//
// PGA根拠:
//   P2（t≈0.3-0.5）で手は体のやや外側に幅を保つ
//   → ワンピーステイクバックで外側に弧を描く
//   P3（t≈0.7-1.0）で手は胸骨〜右胸の間＝内側へ入る
//   → 良いプレーヤーは「逆ループ」で上げる
//
// 数式: beta = peakOut * sin(πt) + endBeta * t
//   peakOut * sin(πt) → 外側への弧（P2付近で最大）
//   endBeta * t → 線形にインサイドへ引き込む
//   ネット外側ピーク位置 ≈ t=0.25（peakOut=0.45|endBeta|の場合）
// ===================================================
const makeIdealPathTakeaway = (cal) => {
  // 0.45: P2で明確な外側膨らみを生む係数（PGA P2のワイド維持に対応）
  const peakOut = Math.abs(cal.endBeta) * 0.45;
  return (gamma) => {
    if (gamma <= 0) return {beta:0,alpha:0};
    if (gamma >= cal.endGamma) return {beta:cal.endBeta,alpha:-15};
    const t = gamma / cal.endGamma;
    // PGA: 外に幅を保ちつつ（sin項）→ 内に引き込む（endBeta*t項）
    const beta = peakOut * Math.sin(Math.PI * t) + cal.endBeta * t;
    // コッキング: P3で40-70°到達（アプリでは-15°で正規化表現）
    const alpha = -15 * Math.sin(t * Math.PI / 2);
    return {beta,alpha};
  };
};

// ===================================================
// フォロースルー理想軌道（PGAハンドパス: 外→内の弧）
// calF = { endGamma, endBeta }  ← フォロー側の可動域（endBeta負=インサイド）
//
// PGA根拠:
//   P7（Impact）: ハンドファーストで体の正面にインパクト
//   インパクト直後: クラブはターゲットライン方向に延びる（わずかに外側）
//   P8（t≈0.3-0.5）: 体の回転が手をインサイドに引き始める
//     → 肩回転45-50°、手は体に接続されたまま回る
//   P9（t≈0.7-1.0）: 手は胸郭中央から出る＝インサイド位置
//     → 良いスイングでは手はアウトサイドに飛び出さない
//
// 数式: beta = peakOut * sin(πt) + endBeta * t
//   （テイクバックと同じ構造: 外→内の弧）
//   peakOut * sin(πt) → インパクト延長の外側への弧
//   endBeta * t → 体の回転でインサイドへ引き込む
// ===================================================
const makeIdealPathFollow = (calF) => {
  // 0.35: テイクバック(0.45)より控えめ — インパクト延長は短い
  const peakOut = Math.abs(calF.endBeta) * 0.35;
  return (gamma) => {
    if (gamma <= 0) return {beta:0,alpha:0};
    if (gamma >= calF.endGamma) return {beta:calF.endBeta,alpha:15};
    const t = gamma / calF.endGamma;
    // PGA: インパクト延長で一瞬外側（sin項）→ 体の回転でインサイドへ（endBeta*t項）
    const beta = peakOut * Math.sin(Math.PI * t) + calF.endBeta * t;
    // リリース: インパクトのコック保持→フォローで解放
    const alpha = 15 * Math.sin(t * Math.PI / 2);
    return {beta,alpha};
  };
};

// テイクバック側チェックポイント実体化
const makeCheckpointsTakeaway = (cal, level) => {
  const range = Math.abs(cal.endBeta);
  const ip = makeIdealPathTakeaway(cal);
  return level.checkpointIds.map(id => {
    const base = BASE_CPS[id];
    const gamma = base.tRatio * cal.endGamma;
    const ideal = ip(gamma);
    return {
      ...base, gamma, phase:"takeaway",
      beta: ideal.beta,
      okBeta: 1.5 + range * 0.12,
      okGamma: 2 + base.tRatio * 5,
      alpha: ideal.alpha,
      okAlpha: base.tRatio === 0 ? 5 : 8 + base.tRatio * 4,
    };
  });
};

// フォロースルー側チェックポイント実体化
const makeCheckpointsFollow = (calF, level) => {
  const range = Math.abs(calF.endBeta);
  const ip = makeIdealPathFollow(calF);
  const followCpIds = level.id==="business"?["FP1","FP2"]:["FP1","FP2","FP3"];
  return followCpIds.map(id => {
    const base = FOLLOW_CPS[id];
    const gamma = base.tRatio * calF.endGamma;
    const ideal = ip(gamma);
    return {
      ...base, gamma, phase:"follow",
      beta: ideal.beta,
      okBeta: 1.8 + range * 0.12,
      okGamma: 2.5 + base.tRatio * 5,
      alpha: ideal.alpha,
      okAlpha: base.tRatio === 0 ? 5 : 8 + base.tRatio * 4,
    };
  });
};

// デフォルトキャリブレーション
// PGA根拠:
//   テイクバック: 手は体のインサイドへ入る（endBeta負）
//   フォロースルー: 体の回転が手をインサイドに引く（endBeta負）
//     → P8: 体に接続されたまま回る、P9: 手は胸郭中央から出る
//     → 良いスイングでは手はアウトサイドに飛び出さない
//   フォローのbetaはテイクバックより浅い（インパクト延長で少し外に出る分）
const DEFAULT_CALS = {
  // 時計イメージ: アドレス=6時, ビジネス=4時/8時(60°), ハーフ=3時/9時(90°)
  business: { takeaway:{endGamma:60,endBeta:-5}, follow:{endGamma:60,endBeta:-4} },
  half: { takeaway:{endGamma:90,endBeta:-12}, follow:{endGamma:90,endBeta:-9} },
};

// スイングデータ生成（テイクバック）
const genSwingTakeaway = (pattern, cal) => {
  const ip = makeIdealPathTakeaway(cal);
  const frames = [];
  for (let i=0;i<=100;i++) {
    const t=i/100, gamma=cal.endGamma*t, ideal=ip(gamma);
    let beta,alpha;
    if (pattern==="good") {
      beta=ideal.beta+Math.sin(t*4)*0.8; alpha=ideal.alpha+Math.cos(t*3)*1.2;
    } else if (pattern==="inside") {
      beta=ideal.beta-2.5*(1-Math.cos(t*Math.PI))*0.5; alpha=ideal.alpha+Math.cos(t*2)*2;
    } else {
      beta=ideal.beta+3*Math.sin(t*Math.PI*0.8); alpha=ideal.alpha-1.5*Math.sin(t*Math.PI);
    }
    frames.push({gamma,beta,alpha,t,phase:"takeaway"});
  }
  return frames;
};

// スイングデータ生成（フォロースルー）
const genSwingFollow = (pattern, calF) => {
  const ip = makeIdealPathFollow(calF);
  const frames = [];
  for (let i=0;i<=100;i++) {
    const t=i/100, gamma=calF.endGamma*t, ideal=ip(gamma);
    let beta,alpha;
    if (pattern==="good") {
      beta=ideal.beta+Math.sin(t*4)*0.6; alpha=ideal.alpha+Math.cos(t*3)*1.0;
    } else if (pattern==="inside") {
      beta=ideal.beta-2*(1-Math.cos(t*Math.PI))*0.5; alpha=ideal.alpha+Math.cos(t*2)*1.5;
    } else {
      beta=ideal.beta+2.5*Math.sin(t*Math.PI*0.8); alpha=ideal.alpha-1.2*Math.sin(t*Math.PI);
    }
    frames.push({gamma,beta,alpha,t,phase:"follow"});
  }
  return frames;
};

// スイングデータ生成（コンビネーション: テイクバック→フォロースルー）
const genSwingCombo = (pattern, calT, calF) => {
  const tFrames = genSwingTakeaway(pattern, calT);
  const fFrames = genSwingFollow(pattern, calF);
  // テイクバック → 折り返し → フォロースルー
  return [...tFrames, ...fFrames.map(f=>({...f}))];
};

// 判定
const judge = (cp,actual) => {
  const dB=actual.beta-cp.beta, dA=actual.alpha-(cp.alpha||0);
  const bOk=Math.abs(dB)<=cp.okBeta, aOk=Math.abs(dA)<=cp.okAlpha;
  const score=Math.max(0,Math.round(100-(Math.abs(dB)/cp.okBeta*40+Math.abs(dA)/cp.okAlpha*10)));
  return {ok:bOk&&aOk,betaOk:bOk,alphaOk:aOk,dBeta:dB,dAlpha:dA,score};
};

const ClockGuide = ({pose="takeaway_biz"}) => {
  const canvasRef = React.useRef(null);
  const imgBackRef = React.useRef(null);
  const imgFrontRef = React.useRef(null);
  const [ready, setReady] = React.useState(false);

  React.useEffect(() => {
    let loaded = 0;
    const check = () => { loaded++; if (loaded >= 2) setReady(true); };
    const ib = new Image(); ib.onload = check; ib.src = SIL_BACK; imgBackRef.current = ib;
    const ifr = new Image(); ifr.onload = check; ifr.src = SIL_FRONT; imgFrontRef.current = ifr;
  }, []);

  React.useEffect(() => {
    if (!ready || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const W = 240, H = 240;
    const cx = W/2, cy = H/2 + 8;
    ctx.clearRect(0, 0, W, H);

    const isFollow = pose.startsWith("follow");
    const isBiz = pose.endsWith("_biz");
    const targetDeg = isBiz ? 60 : 90;
    const zoneColor = isFollow ? "#4A6B4A" : "#C8956C";
    const zoneRgba = isFollow ? "rgba(74,107,74," : "rgba(200,149,108,";
    // armColor removed — using simple arrow indicator instead

    // 時計の円
    ctx.beginPath(); ctx.arc(cx, cy, 105, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(45,59,45,0.07)"; ctx.lineWidth = 1; ctx.stroke();

    // 目盛り
    for (let i=0;i<12;i++) {
      const a=(i*30-90)*Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(cx+99*Math.cos(a),cy+99*Math.sin(a));
      ctx.lineTo(cx+105*Math.cos(a),cy+105*Math.sin(a));
      ctx.strokeStyle=i%3===0?"rgba(45,59,45,0.18)":"rgba(45,59,45,0.08)";
      ctx.lineWidth=i%3===0?1.5:1; ctx.stroke();
    }

    // 数字
    const nums=isBiz?[[4,4],[6,6],[8,8]]:[[3,3],[6,6],[9,9]];
    nums.forEach(([n,hour])=>{
      const a=(hour*30-90)*Math.PI/180;
      const nx=cx+116*Math.cos(a),ny=cy+116*Math.sin(a);
      const isTarget=(isFollow&&((isBiz&&hour===8)||(!isBiz&&hour===9)))||(!isFollow&&((isBiz&&hour===4)||(!isBiz&&hour===3)));
      if(isTarget){ctx.beginPath();ctx.arc(nx,ny,12,0,Math.PI*2);ctx.fillStyle=zoneColor;ctx.fill();ctx.font="700 13px 'Playfair Display',serif";ctx.fillStyle="#fff";}
      else{ctx.font="600 12px 'Playfair Display',serif";ctx.fillStyle=hour===6?"rgba(45,59,45,0.7)":"rgba(138,138,130,0.7)";}
      ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(n),nx,ny);
    });

    // ゾーン弧
    let startDeg,endDeg;
    if(!isFollow){startDeg=isBiz?(4*30-90):(3*30-90);endDeg=90;}
    else{startDeg=90;endDeg=isBiz?(8*30-90):(9*30-90);}
    const startRad=startDeg*Math.PI/180,endRad=endDeg*Math.PI/180;

    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,90,startRad,endRad);ctx.closePath();
    ctx.fillStyle=zoneRgba+"0.06)";ctx.fill();

    ctx.beginPath();ctx.arc(cx,cy,90,startRad,endRad);
    ctx.strokeStyle=zoneColor;ctx.lineWidth=3;ctx.lineCap="round";ctx.globalAlpha=0.5;ctx.stroke();ctx.globalAlpha=1;

    ctx.setLineDash([4,4]);
    [startRad,endRad].forEach(a=>{ctx.beginPath();ctx.moveTo(cx+22*Math.cos(a),cy+22*Math.sin(a));ctx.lineTo(cx+90*Math.cos(a),cy+90*Math.sin(a));ctx.strokeStyle=zoneRgba+"0.2)";ctx.lineWidth=1;ctx.stroke();});
    ctx.setLineDash([]);

    ctx.beginPath();ctx.arc(cx,cy+90,2.5,0,Math.PI*2);ctx.fillStyle="rgba(45,59,45,0.25)";ctx.fill();

    const tRad=isFollow?endRad:startRad;
    const tx=cx+76*Math.cos(tRad),ty=cy+76*Math.sin(tRad);
    ctx.beginPath();ctx.arc(tx,ty,4.5,0,Math.PI*2);ctx.fillStyle=zoneColor;ctx.fill();
    ctx.beginPath();ctx.arc(tx,ty,8,0,Math.PI*2);ctx.strokeStyle=zoneRgba+"0.3)";ctx.lineWidth=1.2;ctx.stroke();

    // シルエット
    const img=isFollow?imgFrontRef.current:imgBackRef.current;
    if(img){
      const gH=125,gW=gH*(img.width/img.height);
      const gx=cx-gW/2+(isFollow?-2:2),gy=cy-gH/2+14;
      ctx.globalAlpha=0.82;ctx.drawImage(img,gx,gy,gW,gH);ctx.globalAlpha=1;

      // ターゲット方向の矢印インジケータ（シンプル）
      const arrowRad=tRad;
      const arrowR1=50,arrowR2=72;
      const ax1=cx+arrowR1*Math.cos(arrowRad),ay1=cy+arrowR1*Math.sin(arrowRad);
      const ax2=cx+arrowR2*Math.cos(arrowRad),ay2=cy+arrowR2*Math.sin(arrowRad);
      ctx.beginPath();ctx.moveTo(ax1,ay1);ctx.lineTo(ax2,ay2);
      ctx.strokeStyle=zoneColor;ctx.lineWidth=2.5;ctx.lineCap="round";ctx.globalAlpha=0.5;ctx.stroke();ctx.globalAlpha=1;
      // 矢じり
      const aHead=8,aAng=0.45;
      ctx.beginPath();
      ctx.moveTo(ax2-aHead*Math.cos(arrowRad-aAng),ay2-aHead*Math.sin(arrowRad-aAng));
      ctx.lineTo(ax2,ay2);
      ctx.lineTo(ax2-aHead*Math.cos(arrowRad+aAng),ay2-aHead*Math.sin(arrowRad+aAng));
      ctx.strokeStyle=zoneColor;ctx.lineWidth=2.2;ctx.lineCap="round";ctx.globalAlpha=0.5;ctx.stroke();ctx.globalAlpha=1;
    }

    ctx.font="500 10px 'Inter','Noto Serif JP',sans-serif";ctx.fillStyle=zoneColor;
    ctx.textAlign=isFollow?"right":"left";ctx.textBaseline="middle";
    ctx.fillText("ここまで",tx+(isFollow?-10:10),ty);
    ctx.font="700 14px 'Inter',sans-serif";ctx.fillStyle="rgba(45,59,45,0.8)";ctx.textAlign="center";
    ctx.fillText(targetDeg+"°",cx,H-14);
  }, [pose, ready]);

  const isFollow=pose.startsWith("follow");
  const isBiz=pose.endsWith("_biz");
  const targetHour=isFollow?(isBiz?8:9):(isBiz?4:3);
  const col=isFollow?"#4A6B4A":C.gold;

  return (
    <div style={{textAlign:"center",marginBottom:8}}>
      <canvas ref={canvasRef} width={240} height={240} style={{display:"block",margin:"0 auto",borderRadius:12}}/>
      <div style={{fontSize:11,color:col,fontWeight:600,letterSpacing:".02em",marginTop:2}}>
        {targetHour}時の位置まで
      </div>
    </div>
  );
};

// ===================================================
// ハンドパスSVG（テイクバック or フォロースルー単独）
// ===================================================
const HandPathView = ({frames,curFrame,results,cps,idealPath,cal,showGuide=true,compact=false,
  phaseColor=C.gold,phaseLabel="HAND PATH",reversed=false}) => {
  const W=360, H=compact?190:230;
  const m={top:compact?28:36,right:20,bottom:compact?22:28,left:36};
  const pW=W-m.left-m.right, pH=H-m.top-m.bottom;
  const maxG=cal.endGamma*1.08;
  const bAbs = Math.max(Math.abs(cal.endBeta),2);
  const bMin=-bAbs*1.3, bRange=bAbs*2.6;

  // reversed: フォロースルー用 — ドットが右→左に移動
  const tx=g=> reversed
    ? m.left+pW-(g/maxG)*pW
    : m.left+(g/maxG)*pW;
  const ty=b=>m.top+pH-((b-bMin)/bRange)*pH;

  // 理想パス
  const iPts=[];
  for(let g=0;g<=cal.endGamma;g+=1){const p=idealPath(g);iPts.push({x:tx(g),y:ty(p.beta)})}
  const iD=iPts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // OKゾーン帯
  const bT=[],bB=[];
  for(let g=0;g<=cal.endGamma;g+=1){
    const p=idealPath(g), tol=1.5+(g/cal.endGamma)*2;
    bT.push({x:tx(g),y:ty(p.beta+tol)});bB.push({x:tx(g),y:ty(p.beta-tol)});
  }
  const bandD=bT.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')
    +[...bB].reverse().map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+'Z';

  // 実際軌跡
  const aPts=frames.slice(0,curFrame+1).map(f=>({x:tx(f.gamma),y:ty(f.beta)}));
  const aD=aPts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const cur=curFrame>=0&&curFrame<frames.length?frames[curFrame]:null;

  const gSteps=[0,...cps.filter(c=>c.tRatio>0).map(c=>Math.round(c.gamma))];

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:380,display:"block"}}>
      <rect x={m.left} y={m.top} width={pW} height={pH} fill={C.white} rx={8} stroke="#E8E5DF" strokeWidth={1}/>

      {gSteps.map(g=><g key={`x${g}`}>
        <line x1={tx(g)} y1={m.top} x2={tx(g)} y2={m.top+pH} stroke={C.textMuted} strokeWidth={.5} opacity={.25}/>
        <text x={tx(g)} y={m.top+pH+13} fill={C.textMuted} fontSize={8} textAnchor="middle">{g}°</text>
      </g>)}

      {!compact&&<>
        <text x={m.left+pW/2} y={m.top+pH+24} fill={C.textMuted} fontSize={8} textAnchor="middle">
          {reversed?"← スイング角度":"スイング角度 →"}</text>
        <text x={12} y={m.top+pH/2} fill={C.textMuted} fontSize={7} textAnchor="middle"
          transform={`rotate(-90,12,${m.top+pH/2})`}>inside ← → outside</text>
      </>}

      <text x={W/2} y={compact?13:17} fill={phaseColor} fontSize={compact?11:12} fontWeight={700}
        textAnchor="middle" fontFamily="'Playfair Display',serif" letterSpacing=".05em">{phaseLabel}</text>

      {showGuide&&<>
        <path d={bandD} fill={C.guidePath}/>
        <path d={iD} fill="none" stroke={C.guideStroke} strokeWidth={2} strokeDasharray="5,4"/>
        <text x={tx(cal.endGamma*.45)+2} y={ty(idealPath(cal.endGamma*.45).beta)-9}
          fill="rgba(200,149,108,0.35)" fontSize={8}>お手本</text>

        {cps.filter(c=>c.tRatio>0).map(cp=>{
          const cx=tx(cp.gamma),cy=ty(cp.beta);
          const r=results[cp.id],passed=r!==undefined,ok=r?.ok;
          return <g key={cp.id}>
            <ellipse cx={cx} cy={cy} rx={cp.okGamma/maxG*pW} ry={cp.okBeta/bRange*pH}
              fill={passed?(ok?"rgba(92,175,92,.1)":"rgba(199,91,91,.1)"):"rgba(200,149,108,.06)"}
              stroke={passed?(ok?"rgba(92,175,92,.35)":"rgba(199,91,91,.35)"):"rgba(200,149,108,.15)"}
              strokeWidth={1} strokeDasharray={passed?"0":"4,3"}/>
            <circle cx={cx} cy={cy} r={passed?5:3} fill={passed?(ok?C.greenBright:C.red):C.goldDim}/>
            <text x={cx} y={cy-(compact?9:13)} fill={passed?(ok?C.greenBright:C.red):C.textMuted}
              fontSize={10} fontWeight={700} textAnchor="middle">{cp.id}</text>
            {!compact&&<text x={cx} y={cy-3} fill={C.textMuted} fontSize={6} textAnchor="middle">{cp.label}</text>}
            {passed&&<g style={{animation:"checkIn .4s ease"}}>
              <rect x={cx-14} y={cy+8} width={28} height={14} rx={7}
                fill={ok?"rgba(92,175,92,.25)":"rgba(199,91,91,.25)"}/>
              <text x={cx} y={cy+18} fill={ok?C.greenBright:C.red}
                fontSize={9} fontWeight={700} textAnchor="middle">{ok?"OK":"NG"}</text>
            </g>}
          </g>;
        })}
      </>}

      {aPts.length>1&&<path d={aD} fill="none" stroke={C.cream} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>}
      {cur&&<g>
        <circle cx={tx(cur.gamma)} cy={ty(cur.beta)} r={7} fill={phaseColor} opacity={.3} style={{animation:"pulse 1.5s infinite"}}/>
        <circle cx={tx(cur.gamma)} cy={ty(cur.beta)} r={4} fill={phaseColor}/>
      </g>}
    </svg>
  );
};

// ===================================================
// コンビネーション用ハンドパスSVG（テイクバック+フォロースルー重ね表示）
// ===================================================
const ComboHandPathView = ({tFrames,fFrames,tCurFrame,fCurFrame,tResults,fResults,
  tCps,fCps,tIdealPath,fIdealPath,calT,calF,phase,compact=false}) => {
  const W=360, H=compact?210:260;
  const m={top:compact?28:36,right:20,bottom:compact?22:28,left:36};
  const pW=W-m.left-m.right, pH=H-m.top-m.bottom;
  const maxG=Math.max(calT.endGamma,calF.endGamma)*1.08;
  const bMax=Math.max(Math.abs(calT.endBeta),Math.abs(calF.endBeta),2);
  const bMin=-bMax*1.4, bRange=bMax*2.8;

  // テイクバック: 左→右, フォロースルー: 右→左（反転）
  const txT=g=>m.left+(g/maxG)*pW;
  const txF=g=>m.left+pW-(g/maxG)*pW; // X軸反転
  const ty=b=>m.top+pH-((b-bMin)/bRange)*pH;

  // テイクバック理想パス（左→右）
  const tPts=[];
  for(let g=0;g<=calT.endGamma;g+=1){const p=tIdealPath(g);tPts.push({x:txT(g),y:ty(p.beta)})}
  const tD=tPts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // フォロースルー理想パス（右→左、反転）
  const fPts=[];
  for(let g=0;g<=calF.endGamma;g+=1){const p=fIdealPath(g);fPts.push({x:txF(g),y:ty(p.beta)})}
  const fD=fPts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // 実軌跡（テイクバック、左→右）
  const tActPts = tFrames.slice(0,(tCurFrame>=0?tCurFrame+1:0)).map(f=>({x:txT(f.gamma),y:ty(f.beta)}));
  const tActD = tActPts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // 実軌跡（フォロースルー、右→左）
  const fActPts = fFrames.slice(0,(fCurFrame>=0?fCurFrame+1:0)).map(f=>({x:txF(f.gamma),y:ty(f.beta)}));
  const fActD = fActPts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  const tCur = tCurFrame>=0&&tCurFrame<tFrames.length?tFrames[tCurFrame]:null;
  const fCur = fCurFrame>=0&&fCurFrame<fFrames.length?fFrames[fCurFrame]:null;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:380,display:"block"}}>
      <rect x={m.left} y={m.top} width={pW} height={pH} fill={C.bgLight} rx={8}/>

      <text x={W/2} y={compact?13:17} fill={C.cream} fontSize={compact?11:12} fontWeight={700}
        textAnchor="middle" fontFamily="'Playfair Display',serif" letterSpacing=".05em">COMBINATION</text>

      {!compact&&<>
        <text x={m.left+pW*0.75} y={m.top+pH+24} fill={C.gold} fontSize={7} textAnchor="middle">テイクバック →</text>
        <text x={m.left+pW*0.25} y={m.top+pH+24} fill={C.greenBright} fontSize={7} textAnchor="middle">← フォロースルー</text>
        <text x={12} y={m.top+pH/2} fill={C.textMuted} fontSize={7} textAnchor="middle"
          transform={`rotate(-90,12,${m.top+pH/2})`}>inside ← → outside</text>
      </>}

      {/* テイクバック理想パス */}
      <path d={tD} fill="none" stroke={C.guideStroke} strokeWidth={1.5} strokeDasharray="5,4" opacity={.6}/>
      {/* フォロースルー理想パス */}
      <path d={fD} fill="none" stroke={C.followStroke} strokeWidth={1.5} strokeDasharray="5,4" opacity={.6}/>

      {/* ラベル */}
      {tPts.length>20&&<text x={tPts[Math.floor(tPts.length*0.4)].x+3}
        y={tPts[Math.floor(tPts.length*0.4)].y-8}
        fill="rgba(200,149,108,0.4)" fontSize={7}>テイクバック</text>}
      {fPts.length>20&&<text x={fPts[Math.floor(fPts.length*0.4)].x+3}
        y={fPts[Math.floor(fPts.length*0.4)].y+14}
        fill="rgba(92,175,92,0.4)" fontSize={7}>フォロースルー</text>}

      {/* チェックポイント（テイクバック、左→右） */}
      {tCps.filter(c=>c.tRatio>0).map(cp=>{
        const cx=txT(cp.gamma),cy=ty(cp.beta);
        const r=tResults[cp.id],passed=r!==undefined,ok=r?.ok;
        return <g key={cp.id}>
          <circle cx={cx} cy={cy} r={passed?5:3} fill={passed?(ok?C.greenBright:C.red):C.goldDim}/>
          <text x={cx} y={cy-8} fill={passed?(ok?C.greenBright:C.red):C.textMuted}
            fontSize={9} fontWeight={700} textAnchor="middle">{cp.id}</text>
          {passed&&<text x={cx} y={cy+14} fill={ok?C.greenBright:C.red}
            fontSize={8} fontWeight={700} textAnchor="middle">{ok?"OK":"NG"}</text>}
        </g>;
      })}

      {/* チェックポイント（フォロースルー、右→左） */}
      {fCps.filter(c=>c.tRatio>0).map(cp=>{
        const cx=txF(cp.gamma),cy=ty(cp.beta);
        const r=fResults[cp.id],passed=r!==undefined,ok=r?.ok;
        return <g key={cp.id}>
          <circle cx={cx} cy={cy} r={passed?5:3} fill={passed?(ok?C.greenBright:C.red):"rgba(92,175,92,.3)"}/>
          <text x={cx} y={cy-8} fill={passed?(ok?C.greenBright:C.red):"rgba(92,175,92,.5)"}
            fontSize={9} fontWeight={700} textAnchor="middle">{cp.id}</text>
          {passed&&<text x={cx} y={cy+14} fill={ok?C.greenBright:C.red}
            fontSize={8} fontWeight={700} textAnchor="middle">{ok?"OK":"NG"}</text>}
        </g>;
      })}

      {/* テイクバック実軌跡 */}
      {tActPts.length>1&&<path d={tActD} fill="none" stroke={C.cream} strokeWidth={2.5} strokeLinecap="round" opacity={phase==="follow"?.4:1}/>}
      {/* フォロースルー実軌跡 */}
      {fActPts.length>1&&<path d={fActD} fill="none" stroke={C.greenBright} strokeWidth={2.5} strokeLinecap="round"/>}

      {/* カーソル */}
      {phase==="takeaway"&&tCur&&<g>
        <circle cx={txT(tCur.gamma)} cy={ty(tCur.beta)} r={7} fill={C.gold} opacity={.3} style={{animation:"pulse 1.5s infinite"}}/>
        <circle cx={txT(tCur.gamma)} cy={ty(tCur.beta)} r={4} fill={C.gold}/>
      </g>}
      {phase==="follow"&&fCur&&<g>
        <circle cx={txF(fCur.gamma)} cy={ty(fCur.beta)} r={7} fill={C.greenBright} opacity={.3} style={{animation:"pulse 1.5s infinite"}}/>
        <circle cx={txF(fCur.gamma)} cy={ty(fCur.beta)} r={4} fill={C.greenBright}/>
      </g>}
    </svg>
  );
};

// ===================================================
const SinglePracticeScreen = ({pattern,level,mode,cal,onResult,onBack}) => {
  const drill = DRILL_LEVELS[level];
  const pm = PRACTICE_MODES[mode];
  const isFollow = mode==="follow";
  const idealPath = isFollow ? makeIdealPathFollow(cal) : makeIdealPathTakeaway(cal);
  const cps = isFollow ? makeCheckpointsFollow(cal,drill) : makeCheckpointsTakeaway(cal,drill);
  const [frames] = useState(()=> isFollow ? genSwingFollow(pattern,cal) : genSwingTakeaway(pattern,cal));
  const [curFrame,setCurFrame] = useState(-1);
  const [results,setResults] = useState({});
  const [phase,setPhase] = useState("ready");
  const [fb,setFb] = useState(null);
  const animRef=useRef(null), checkedRef=useRef({});
  const isErr = pattern!=="good";
  const modeColor = isFollow?C.greenBright:C.gold;

  const start = useCallback(()=>{
    setPhase("swinging");setCurFrame(0);checkedRef.current={};setResults({});
    let f=0;
    const tick=()=>{
      f++;
      if(f>=frames.length){setPhase("done");return}
      setCurFrame(f);
      const d=frames[f];
      cps.filter(c=>c.tRatio>0).forEach(cp=>{
        if(!checkedRef.current[cp.id]&&Math.abs(d.gamma-cp.gamma)<2.5){
          const r=judge(cp,d);
          checkedRef.current[cp.id]=true;
          setResults(prev=>({...prev,[cp.id]:r}));
          setFb({cp:cp.id,ok:r.ok,
            tip:r.ok?"いい位置です！":r.dBeta<-1?"インサイドに入りすぎ":r.dBeta>1?"アウトサイドに出てます":"手首の角度を調整"});
          setTimeout(()=>setFb(null),2200);
        }
      });
      animRef.current=setTimeout(tick,42);
    };
    animRef.current=setTimeout(tick,500);
  },[frames,cps]);

  useEffect(()=>()=>clearTimeout(animRef.current),[]);
  const prog=curFrame>=0?Math.min(curFrame/frames.length,1):0;

  return (
    <div style={{minHeight:"100vh",minHeight:"100dvh",display:"flex",flexDirection:"column",background:C.bg}}>
      <Header title={isErr?"ERROR PATTERN":pm.labelEn}
        subtitle={isErr?`エラー: ${pattern==="inside"?"インサイド引きすぎ":"アウトサイドに出る"}`:`${drill.label} — ${pm.label}`}
        onBack={phase==="ready"?onBack:undefined}/>

      <div style={{padding:"0 20px",marginBottom:6}}>

// ===================================================
// コンビネーション練習画面
// ===================================================
const ComboPracticeScreen = ({pattern,level,calT,calF,onResult,onBack}) => {
  const drill = DRILL_LEVELS[level];
  const tIdealPath = makeIdealPathTakeaway(calT);
  const fIdealPath = makeIdealPathFollow(calF);
  const tCps = makeCheckpointsTakeaway(calT,drill);
  const fCps = makeCheckpointsFollow(calF,drill);
  const [tFrames] = useState(()=>genSwingTakeaway(pattern,calT));
  const [fFrames] = useState(()=>genSwingFollow(pattern,calF));
  const [tCurFrame,setTCurFrame] = useState(-1);
  const [fCurFrame,setFCurFrame] = useState(-1);
  const [tResults,setTResults] = useState({});
  const [fResults,setFResults] = useState({});
  const [comboPhase,setComboPhase] = useState("ready"); // ready|takeaway|transition|follow|done
  const [fb,setFb] = useState(null);
  const animRef=useRef(null), tCheckedRef=useRef({}), fCheckedRef=useRef({});
  const isErr = pattern!=="good";

  const start = useCallback(()=>{
    setComboPhase("takeaway");setTCurFrame(0);
    tCheckedRef.current={};fCheckedRef.current={};
    setTResults({});setFResults({});
    let f=0;
    const tickT=()=>{
      f++;
      if(f>=tFrames.length){
        // テイクバック完了 → トランジション → フォロースルー
        setComboPhase("transition");
        setFb({cp:"",ok:true,tip:"折り返し → フォロースルーへ"});
        setTimeout(()=>{
          setFb(null);
          setComboPhase("follow");setFCurFrame(0);
          let ff=0;
          const tickF=()=>{
            ff++;
            if(ff>=fFrames.length){setComboPhase("done");return}
            setFCurFrame(ff);
            const d=fFrames[ff];
            fCps.filter(c=>c.tRatio>0).forEach(cp=>{
              if(!fCheckedRef.current[cp.id]&&Math.abs(d.gamma-cp.gamma)<2.5){
                const r=judge(cp,d);
                fCheckedRef.current[cp.id]=true;
                setFResults(prev=>({...prev,[cp.id]:r}));
                setFb({cp:cp.id,ok:r.ok,
                  tip:r.ok?"いい位置です！":"軌道がずれています"});
                setTimeout(()=>setFb(null),2000);
              }
            });
            animRef.current=setTimeout(tickF,42);
          };
          animRef.current=setTimeout(tickF,200);
        },800);
        return;
      }
      setTCurFrame(f);
      const d=tFrames[f];
      tCps.filter(c=>c.tRatio>0).forEach(cp=>{
        if(!tCheckedRef.current[cp.id]&&Math.abs(d.gamma-cp.gamma)<2.5){
          const r=judge(cp,d);
          tCheckedRef.current[cp.id]=true;
          setTResults(prev=>({...prev,[cp.id]:r}));
          setFb({cp:cp.id,ok:r.ok,
            tip:r.ok?"いい位置です！":"軌道がずれています"});
          setTimeout(()=>setFb(null),2000);
        }
      });
      animRef.current=setTimeout(tickT,42);
    };
    animRef.current=setTimeout(tickT,500);
  },[tFrames,fFrames,tCps,fCps]);

  useEffect(()=>()=>clearTimeout(animRef.current),[]);

  const totalFrames = tFrames.length + fFrames.length;
  const curTotal = (tCurFrame>=0?tCurFrame+1:0) + (fCurFrame>=0?fCurFrame+1:0);
  const prog = curTotal / totalFrames;

  const phaseLabel = comboPhase==="takeaway"?"TAKEAWAY":comboPhase==="follow"?"FOLLOW THROUGH":
    comboPhase==="transition"?"TRANSITION":"COMBINATION";

  return (
    <div style={{minHeight:"100vh",minHeight:"100dvh",display:"flex",flexDirection:"column",background:C.bg}}>
      <Header title={isErr?"ERROR PATTERN":"COMBINATION"}
        subtitle={`${drill.label} — コンビネーション`}
        onBack={comboPhase==="ready"?onBack:undefined}/>

      <div style={{padding:"0 20px",marginBottom:6}}>
        <div style={{height:3,background:C.bgLight,borderRadius:2}}>
          <div style={{height:"100%",width:`${prog*100}%`,
            background:comboPhase==="follow"?C.greenBright:comboPhase==="transition"?C.yellow:C.gold,
            borderRadius:2,transition:"width .05s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
          <div style={{fontSize:9,color:comboPhase==="takeaway"?C.gold:C.textMuted,fontWeight:600}}>テイクバック</div>
          <div style={{fontSize:9,color:comboPhase==="follow"?C.greenBright:C.textMuted,fontWeight:600}}>フォロースルー</div>
        </div>
      </div>

      {/* チェックポイントバッジ */}
      <div style={{display:"flex",gap:4,padding:"0 20px",marginBottom:4,flexWrap:"wrap"}}>
        {tCps.filter(c=>c.tRatio>0).map(cp=>{
          const r=tResults[cp.id];
          return <div key={cp.id} style={{
            display:"inline-flex",alignItems:"center",gap:3,
            background:r?(r.ok?"rgba(92,175,92,.15)":"rgba(199,91,91,.15)"):C.bgLight,
            border:`1px solid ${r?(r.ok?"rgba(92,175,92,.3)":"rgba(199,91,91,.3)"):"rgba(200,149,108,.15)"}`,
            borderRadius:12,padding:"3px 8px"}}>
            <span style={{fontSize:10,fontWeight:700,color:r?(r.ok?C.greenBright:C.red):C.goldDim}}>{cp.id}</span>
            <span style={{fontSize:8,color:r?(r.ok?C.greenBright:C.red):C.textMuted}}>{r?(r.ok?"OK":"NG"):"—"}</span>
          </div>;
        })}
        <div style={{width:1,background:"rgba(45,59,45,.1)",margin:"0 2px"}}/>
        {fCps.filter(c=>c.tRatio>0).map(cp=>{
          const r=fResults[cp.id];
          return <div key={cp.id} style={{
            display:"inline-flex",alignItems:"center",gap:3,
            background:r?(r.ok?"rgba(92,175,92,.15)":"rgba(199,91,91,.15)"):C.bgLight,
            border:`1px solid ${r?(r.ok?"rgba(92,175,92,.3)":"rgba(199,91,91,.3)"):"rgba(92,175,92,.1)"}`,
            borderRadius:12,padding:"3px 8px"}}>
            <span style={{fontSize:10,fontWeight:700,color:r?(r.ok?C.greenBright:C.red):C.textMuted}}>{cp.id}</span>
            <span style={{fontSize:8,color:r?(r.ok?C.greenBright:C.red):C.textMuted}}>{r?(r.ok?"OK":"NG"):"—"}</span>
          </div>;
        })}
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 8px"}}>
        <ComboHandPathView
          tFrames={tFrames} fFrames={fFrames}
          tCurFrame={tCurFrame} fCurFrame={fCurFrame}
          tResults={tResults} fResults={fResults}
          tCps={tCps} fCps={fCps}
          tIdealPath={tIdealPath} fIdealPath={fIdealPath}
          calT={calT} calF={calF}
          phase={comboPhase==="follow"||comboPhase==="done"?"follow":"takeaway"}/>

        <div style={{height:38,display:"flex",alignItems:"center",justifyContent:"center"}}>
          {fb&&<div style={{background:fb.ok?"rgba(92,175,92,.15)":"rgba(199,91,91,.15)",
            border:`1px solid ${fb.ok?"rgba(92,175,92,.3)":"rgba(199,91,91,.3)"}`,
            borderRadius:16,padding:"5px 14px",animation:"fadeInUp .3s ease",display:"flex",alignItems:"center",gap:8}}>
            {fb.cp&&<span style={{fontWeight:700,fontSize:12,color:fb.ok?C.greenBright:C.red}}>{fb.cp}</span>}
            <span style={{fontSize:11,color:fb.ok?C.greenBright:C.red}}>{fb.tip}</span>
          </div>}
          {comboPhase==="ready"&&!fb&&<div style={{fontSize:11,color:C.textMuted}}>テイクバック → フォロースルーを通しで練習</div>}
        </div>
      </div>

      <div style={{padding:"10px 20px 34px",display:"flex",justifyContent:"center"}}>
        {comboPhase==="ready"&&<div onClick={start} style={{
          background:isErr?`linear-gradient(135deg,${C.red},#A04040)`:`linear-gradient(135deg,${C.blue},#4A7FB7)`,
          color:"#FFF",fontWeight:700,fontSize:15,padding:"13px 38px",borderRadius:28,cursor:"pointer"}}>
          {isErr?"エラーパターン再生":"コンビネーション開始"}</div>}
        {comboPhase==="done"&&<div onClick={()=>onResult({takeaway:tResults,follow:fResults},{tFrames,fFrames})} style={{
          background:`linear-gradient(135deg,${C.blue},#4A7FB7)`,color:"#FFF",
          fontWeight:700,fontSize:15,padding:"13px 38px",borderRadius:28,cursor:"pointer"}}>結果を見る</div>}
      </div>
    </div>
  );
};

// ===================================================
// App
// ===================================================
const App = () => {
  const [screen,setScreen] = useState("home");
  // cals = { business: { takeaway:{endGamma,endBeta}, follow:{endGamma,endBeta} }, half: {...} }
  const [cals,setCals] = useState({});
  const [curLevel,setCurLevel] = useState(null);
  const [curMode,setCurMode] = useState(null);
  const [pattern,setPattern] = useState("good");
  const [frames,setFrames] = useState(null);
  const [results,setResults] = useState({});
  const [calTarget,setCalTarget] = useState(null); // {level, mode}

  const handleGoTraining = () => {
    setScreen("levelSelect");
  };

  const handleSelectLevel = (lvId) => {
    setCurLevel(lvId);
    setScreen("modeSelect");
  };

  const handleSelectMode = (modeId) => {
    setCurMode(modeId);
    const calData = cals[curLevel] || {};

    if(modeId==="combo"){
      // コンボは両方必要
      if(!calData.takeaway){
        setCalTarget({level:curLevel,mode:"takeaway",next:"checkFollow"});
        setScreen("calibration");
      } else if(!calData.follow){
        setCalTarget({level:curLevel,mode:"follow",next:"pattern"});
        setScreen("calibration");
      } else {
        setScreen("pattern");
      }
    } else {
      if(!calData[modeId]){
        setCalTarget({level:curLevel,mode:modeId,next:"pattern"});
        setScreen("calibration");
      } else {
        setScreen("pattern");
      }
    }
  };

  const handleCalDone = (cal) => {
    const {level,mode,next} = calTarget;
    setCals(prev=>{
      const lvCals = {...(prev[level]||{}), [mode]:cal};
      return {...prev, [level]:lvCals};
    });

    if(next==="checkFollow"){
      // コンボでテイクバック完了 → フォロー必要？
      const calData = cals[calTarget.level] || {};
      if(!calData.follow){
        setCalTarget({level:calTarget.level,mode:"follow",next:"pattern"});
        // stay on calibration screen - it re-renders with new mode
      } else {
        setScreen("pattern");
      }
    } else {
      setScreen("pattern");
    }
  };

  const handleCalSkip = (cal) => {
    handleCalDone(cal);
  };

  if(screen==="calibration"&&calTarget) return <CalibScreen level={calTarget.level} mode={calTarget.mode}
    onComplete={handleCalDone} onSkip={handleCalSkip}/>;

  if(screen==="home") return <HomeScreen cals={cals}
    onSelectLevel={handleGoTraining} onSelectMeasure={()=>{}}/>;

  if(screen==="levelSelect") return <LevelSelectScreen cals={cals}
    onSelectLevel={handleSelectLevel} onBack={()=>setScreen("home")}/>;

  if(screen==="modeSelect") return <ModeSelectScreen level={curLevel} cals={cals}
    onSelectMode={handleSelectMode} onBack={()=>setScreen("levelSelect")}/>;

  if(screen==="pattern") return <PatternScreen level={curLevel} mode={curMode}
    onSelect={p=>{setPattern(p);setScreen("practice")}} onBack={()=>setScreen("modeSelect")}/>;

  if(screen==="practice"){
    if(curMode==="combo"){
      const calData = cals[curLevel]||{};
      return <ComboPracticeScreen pattern={pattern} level={curLevel}
        calT={calData.takeaway} calF={calData.follow}
        onResult={(r,f)=>{setResults(r);setFrames(f);setScreen("result")}}
        onBack={()=>setScreen("pattern")}/>;
    }
    return <SinglePracticeScreen pattern={pattern} level={curLevel} mode={curMode}
      cal={(cals[curLevel]||{})[curMode]}
      onResult={(r,f)=>{setResults(r);setFrames(f);setScreen("result")}}
      onBack={()=>setScreen("pattern")}/>;
  }

  if(screen==="result"){
    if(curMode==="combo"){
      return <ComboResultScreen results={results} level={curLevel}
        calT={(cals[curLevel]||{}).takeaway} calF={(cals[curLevel]||{}).follow}
        onRetry={()=>setScreen("practice")} onHome={()=>setScreen("home")}/>;
    }
    return <SingleResultScreen results={results} frames={frames} level={curLevel} mode={curMode}
      cal={(cals[curLevel]||{})[curMode]}
      onRetry={()=>setScreen("practice")} onHome={()=>setScreen("home")}/>;
  }

  return null;
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
