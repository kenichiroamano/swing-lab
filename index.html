<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Golflev v10.0 - Golf Swing Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-main: #F8F5EF;
            --color-bg-card: #FFFFFF;
            --color-bg-secondary: #F0EDE7;
            --color-primary: #2D3B2D;
            --color-accent: #2D3B2D;
            --color-accent-light: #4A6B4A;
            --color-gold: #C8956C;
            --color-gold-light: #D4A97A;
            --color-text: #2D3B2D;
            --color-text-secondary: #8A8A82;
            --color-accent-text: #C8956C;
            --color-success: #4A6B4A;
            --color-warning: #D4A040;
            --color-error: #C45B4A;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', 'Noto Serif JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFFDF9 0%, #F8F5EF 100%);
            color: var(--color-text);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-top: env(safe-area-inset-top, 0);
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        /* TYPOGRAPHY */
        h1 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--color-text);
        }

        h2 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--color-text);
            margin: 1rem 0;
        }

        h3 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--color-text);
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: var(--color-gold);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .text-sm {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .text-tiny {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Noto Serif JP', 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--color-primary);
            color: #F8F5EF;
            box-shadow: 0 6px 24px rgba(45, 59, 45, 0.25);
            letter-spacing: 0.08em;
        }

        .btn-primary:active {
            box-shadow: 0 8px 32px rgba(45, 59, 45, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-primary);
        }

        .btn-secondary:active {
            background: rgba(45, 59, 45, 0.06);
        }

        .btn-success {
            background: var(--color-success);
            color: #F8F5EF;
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-secondary);
            border: none;
        }

        .btn-sm {
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: 1.25rem 2rem;
            font-size: 1.125rem;
            height: 56px;
        }

        .btn-block {
            display: flex;
            width: 100%;
        }

        /* CARDS */
        .card {
            background: var(--color-bg-card);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-gold), var(--color-primary));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-clickable {
            cursor: pointer;
            user-select: none;
        }

        /* LAYOUT */
        .header {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: transparent;
        }

        .content {
            flex: 1;
            padding: 0 1.5rem 1.5rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .footer {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1rem;
            background: white;
            border-top: 1px solid var(--color-bg-secondary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall .card {
            min-height: 200px;
        }

        .stack-v {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stack-h {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            align-items: center;
        }

        /* LOGO */
        .logo {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(200, 149, 108, 0.15);
            color: var(--color-gold);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        /* CARD TITLE AREA */
        .card-title-area {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-icon {
            font-size: 2.5rem;
        }

        .card-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(200, 149, 108, 0.12);
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.5;
                box-shadow: 0 0 20px rgba(200, 149, 108, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 40px rgba(200, 149, 108, 0.5);
            }
        }

        @keyframes confetti {
            0% {
                transform: translate(var(--tx), var(--ty)) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(calc(var(--tx) + 100px), calc(var(--ty) + 100px)) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drill-card {
            animation: slideInLeft 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* GAUGE/CIRCLE */
        .metric-circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFFFFF, var(--color-bg-secondary));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2rem auto;
            border: 2px solid var(--color-gold);
            position: relative;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(200, 149, 108, 0.15);
        }

        .metric-circle.success {
            border-color: var(--color-success);
            animation: successPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1), pulseGlow 2s infinite;
        }

        .metric-circle.fail {
            border-color: var(--color-error);
        }

        .metric-circle.waiting {
            animation: pulseGlow 1.5s infinite;
        }

        .metric-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 4rem;
            color: var(--color-primary);
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .metric-circle.success .metric-value {
            color: var(--color-success);
        }

        .metric-circle.fail .metric-value {
            color: var(--color-error);
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .metric-unit {
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        /* STATE INDICATORS */
        .state-badge {
            padding: 0.75rem 1.25rem;
            border-radius: 20px;
            font-weight: 600;
            text-align: center;
            margin: 1rem 0;
            letter-spacing: 0.02em;
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
        }

        .state-ready {
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
        }

        .state-recording {
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
            animation: pulse 1s infinite;
        }

        .state-waiting {
            background: rgba(138, 138, 130, 0.08);
            color: var(--color-text-secondary);
        }

        /* BACK BUTTON */
        .back-btn {
            padding: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: white;
            color: var(--color-primary);
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* DIFFICULTY CARD */
        .difficulty-card {
            padding: 1.25rem;
            border: 1.5px solid var(--color-bg-secondary);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .difficulty-card:active {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
        }

        .difficulty-card.selected {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
            box-shadow: 0 4px 16px rgba(200, 149, 108, 0.2);
        }

        .difficulty-name {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .difficulty-spec {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* SUCCESS/FAIL MESSAGE */
        .result-message {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin: 1.5rem 0;
            letter-spacing: 0.02em;
            animation: countUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-success {
            color: var(--color-success);
        }

        .result-fail {
            color: var(--color-error);
        }

        .result-tip {
            padding: 1rem;
            background: rgba(200, 149, 108, 0.08);
            border-radius: 12px;
            color: var(--color-text);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 1rem 0;
            border-left: 3px solid var(--color-gold);
        }

        /* METRIC EXPLANATION */
        .metric-explanation {
            padding: 1rem;
            background: white;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--color-text-secondary);
            margin: 1rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* COUNTER */
        .success-counter {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* RANGE INFO */
        .range-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .range-box {
            padding: 1rem;
            background: white;
            border-radius: 12px;
            text-align: center;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .range-label {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .range-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-gold);
        }

        .range-value.success {
            color: var(--color-success);
        }

        .range-value.danger {
            color: var(--color-error);
        }

        /* EXPANDABLE SECTION */
        .expandable-section {
            margin: 1rem 0;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .expandable-header {
            padding: 1rem;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            color: var(--color-text);
        }

        .expandable-header:active {
            background: rgba(200, 149, 108, 0.05);
        }

        .expandable-icon {
            display: inline-block;
            transition: transform 0.3s;
            font-size: 1.25rem;
            color: var(--color-gold);
        }

        .expandable-icon.open {
            transform: rotate(180deg);
        }

        .expandable-content {
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-bg-secondary);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .expandable-content a, .expandable-content .metric-note {
            color: var(--color-gold);
        }

        /* CALIBRATION STEP */
        .calibration-step {
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            text-align: center;
            margin: 1.5rem 0;
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .step-number {
            display: inline-flex;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent-light));
            color: #F8F5EF;
            font-weight: 700;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .step-title {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .step-desc {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        /* GRIP GUIDE */
        .grip-guide {
            padding: 1.5rem;
            background: rgba(200, 149, 108, 0.06);
            border-radius: 12px;
            border: 2px solid var(--color-gold);
            text-align: center;
            margin: 1.5rem 0;
        }

        .grip-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .grip-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 1rem;
            color: var(--color-text);
            line-height: 1.6;
        }

        /* HOME CARD SECTION */
        .mode-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .mode-card-icon {
            font-size: 2.5rem;
        }

        .mode-card-title {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .mode-card-desc {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* CONFETTI PARTICLE */
        .confetti-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        /* SAFE AREA */
        @supports (padding: max(0px)) {
            .container {
                padding-left: max(1.5rem, env(safe-area-inset-left));
                padding-right: max(1.5rem, env(safe-area-inset-right));
            }

            .header, .content, .footer {
                padding-left: max(1.5rem, env(safe-area-inset-left));
                padding-right: max(1.5rem, env(safe-area-inset-right));
            }
        }

        /* DRILL CATEGORY GRID */
        .drill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .drill-category-title {
            grid-column: 1 / -1;
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
            letter-spacing: 0.02em;
        }

        .drill-category-title:first-child {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // iOS SENSOR PERMISSION
        const requestSensorPermission = async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') {
                        alert("センサーの許可が必要です。設定からモーションセンサーを許可してください。");
                        return false;
                    }
                } catch(e) {
                    alert("センサー許可エラー: " + e.message);
                    return false;
                }
            }
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
            }
            return true;
        };

        // AUDIO UTILS
        let _audioCtx = null;
        const getAudioCtx = () => {
            if (!_audioCtx) {
                _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        };
        const AudioUtils = {
            beep: (freq = 800, duration = 150) => {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration / 1000);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration / 1000);
                } catch (e) {}
            },
            success: () => {
                AudioUtils.beep(1000, 200);
                setTimeout(() => AudioUtils.beep(1200, 200), 150);
            },
            fail: () => { AudioUtils.beep(400, 300); },
            click: () => { AudioUtils.beep(600, 100); },
            ready: () => {
                AudioUtils.beep(660, 120);
                setTimeout(() => AudioUtils.beep(880, 150), 150);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },
            perfect: () => {
                try {
