<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Golflev v10.0 - Golf Swing Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-main: #F8F5EF;
            --color-bg-card: #FFFFFF;
            --color-bg-secondary: #F0EDE7;
            --color-primary: #2D3B2D;
            --color-accent: #2D3B2D;
            --color-accent-light: #4A6B4A;
            --color-gold: #C8956C;
            --color-gold-light: #D4A97A;
            --color-text: #2D3B2D;
            --color-text-secondary: #8A8A82;
            --color-accent-text: #C8956C;
            --color-success: #4A6B4A;
            --color-warning: #D4A040;
            --color-error: #C45B4A;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', 'Noto Serif JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFFDF9 0%, #F8F5EF 100%);
            color: var(--color-text);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-top: env(safe-area-inset-top, 0);
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        /* TYPOGRAPHY */
        h1 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--color-text);
        }

        h2 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--color-text);
            margin: 1rem 0;
        }

        h3 {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--color-text);
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: var(--color-gold);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .text-sm {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .text-tiny {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Noto Serif JP', 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--color-primary);
            color: #F8F5EF;
            box-shadow: 0 6px 24px rgba(45, 59, 45, 0.25);
            letter-spacing: 0.08em;
        }

        .btn-primary:active {
            box-shadow: 0 8px 32px rgba(45, 59, 45, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-primary);
        }

        .btn-secondary:active {
            background: rgba(45, 59, 45, 0.06);
        }

        .btn-success {
            background: var(--color-success);
            color: #F8F5EF;
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-secondary);
            border: none;
        }

        .btn-sm {
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: 1.25rem 2rem;
            font-size: 1.125rem;
            height: 56px;
        }

        .btn-block {
            display: flex;
            width: 100%;
        }

        /* CARDS */
        .card {
            background: var(--color-bg-card);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-gold), var(--color-primary));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-clickable {
            cursor: pointer;
            user-select: none;
        }

        /* LAYOUT */
        .header {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: transparent;
        }

        .content {
            flex: 1;
            padding: 0 1.5rem 1.5rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .footer {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1rem;
            background: white;
            border-top: 1px solid var(--color-bg-secondary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-2-tall .card {
            min-height: 200px;
        }

        .stack-v {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stack-h {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            align-items: center;
        }

        /* LOGO */
        .logo {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(200, 149, 108, 0.15);
            color: var(--color-gold);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        /* CARD TITLE AREA */
        .card-title-area {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-icon {
            font-size: 2.5rem;
        }

        .card-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(200, 149, 108, 0.12);
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.5;
                box-shadow: 0 0 20px rgba(200, 149, 108, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 40px rgba(200, 149, 108, 0.5);
            }
        }

        @keyframes confetti {
            0% {
                transform: translate(var(--tx), var(--ty)) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(calc(var(--tx) + 100px), calc(var(--ty) + 100px)) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drill-card {
            animation: slideInLeft 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* GAUGE/CIRCLE */
        .metric-circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFFFFF, var(--color-bg-secondary));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2rem auto;
            border: 2px solid var(--color-gold);
            position: relative;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(200, 149, 108, 0.15);
        }

        .metric-circle.success {
            border-color: var(--color-success);
            animation: successPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1), pulseGlow 2s infinite;
        }

        .metric-circle.fail {
            border-color: var(--color-error);
        }

        .metric-circle.waiting {
            animation: pulseGlow 1.5s infinite;
        }

        .metric-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 4rem;
            color: var(--color-primary);
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .metric-circle.success .metric-value {
            color: var(--color-success);
        }

        .metric-circle.fail .metric-value {
            color: var(--color-error);
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .metric-unit {
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        /* STATE INDICATORS */
        .state-badge {
            padding: 0.75rem 1.25rem;
            border-radius: 20px;
            font-weight: 600;
            text-align: center;
            margin: 1rem 0;
            letter-spacing: 0.02em;
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
        }

        .state-ready {
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
        }

        .state-recording {
            background: rgba(200, 149, 108, 0.12);
            color: var(--color-gold);
            animation: pulse 1s infinite;
        }

        .state-waiting {
            background: rgba(138, 138, 130, 0.08);
            color: var(--color-text-secondary);
        }

        /* BACK BUTTON */
        .back-btn {
            padding: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: white;
            color: var(--color-primary);
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* DIFFICULTY CARD */
        .difficulty-card {
            padding: 1.25rem;
            border: 1.5px solid var(--color-bg-secondary);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .difficulty-card:active {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
        }

        .difficulty-card.selected {
            border-color: var(--color-gold);
            background: rgba(200, 149, 108, 0.06);
            box-shadow: 0 4px 16px rgba(200, 149, 108, 0.2);
        }

        .difficulty-name {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .difficulty-spec {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* SUCCESS/FAIL MESSAGE */
        .result-message {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin: 1.5rem 0;
            letter-spacing: 0.02em;
            animation: countUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-success {
            color: var(--color-success);
        }

        .result-fail {
            color: var(--color-error);
        }

        .result-tip {
            padding: 1rem;
            background: rgba(200, 149, 108, 0.08);
            border-radius: 12px;
            color: var(--color-text);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 1rem 0;
            border-left: 3px solid var(--color-gold);
        }

        /* METRIC EXPLANATION */
        .metric-explanation {
            padding: 1rem;
            background: white;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--color-text-secondary);
            margin: 1rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* COUNTER */
        .success-counter {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(74, 107, 74, 0.1);
            color: var(--color-success);
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* RANGE INFO */
        .range-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .range-box {
            padding: 1rem;
            background: white;
            border-radius: 12px;
            text-align: center;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .range-label {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .range-value {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-gold);
        }

        .range-value.success {
            color: var(--color-success);
        }

        .range-value.danger {
            color: var(--color-error);
        }

        /* EXPANDABLE SECTION */
        .expandable-section {
            margin: 1rem 0;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .expandable-header {
            padding: 1rem;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            color: var(--color-text);
        }

        .expandable-header:active {
            background: rgba(200, 149, 108, 0.05);
        }

        .expandable-icon {
            display: inline-block;
            transition: transform 0.3s;
            font-size: 1.25rem;
            color: var(--color-gold);
        }

        .expandable-icon.open {
            transform: rotate(180deg);
        }

        .expandable-content {
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-bg-secondary);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .expandable-content a, .expandable-content .metric-note {
            color: var(--color-gold);
        }

        /* CALIBRATION STEP */
        .calibration-step {
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            text-align: center;
            margin: 1.5rem 0;
            border: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .step-number {
            display: inline-flex;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent-light));
            color: #F8F5EF;
            font-weight: 700;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .step-title {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .step-desc {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        /* GRIP GUIDE */
        .grip-guide {
            padding: 1.5rem;
            background: rgba(200, 149, 108, 0.06);
            border-radius: 12px;
            border: 2px solid var(--color-gold);
            text-align: center;
            margin: 1.5rem 0;
        }

        .grip-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .grip-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 1rem;
            color: var(--color-text);
            line-height: 1.6;
        }

        /* HOME CARD SECTION */
        .mode-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .mode-card-icon {
            font-size: 2.5rem;
        }

        .mode-card-title {
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .mode-card-desc {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* CONFETTI PARTICLE */
        .confetti-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        /* SAFE AREA */
        @supports (padding: max(0px)) {
            .container {
                padding-left: max(1.5rem, env(safe-area-inset-left));
                padding-right: max(1.5rem, env(safe-area-inset-right));
            }

            .header, .content, .footer {
                padding-left: max(1.5rem, env(safe-area-inset-left));
                padding-right: max(1.5rem, env(safe-area-inset-right));
            }
        }

        /* DRILL CATEGORY GRID */
        .drill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .drill-category-title {
            grid-column: 1 / -1;
            font-family: 'Playfair Display', 'Noto Serif JP', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
            letter-spacing: 0.02em;
        }

        .drill-category-title:first-child {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // iOS SENSOR PERMISSION
        const requestSensorPermission = async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') {
                        alert("センサーの許可が必要です。設定からモーションセンサーを許可してください。");
                        return false;
                    }
                } catch(e) {
                    alert("センサー許可エラー: " + e.message);
                    return false;
                }
            }
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
            }
            return true;
        };

        // AUDIO UTILS
        let _audioCtx = null;
        const getAudioCtx = () => {
            if (!_audioCtx) {
                _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        };
        const AudioUtils = {
            beep: (freq = 800, duration = 150) => {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration / 1000);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration / 1000);
                } catch (e) {}
            },
            success: () => {
                AudioUtils.beep(1000, 200);
                setTimeout(() => AudioUtils.beep(1200, 200), 150);
            },
            fail: () => { AudioUtils.beep(400, 300); },
            click: () => { AudioUtils.beep(600, 100); },
            ready: () => {
                AudioUtils.beep(660, 120);
                setTimeout(() => AudioUtils.beep(880, 150), 150);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },
            perfect: () => {
                try {
                    const ctx = getAudioCtx();
                    const t = ctx.currentTime;
                    [880, 1108, 1318].forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = f; o.type = "sine";
                        g.gain.setValueAtTime(0, t + i * 0.1);
                        g.gain.linearRampToValueAtTime(0.4, t + i * 0.1 + 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.5);
                        o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.5);
                    });
                } catch(e) {}
            }
        };

        // SENSOR UTILS (v7.4 proven logic)
        const _prevAcc = { x: 0, y: 0, z: 0 };
        const calcJerk = (ax, ay, az) => {
            const j = Math.sqrt(
                (ax - _prevAcc.x) ** 2 + (ay - _prevAcc.y) ** 2 + (az - _prevAcc.z) ** 2
            );
            _prevAcc.x = ax; _prevAcc.y = ay; _prevAcc.z = az;
            return j;
        };

        const SensorUtils = {
            detectStillness: (history, threshold = 2.5, duration = 800) => {
                const now = Date.now();
                const recentData = history.filter(d => now - d.time < duration);
                if (recentData.length < 5) return false;
                const avgJerk = recentData.reduce((sum, d) => sum + (d.jerk || 0), 0) / recentData.length;
                const avgRot = recentData.reduce((sum, d) => sum + (d.rotMag || 0), 0) / recentData.length;
                return avgJerk < threshold && avgRot < 30;
            },

            detectMovement: (history, jerkThreshold = 3, rotThreshold = 50) => {
                if (history.length === 0) return false;
                const latest = history[history.length - 1];
                return (latest.jerk > jerkThreshold) || (latest.rotMag > rotThreshold);
            },

            detectStop: (history, jerkThreshold = 4, rotThreshold = 20, duration = 500) => {
                const now = Date.now();
                const recentData = history.filter(d => now - d.time < duration);
                if (recentData.length < 3) return false;
                return recentData.every(d =>
                    (d.jerk <= jerkThreshold) && (d.rotMag <= rotThreshold)
                );
            },

            calculateMetrics: (allData, baseline) => {
                if (!allData || allData.length < 10) return null;
                const bl = baseline || { beta: allData[0].beta, gamma: allData[0].gamma };

                // Find top of backswing (max beta delta from baseline)
                let maxDelta = -Infinity, topIdx = 0;
                for (let i = 5; i < allData.length - 5; i++) {
                    const delta = Math.abs(allData[i].beta - bl.beta);
                    if (delta > maxDelta) { maxDelta = delta; topIdx = i; }
                }

                const betaDelta = maxDelta;
                const backswingTime = allData[topIdx].time - allData[0].time;
                const downswingTime = allData[allData.length - 1].time - allData[topIdx].time;
                const tempo = downswingTime > 10 ? backswingTime / downswingTime : 0;

                const avgJerk = allData.reduce((sum, d) => sum + (d.jerk || 0), 0) / allData.length;
                const smoothness = Math.max(0, Math.min(100, Math.round(100 - avgJerk * 3)));

                // VFA at top (relative to baseline)
                const dGamma = allData[topIdx].gamma - bl.gamma;
                const dBeta = allData[topIdx].beta - bl.beta;
                const vfa = dGamma * Math.cos(dBeta * Math.PI / 180) + 0.2 * dBeta;

                return {
                    betaDelta: Math.round(betaDelta * 10) / 10,
                    tempo: Math.round(tempo * 10) / 10,
                    smoothness,
                    vfa: Math.round(vfa * 10) / 10,
                    backswingTime,
                    downswingTime,
                    topIdx,
                    dataPoints: allData.length,
                    durationMs: allData[allData.length - 1].time - allData[0].time
                };
            }

            const recordingDataRef = useRef([]);

            const drillConfig = {
                width: {
                    business: { easy: [15, 45], normal: [18, 38], hard: [20, 35] },

                },
                smoothness: {
                    business: { easy: 50, normal: 65, hard: 80 },
                    half: { easy: 50, normal: 65, hard: 80 }
                },
                tempo: {
                    business: { easy: [1.5, 5.0], normal: [2.0, 4.0], hard: [2.5, 3.5] },
                    half: { easy: [1.5, 5.0], normal: [2.0, 4.0], hard: [2.5, 3.5] }
                },
                face: {
                    business: { easy: 20, normal: 12, hard: 6 },
                    half: { easy: 18, normal: 10, hard: 5 }
                }
            };

            const config = drillConfig[drillId][zone][difficulty];

            // Single unified sensor effect
            useEffect(() => {
                if (stateRef.current === 'grip' || stateRef.current === 'stopped') return;

                const handleDeviceOrientation = (event) => {
                    orientRef.current = {
                        beta: event.beta || 0,
                        gamma: event.gamma || 0,
                        alpha: event.alpha || 0,
                    };
                    setDisplayAngle(Math.round(event.beta || 0));
                };

                const handleDeviceMotion = (event) => {
                    const rr = event.rotationRate || {};
                    const rotX = rr.beta || 0;
                    const rotY = rr.gamma || 0;
                    const rotZ = rr.alpha || 0;
                    const rotMag = Math.sqrt(rotX * rotX + rotY * rotY + rotZ * rotZ);
                    const a = event.accelerationIncludingGravity || event.acceleration || {};
                    const jerk = calcJerk(a.x || 0, a.y || 0, a.z || 0);
                    const now = Date.now();
                    const o = orientRef.current;

                    sensorHistoryRef.current.push({
                        time: now,
                        beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                        rotX, rotY, rotZ, rotMag, jerk
                    });
                    if (sensorHistoryRef.current.length > 500) sensorHistoryRef.current.shift();

                    // State machine
                    if (stateRef.current === 'waiting') {
                        if (SensorUtils.detectStillness(sensorHistoryRef.current)) {
                            baselineRef.current = { beta: o.beta, gamma: o.gamma, alpha: o.alpha };
                            stateRef.current = 'ready';
                            setState('ready');
                            AudioUtils.ready();

                            setState('recording');
                            recordingDataRef.current = [];
                            AudioUtils.beep(1000, 100);

                        recordingDataRef.current.push({
                            time: now,
                            beta: o.beta, gamma: o.gamma, alpha: o.alpha,
                            rotX, rotY, rotZ, rotMag, jerk
                        });

                        // Update display angle
                        if (baselineRef.current) {
                            const dBeta = Math.abs(o.beta - baselineRef.current.beta);
                            setDisplayAngle(Math.round(dBeta));
                        }

                        if (SensorUtils.detectStop(sensorHistoryRef.current)) {

                            setState('stopped');
                            const calcMetrics = SensorUtils.calculateMetrics(

                            if (calcMetrics) AudioUtils.success();
                            else AudioUtils.fail();

                        if (recordingDataRef.current.length > 0 &&

                            setState('stopped');
                            const calcMetrics = SensorUtils.calculateMetrics(
                                recordingDataRef.current, baselineRef.current
                            );
                            setMetrics(calcMetrics);
                        }

                };

                window.addEventListener('deviceorientation', handleDeviceOrientation);
                window.addEventListener('devicemotion', handleDeviceMotion);

                    </div>
                    <div className="content">
                        <div className="grip-guide">
                            <div className="grip-icon">📱</div>
                            <div className="grip-text">
                                スマートフォンを握ってください。<br/>
                                カメラは左を向いてください。
                            </div>
                        </div>
                        <button className="btn btn-primary btn-lg btn-block" onClick={handleGripConfirm}>
                            準備完了
                        </button>
                    </div>
                </div>
            );
        };

        // FREE MODE - CALIBRATION
        const FreeCalibrationScreen = ({ onComplete, onBack }) => {
            const [step, setStep] = useState(1);
            const [calibrationReady, setCalibrationReady] = useState(false);

            const handleStartCalibration = () => {
                AudioUtils.beep(1000, 150);
                setCalibrationReady(true);
            };

            return (
                <div className="screen">
                    <div className="header">
                        <button className="btn btn-ghost back-btn" onClick={onBack}>←</button>
                        <h2>キャリブレーション</h2>
                    </div>
                    <div className="content">
                        <p className="subtitle" style={{ textAlign: 'center', marginBottom: '2rem' }}>
                            3回のスイングで調整します
                        </p>

                        {[1, 2, 3].map(i => (
                            <div key={i} className={`calibration-step ${step >= i ? '' : ''}`} style={{ opacity: step >= i ? 1 : 0.5 }}>
                                <div className="step-number">{i}</div>
                                <div className="step-title">スイング {i}</div>
                                <div className="step-desc">
                                    {step === i && '下のボタンを押してから、いつものペースでスイングしてください。'}
                                    {step > i && '完了しました ✓'}
                                    {step < i && '前のステップを完了してください。'}
                                </div>
                            </div>
                        ))}

                        {step <= 3 && (
                            <button className="btn btn-primary btn-lg btn-block" onClick={() => {
                                AudioUtils.click();
                                handleStartCalibration();
                                setTimeout(() => {
                                    if (step < 3) {
                                        setStep(step + 1);
                                        setCalibrationReady(false);
                                    } else {
                                        AudioUtils.success();
                                        onComplete();
                                    }
                                }, 2000);
                            }} style={{ marginTop: '2rem' }}>
                                {step === 3 ? 'キャリブレーション完了' : `スイング ${step} を実行`}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // FREE MODE - EXECUTION
        const FreeExecutionScreen = ({ onComplete, onBack }) => {
            const [state, setState] = useState('waiting');
            const [displayAngle, setDisplayAngle] = useState(0);
            const [metrics, setMetrics] = useState(null);
            const [openSection, setOpenSection] = useState('basic');
            const sensorHistoryRef = useRef([]);
            const orientRef = useRef({ beta: 0, gamma: 0 });
            const baselineRef = useRef(null);
            const stateRef = useRef('waiting');
            const stillCountRef = useRef(0);
            const recordStartRef = useRef(0);

            useEffect(() => {
                stateRef.current = state;
            }, [state]);

            useEffect(() => {
                const handleDeviceOrientation = (event) => {
                    orientRef.current.beta = event.beta || 0;
                    orientRef.current.gamma = event.gamma || 0;
                    setDisplayAngle(Math.round(event.beta || 0));
                };

                const handleDeviceMotion = (event) => {
                    const rr = event.rotationRate || {};
                    const rotX = rr.beta || 0;
                    const rotY = rr.gamma || 0;
                    const rotZ = rr.alpha || 0;
                    const rotMag = Math.sqrt(rotX * rotX + rotY * rotY + rotZ * rotZ);
                    const a = event.accelerationIncludingGravity || event.acceleration || {};
                    const jerk = calcJerk(a.x || 0, a.y || 0, a.z || 0);

                    const now = Date.now();
                    const curState = stateRef.current;

                    sensorHistoryRef.current.push({
                        time: now,
                        beta: orientRef.current.beta,
                        gamma: orientRef.current.gamma,
                        rotX, rotY, rotZ, rotMag, jerk
                    });
                    if (sensorHistoryRef.current.length > 500) {
                        sensorHistoryRef.current.shift();
                    }

                    if (curState === 'waiting') {
                        if (jerk < 2.5 && rotMag < 30) {
                            stillCountRef.current++;
                            if (stillCountRef.current > 50) {
                                baselineRef.current = {
                                    beta: orientRef.current.beta,
                                    gamma: orientRef.current.gamma
                                };
                                setState('ready');
                                AudioUtils.beep(800, 150);
                            }
                        } else {
                            stillCountRef.current = 0;
                        }
                    }

                    if (curState === 'ready') {
                        if (jerk > 3 || rotMag > 50) {
                            sensorHistoryRef.current = [];
                            sensorHistoryRef.current.push({
                                time: now,
                                beta: orientRef.current.beta,
                                gamma: orientRef.current.gamma,
                                rotX, rotY, rotZ, rotMag, jerk
                            });
                            recordStartRef.current = now;
                            setState('recording');
                            AudioUtils.beep(1000, 100);
                        }
                    }

                    if (curState === 'recording') {
                        if (jerk < 4 && rotMag < 20 && (now - recordStartRef.current) > 300) {
                            stillCountRef.current++;
                            if (stillCountRef.current > 30) {
                                const allData = sensorHistoryRef.current;
                                const calcMetrics = SensorUtils.calculateMetrics(allData, baselineRef.current);
                                setState('stopped');
                                AudioUtils.success();
                                if (calcMetrics) setMetrics(calcMetrics);
                            }
                        } else {
                            stillCountRef.current = 0;
                        }
                        if ((now - recordStartRef.current) > 5000) {
                            const allData = sensorHistoryRef.current;
                            const calcMetrics = SensorUtils.calculateMetrics(allData, baselineRef.current);
                            setState('stopped');
                            AudioUtils.success();
                            if (calcMetrics) setMetrics(calcMetrics);
                        }
                    }
                };

                window.addEventListener('deviceorientation', handleDeviceOrientation);
                window.addEventListener('devicemotion', handleDeviceMotion);

                return () => {
                    window.removeEventListener('deviceorientation', handleDeviceOrientation);
                    window.removeEventListener('devicemotion', handleDeviceMotion);
                };
            }, []);

            if (state === 'waiting' || state === 'ready' || state === 'recording') {
                return (
                    <div className="screen">
                        <div className="header">
                            <h2>計測中</h2>
                        </div>
                        <div className="content">
                            <div className={`state-badge state-${state === 'ready' ? 'ready' : state === 'recording' ? 'recording' : 'waiting'}`}>
                                {state === 'waiting' && 'スイングしてください'}
                                {state === 'ready' && 'スイング準備完了'}
                                {state === 'recording' && '記録中...'}
                            </div>
                            <div className={`metric-circle ${state === 'recording' ? 'waiting' : ''}`}>
                                <div className="metric-value">{displayAngle}°</div>
                                <div className="metric-label">腕の角度</div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (state === 'stopped' && metrics) {
                return (
                    <div className="screen">
                        <div className="header">
                            <h2>計測結果</h2>
                        </div>
                        <div className="content">
                            <div className="expandable-section">
                                <div className="expandable-header" onClick={() => setOpenSection(openSection === 'basic' ? '' : 'basic')}>
                                    <span>基本データ</span>
                                    <span className={`expandable-icon ${openSection === 'basic' ? 'open' : ''}`}>▼</span>
                                </div>
                                {openSection === 'basic' && (
                                    <div className="expandable-content">
                                        <div className="range-info">
                                            <div className="range-box">
                                                <div className="range-label">振り幅</div>
                                                <div className="range-value">{metrics.betaDelta.toFixed(1)}°</div>
                                            </div>
                                            <div className="range-box">
                                                <div className="range-label">スムーズさ</div>
                                                <div className="range-value">{metrics.smoothness.toFixed(0)}%</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="expandable-section">
                                <div className="expandable-header" onClick={() => setOpenSection(openSection === 'tempo' ? '' : 'tempo')}>
                                    <span>テンポ・タイミング</span>
                                    <span className={`expandable-icon ${openSection === 'tempo' ? 'open' : ''}`}>▼</span>
                                </div>
                                {openSection === 'tempo' && (
                                    <div className="expandable-content">
                                        <div className="range-info">
                                            <div className="range-box">
                                                <div className="range-label">テンポ比率</div>
                                                <div className="range-value">{metrics.tempo.toFixed(2)}:1</div>
                                            </div>
                                            <div className="range-box">
                                                <div className="range-label">ダウン時間</div>
                                                <div className="range-value">{metrics.downswingTime.toFixed(0)}ms</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="expandable-section">
                                <div className="expandable-header" onClick={() => setOpenSection(openSection === 'mechanics' ? '' : 'mechanics')}>
                                    <span>スイング解析</span>
                                    <span className={`expandable-icon ${openSection === 'mechanics' ? 'open' : ''}`}>▼</span>
                                </div>
                                {openSection === 'mechanics' && (
                                    <div className="expandable-content">
                                        <div className="range-info">
                                            <div className="range-box">
                                                <div className="range-label">フェース角</div>
                                                <div className="range-value">{metrics.vfa.toFixed(1)}°</div>
                                            </div>
                                            <div className="range-box">
                                                <div className="range-label">バックスイング</div>
                                                <div className="range-value">{metrics.backswingTime.toFixed(0)}ms</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div style={{ marginTop: '2rem' }} className="stack-v">
                                <button className="btn btn-primary btn-lg btn-block" onClick={() => {
                                    AudioUtils.click();
                                    setState('waiting');
                                    setMetrics(null);
                                    setOpenSection('basic');
                                    sensorHistoryRef.current = [];
                                    stillCountRef.current = 0;
                                    baselineRef.current = null;
                                }}>
                                    もう一度計測
                                </button>
                                <button className="btn btn-secondary btn-lg btn-block" onClick={onBack}>
                                    ホームに戻る
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        // MAIN APP
        const App = () => {
            const [screen, setScreen] = useState('home');
            const [mode, setMode] = useState(null);
            const [zone, setZone] = useState(null);
            const [drill, setDrill] = useState(null);
            const [difficulty, setDifficulty] = useState(null);
            const [freeStep, setFreeStep] = useState('grip');

            const navigateTo = (newScreen) => {
                AudioUtils.click();
                setScreen(newScreen);
            };

            const goHome = () => {
                AudioUtils.click();
                setScreen('home');
                setMode(null);
                setZone(null);
                setDrill(null);
                setDifficulty(null);
                setFreeStep('grip');
            };

            return (
                <div className="container">
                    {screen === 'home' && (
                        <HomeScreen onSelectMode={(m) => {
                            setMode(m);
                            if (m === 'drill') {
                                setScreen('drill-category');
                            } else {
                                setScreen('free-grip');
                                setFreeStep('grip');
                            }
                        }} />
                    )}

                    {screen === 'drill-category' && mode === 'drill' && (
                        <DrillCategoryScreen
                            onSelectDrill={(z, d) => {
                                setZone(z);
                                setDrill(d);
                                setScreen('drill-difficulty');
                            }}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'drill-difficulty' && (
                        <DifficultyScreen
                            zone={zone}
                            drillId={drill}
                            onSelectDifficulty={(diff) => {
                                setDifficulty(diff);
                                setScreen('drill-execution');
                            }}
                            onBack={() => setScreen('drill-category')}
                        />
                    )}

                    {screen === 'drill-execution' && (
                        <DrillExecutionScreen
                            zone={zone}
                            drillId={drill}
                            difficulty={difficulty}
                            onComplete={() => setScreen('drill-category')}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'free-grip' && (
                        <FreeGripGuideScreen
                            onComplete={() => setScreen('free-calibration')}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'free-calibration' && (
                        <FreeCalibrationScreen
                            onComplete={() => setScreen('free-execution')}
                            onBack={goHome}
                        />
                    )}

                    {screen === 'free-execution' && (
                        <FreeExecutionScreen
                            onComplete={() => setScreen('home')}
                            onBack={goHome}
                        />
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
