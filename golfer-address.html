<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Golflev · Address Render Harness</title>
<style>
*{margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#F7F1E3;font-family:'Inter',sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:8px;bottom:8px;z-index:3;font-size:11px;color:#8A8A82;letter-spacing:.04em}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#B8804C;font-size:12px;letter-spacing:.2em;z-index:3;background:#F7F1E3}
</style>
<script>window.__err=[];window.onerror=m=>window.__err.push(String(m));</script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">LOADING…</div>
<div id="hud"></div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const PAPER=0xF7F1E3;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.9;

const scene=new THREE.Scene();
scene.background=new THREE.Color(PAPER);

const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,60);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const key=new THREE.DirectionalLight(0xfff0dd,2.0);
key.position.set(2.5,5,2.5); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=4;key.shadow.camera.bottom=-1;
key.shadow.radius=6; key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.PointLight(0xC8956C,12,18); rim.position.set(-3,2,-3); scene.add(rim);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),
  new THREE.MeshStandardMaterial({color:0xEDE6D5,roughness:.6}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const GOLD=new THREE.MeshStandardMaterial({color:0xc09455,metalness:1.0,roughness:0.2,envMapIntensity:1.1});
const ring=new THREE.Mesh(new THREE.TorusGeometry(0.95,0.015,16,128),GOLD);
ring.rotation.x=Math.PI/2; ring.position.y=0.012; scene.add(ring);

// カメラプリセット（被写体の足元中心 ~y0.95 を見る）
const TARGET=new THREE.Vector3(0,0.95,0);
const VIEWS={
  front:{pos:[0,1.35,4.6]},      // 正面（顔/胸がこちら）
  side: {pos:[4.6,1.35,0]},      // 側面（前傾・距離が分かる）
  dtl:  {pos:[0,1.35,-4.6]},     // 背面（飛球線後方）
};
let curFOV=32;
window.view=(name)=>{ const v=VIEWS[name]||VIEWS.front; camera.position.set(...v.pos); camera.lookAt(TARGET); hud(); };
window.zoom=(f)=>{ camera.fov=curFOV/f; camera.updateProjectionMatrix(); hud(); };
window.target=(x,y,z)=>{ TARGET.set(x,y,z); camera.lookAt(TARGET); hud(); };

let mixer=null, golfer=null, action=null, clipDur=0;
function hud(){ document.getElementById('hud').textContent=
  `t=${action?action.time.toFixed(3):'-'}/${clipDur.toFixed(2)} cam=[${camera.position.toArray().map(n=>n.toFixed(1))}] fov=${camera.fov.toFixed(0)}`; }

new FBXLoader().load('assets/golfer-chip.fbx',(fbx)=>{
  golfer=fbx; golfer.scale.setScalar(0.01);
  const bodyMeshes=[], jointMeshes=[];
  golfer.traverse(c=>{ if(c.isMesh){ c.castShadow=true;
    const n=((c.material&&c.material.name)||c.name||'').toLowerCase();
    (n.includes('joint')?jointMeshes:bodyMeshes).push(c); } });
  const GOLD_JOINT_RE=/Neck|Head|Shoulder|(Left|Right)Arm$|(Left|Right)ForeArm$|Hand|(Left|Right)Leg$|Foot|Toe/;
  function splitJointFaces(mesh){
    const geo=mesh.geometry;
    if(!geo.attributes.skinIndex || !mesh.skeleton) return false;
    const boneNames=mesh.skeleton.bones.map(b=>b.name||'');
    const si=geo.attributes.skinIndex, sw=geo.attributes.skinWeight, pos=geo.attributes.position;
    const comp=(a,v,j)=>a.array[v*a.itemSize+j];
    geo.computeBoundingBox(); const bb=geo.boundingBox;
    const mins=[bb.min.x,bb.min.y,bb.min.z], maxs=[bb.max.x,bb.max.y,bb.max.z];
    const sizes=[maxs[0]-mins[0],maxs[1]-mins[1],maxs[2]-mins[2]];
    const up=sizes.indexOf(Math.max(...sizes)); const lat=[0,1,2].filter(a=>a!==up);
    const H=sizes[up]; const c0=(maxs[lat[0]]+mins[lat[0]])/2, c1=(maxs[lat[1]]+mins[lat[1]])/2;
    const inTorso=v=>{ const p=[comp(pos,v,0),comp(pos,v,1),comp(pos,v,2)];
      const h=(p[up]-mins[up])/H; const r=Math.hypot(p[lat[0]]-c0,p[lat[1]]-c1); return h>0.44&&h<0.80&&r<0.095*H; };
    const hasIdx=!!geo.index;
    const faceCount=hasIdx?geo.index.count/3:geo.attributes.position.count/3;
    const vAt=hasIdx?(f,k)=>geo.index.array[f*3+k]:(f,k)=>f*3+k;
    const goldIdx=[], whiteIdx=[];
    for(let f=0;f<faceCount;f++){ let votes=0; const tri=[vAt(f,0),vAt(f,1),vAt(f,2)];
      for(const v of tri){ let best=0,bw=-1; for(let j=0;j<4;j++){const w=comp(sw,v,j);if(w>bw){bw=w;best=comp(si,v,j);}}
        if(!inTorso(v)&&GOLD_JOINT_RE.test(boneNames[best])) votes++; }
      (votes>=2?goldIdx:whiteIdx).push(tri[0],tri[1],tri[2]); }
    geo.setIndex(goldIdx.concat(whiteIdx)); geo.clearGroups();
    geo.addGroup(0,goldIdx.length,0); geo.addGroup(goldIdx.length,whiteIdx.length,1); return true;
  }
  const splitOk=jointMeshes.map(m=>splitJointFaces(m));
  const body=new THREE.MeshPhysicalMaterial({color:0xF2E8D6,metalness:0,roughness:.3,clearcoat:.55,clearcoatRoughness:.35,envMapIntensity:.7});
  const jointGold=new THREE.MeshStandardMaterial({color:0xC8956C,metalness:.95,roughness:.3,envMapIntensity:1.0});
  const jointWhite=new THREE.MeshPhysicalMaterial({color:0xF2E8D6,metalness:0,roughness:.22,clearcoat:.7,clearcoatRoughness:.25,envMapIntensity:.8});
  bodyMeshes.forEach(m=>m.material=body);
  jointMeshes.forEach((m,i)=>{ m.material=splitOk[i]?[jointGold,jointWhite]:jointGold; });
  scene.add(golfer);

  if(fbx.animations&&fbx.animations.length){
    mixer=new THREE.AnimationMixer(golfer);
    action=mixer.clipAction(fbx.animations[0]);
    clipDur=fbx.animations[0].duration;
    action.play(); action.paused=true;
    window.setT=(t)=>{ action.paused=true; action.time=Math.max(0,Math.min(clipDur,t)); mixer.update(0); hud(); };
    window.setT(0.10); // 初期＝アドレス候補
  }
  window.GL={scene,camera,renderer,mixer,golfer,action,get dur(){return clipDur;}};
  window.__golfer={anims:fbx.animations.length,dur:clipDur};
  window.view('front');
  document.getElementById('loading').style.display='none';
},undefined,(e)=>{ window.__err.push('FBX load: '+(e.message||e)); document.getElementById('loading').textContent='LOAD ERROR'; });

function animate(){ renderer.render(scene,camera); requestAnimationFrame(animate); }
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
